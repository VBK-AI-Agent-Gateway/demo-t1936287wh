<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克跳坑 · Tank Jump · 经典卡通版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hud-box"><span class="hud-icon">⭐</span><span id="score">0</span></div>
    <div class="hud-box"><span class="hud-icon">🚩</span>距离 <span id="dist">0</span>m</div>
    <div class="hud-box"><span class="hud-icon">❤️</span><span id="lives">3</span></div>
    <button id="btn-pause" class="hud-btn" title="暂停">⏸</button>
  </div>

  <div id="overlay-start" class="overlay">
    <div class="panel">
      <h1 class="title">🪖 坦克跳坑</h1>
      <p class="subtitle">经典卡通 · 蓄力飞跃深坑</p>
      <div class="howto">
        <p>⌨️ 按住 <b>空格</b> / <b>↑</b> / 点击屏幕 = 蓄力</p>
        <p>松开 = 起跳（蓄力越久跳得越高越远）</p>
        <p>🕳️ 越过深坑 +10，吃 ⭐ 星星 +50，掉坑 lose 1 ❤️</p>
      </div>
      <button id="btn-start" class="btn-main">▶ 开始游戏</button>
    </div>
  </div>

  <div id="overlay-pause" class="overlay hidden">
    <div class="panel">
      <h2>⏸ 已暂停</h2>
      <button id="btn-resume" class="btn-main">继续游戏</button>
    </div>
  </div>

  <div id="overlay-over" class="overlay hidden">
    <div class="panel">
      <h2 class="title-sm">💥 游戏结束</h2>
      <p>最终得分：<b id="final-score">0</b></p>
      <p>最远距离：<b id="final-dist">0</b>m</p>
      <p id="best-line">历史最佳：<b id="best-score">0</b></p>
      <button id="btn-restart" class="btn-main">🔄 再来一局</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
