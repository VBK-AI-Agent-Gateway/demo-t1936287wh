<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>坦克跳坑 · Tank Jump</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#0b0e14; overflow:hidden;
    font-family:"Courier New", ui-monospace, monospace; color:#d8e2c8; user-select:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { background:#7ec8e3; image-rendering:pixelated; display:block; }
  #hud { position:absolute; top:8px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 14px; font-size:14px; letter-spacing:1px; pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud b { color:#ffe259; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(6,8,14,.86); text-align:center; z-index:10; gap:14px; }
  .overlay.hidden { display:none; }
  .title { font-size:clamp(30px,7vw,64px); color:#ffe259; text-shadow:3px 3px 0 #b33, 6px 6px 0 #000;
    letter-spacing:6px; }
  .sub { color:#8fd18f; font-size:14px; line-height:1.9; }
  .btn { cursor:pointer; padding:12px 34px; font-size:18px; letter-spacing:3px; color:#0b0e14;
    background:linear-gradient(#ffe259,#f0a020); border:3px solid #fff; border-radius:6px;
    box-shadow:0 5px 0 #7a4d00, 0 8px 14px #000; font-weight:bold; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #7a4d00; }
  #finalScore { font-size:26px; color:#7ee8fa; }
  #touch { position:absolute; bottom:14px; left:0; right:0; display:none;
    justify-content:space-between; padding:0 16px; z-index:5; }
  .pad { display:flex; gap:12px; }
  .tb { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.18);
    border:2px solid rgba(255,255,255,.5); color:#fff; font-size:24px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  .tb:active { background:rgba(255,226,89,.55); }
  #sndBtn { position:absolute; top:6px; right:10px; z-index:6; cursor:pointer; font-size:18px;
    background:none; border:none; color:#fff; text-shadow:1px 1px 0 #000; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span id="stage">STAGE 1</span>
    <span>HP <b id="hp">♥♥♥♥♥</b></span>
  </div>
  <button id="sndBtn" title="音效开关">🔊</button>

  <div id="touch">
    <div class="pad">
      <div class="tb" data-k="left">◀</div>
      <div class="tb" data-k="right">▶</div>
    </div>
    <div class="pad">
      <div class="tb" data-k="jump">⤴</div>
      <div class="tb" data-k="fire">●</div>
    </div>
  </div>

  <div class="overlay" id="menu">
    <div class="title">坦克跳坑</div>
    <div class="sub">
      ← → / A D 移动 &nbsp;·&nbsp; ↑ / W / 空格 跳跃<br>
      X / J 射击 &nbsp;·&nbsp; 跨过坑洞 · 碾/射敌人 · 吃油箱<br>
      掉进坑洞或 HP 归零即失败，坚持到底冲高分！
    </div>
    <button class="btn" id="startBtn">开 始</button>
  </div>

  <div class="overlay hidden" id="over">
    <div class="title" style="color:#ff6b6b">GAME OVER</div>
    <div id="finalScore">0</div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<script>
"use strict";
/* ============ 基础 ============ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = 960; cv.height = 540;
const W = 960, H = 540;
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W*s|0)+'px'; cv.style.height = (H*s|0)+'px';
}
addEventListener('resize', resize); resize();

/* ============ 音效（WebAudio 合成） ============ */
let AC = null, sndOn = true;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function beep(freq, dur, type='square', vol=.15, slide=0){
  if(!sndOn) return;
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const SFX = {
  jump(){ beep(300,.18,'square',.12,400); },
  fire(){ beep(880,.09,'sawtooth',.10,-600); },
  boom(){ beep(90,.35,'sawtooth',.22,-60); },
  coin(){ beep(1200,.08,'square',.12); setTimeout(()=>beep(1600,.1,'square',.12),70); },
  hurt(){ beep(160,.3,'triangle',.2,-120); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'square',.14),i*110)); }
};
document.getElementById('sndBtn').onclick = e => {
  sndOn = !sndOn; e.target.textContent = sndOn ? '🔊' : '🔇';
};

/* ============ 输入 ============ */
const keys = {left:0,right:0,jump:0,fire:0};
const KEYMAP = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyX:'fire',KeyJ:'fire'};
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if(k){ keys[k]=1; e.preventDefault(); }});
addEventListener('keyup',   e => { const k = KEYMAP[e.code]; if(k){ keys[k]=0; e.preventDefault(); }});
document.querySelectorAll('.tb').forEach(b=>{
  const k = b.dataset.k;
  const on = ev=>{ ev.preventDefault(); keys[k]=1; };
  const off= ev=>{ ev.preventDefault(); keys[k]=0; };
  b.addEventListener('touchstart',on,{passive:false});
  b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});

/* ============ 常量与世界 ============ */
const GRAV = 0.62, GROUND_FRICTION = 0.86;
const P = { w:56, h:30 };
const TILE = 40;
let tiles = [], worldW = 0, worldH = 0, cam = 0;
let enemies = [], bullets = [], parts = [], pickups = [];
let player, score, hp, stage, state, ticks, goalX;
const STAGES = 5;

function stageParams(n){
  return { gapChance: 0.16 + n*0.045, maxGap: 3 + n,
    enemyChance: 0.10 + n*0.03, speed: 1.1 + n*0.25 };
}
function genStage(n){
  const rows = 10;
  const cols = 90 + n*22;
  worldW = cols*TILE; worldH = rows*TILE;
  tiles = Array.from({length:rows},()=>new Uint8Array(cols));
  const p = stageParams(n);
  let x = 0;
  while(x < cols){
    const runLen = 4 + (Math.random()*7|0);
    for(let i=0;i<runLen && x<cols;i++,x++) fillCol(x, rows);
    if(x>=cols-6){ for(;x<cols;x++) fillCol(x, rows); break; }
    if(Math.random() < p.gapChance){
      const gw = 2 + (Math.random()*p.maxGap|0);
      for(let i=0;i<gw && x<cols;i++,x++){ for(let y=0;y<rows;y++) tiles[y][x]=0; }
      if(Math.random()<.6 && x<cols-3)
        pickups.push({x:x*TILE+10, y:groundYAt(x*TILE)-70, got:false, type:'fuel'});
    }
  }
  for(let cx=14; cx<cols-8; cx++){
    const gx = cx*TILE;
    if(groundYAt(gx) < 1e8 && Math.random()<p.enemyChance)
      enemies.push({x:gx, y:groundYAt(gx)-28, w:44, h:26,
        vx:-p.speed*(Math.random()<.5?1:1.6), hp:2, t:0, dead:false});
    if(Math.random()<0.10) pickups.push({x:gx+10, y:groundYAt(gx)-60, got:false, type:'fuel'});
  }
  goalX = (cols-4)*TILE;
}
function fillCol(cx, rows){ if(cx>=0 && cx<tiles[0].length) for(let y=0;y<rows;y++) tiles[y][cx]=1; }
function groundYAt(x){
  if(x<0||x>=worldW) return Infinity;
  const cx = x/TILE|0;
  for(let y=0;y<tiles.length;y++) if(tiles[y][cx]) return y*TILE;
  return Infinity;
}
function solid(px,py){
  if(px<0||px>=worldW) return true;
  const cx = px/TILE|0, cy = py/TILE|0;
  if(cy<0||cy>=tiles.length) return false;
  return !!tiles[cy][cx];
}
function hitsGround(x,y,w,h){
  for(let px=x; px<=x+w; px+=TILE/2)
    for(let py=y; py<=y+h; py+=TILE/2)
      if(solid(px,py)) return true;
  return solid(x+w,y+h) || solid(x+w,y) || solid(x,y+h);
}

/* ============ 状态 ============ */
function resetGame(){
  enemies=[]; bullets=[]; parts=[]; pickups=[];
  player = {x:60, y:200, vx:0, vy:0, onGround:false, face:1, cool:0, inv:0, tread:0};
  score=0; hp=5; stage=1; ticks=0; cam=0;
  genStage(1); updateHUD();
}
function nextStage(){
  if(stage >= STAGES){ gameOver(true); return; }
  stage++; enemies=[]; bullets=[]; parts=[]; pickups=[];
  player.x=60; player.y=120; player.vx=0; player.vy=0; cam=0;
  genStage(stage); SFX.win(); flash('#7ee8fa', 60);
}
function spawnParts(x,y,color,n=10){
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7,
    life:30+Math.random()*20|0, c:color, s:2+Math.random()*4|0});
}
let flashC=null, flashT=0, shake=0;
function flash(c,t){ flashC=c; flashT=t; }
function hurt(dmg){
  if(player.inv>0) return;
  hp -= dmg; player.inv = 60; SFX.hurt(); shake=8; updateHUD();
  if(hp<=0) gameOver(false);
}

/* ============ 更新 ============ */
function update(){
  ticks++;
  if(shake>0) shake*=.85;
  if(flashT>0) flashT--;
  const p = player;
  const ACC = p.onGround ? 0.9 : 0.45;
  if(keys.left){ p.vx -= ACC; p.face=-1; }
  if(keys.right){ p.vx += ACC; p.face=1; }
  p.vx *= p.onGround ? GROUND_FRICTION : .985;
  p.vx = Math.max(-7.5, Math.min(7.5, p.vx));
  if(keys.jump && p.onGround){ p.vy = -13.2; p.onGround=false; SFX.jump(); }
  if(!keys.jump && p.vy < -5) p.vy = -5;
  p.vy += GRAV; if(p.vy>18) p.vy=18;
  if(p.cool>0) p.cool--;
  if(keys.fire && p.cool===0){
    bullets.push({x:p.x+(p.face>0?p.w:-8), y:p.y+8, vx:p.face*11, friendly:true, life:90});
    p.cool = 16; SFX.fire();
  }
  if(p.inv>0) p.inv--;

  p.x += p.vx;
  if(hitsGround(p.x,p.y,p.w,p.h)){
    while(hitsGround(p.x,p.y,p.w,p.h)) p.x -= Math.sign(p.vx)*2;
    p.vx=0;
  }
  p.y += p.vy;
  p.onGround=false;
  if(hitsGround(p.x,p.y,p.w,p.h)){
    while(hitsGround(p.x,p.y,p.w,p.h)) p.y -= Math.sign(p.vy)*2 || -1;
    if(p.vy>0) p.onGround=true;
    p.vy=0;
  }
  p.x = Math.max(0, Math.min(worldW-p.w, p.x));
  p.tread += Math.abs(p.vx);

  if(p.y > worldH + 60){
    hp--; SFX.hurt(); shake=10; updateHUD();
    if(hp<=0) return gameOver(false);
    p.x = Math.max(60, p.x-160);
    let gy = groundYAt(p.x);
    if(gy===Infinity){ p.x=60; gy=groundYAt(p.x); if(gy===Infinity) gy=200; }
    p.y = gy - P.h - 40; p.vx=0; p.vy=0; p.inv=90;
  }

  const target = p.x - W*0.38;
  cam += (target-cam)*0.12;
  cam = Math.max(0, Math.min(worldW-W, cam));

  for(const e of enemies){
    e.t++;
    e.x += e.vx;
    const ahead = e.x + (e.vx>0 ? e.w+6 : -6);
    const g = groundYAt(ahead);
    const wall = solid(ahead, e.y+e.h-4);
    if(g===Infinity || wall || e.x<10 || e.x>worldW-e.w-10){ e.vx*=-1; e.x+=e.vx*2; }
    e.y += 6;
    if(hitsGround(e.x,e.y,e.w,e.h)){
      while(hitsGround(e.x,e.y,e.w,e.h)) e.y -= 2;
    } else if(e.y>worldH+50){ e.dead=true; }
    if(!e.dead && player.inv===0 && aabb(p.x,p.y,p.w,p.h,e.x,e.y,e.w,e.h)){
      if(player.vy > 1 && p.y + p.h < e.y + e.h*0.6){
        e.dead=true; score+=150; SFX.boom();
        spawnParts(e.x+e.w/2, e.y+e.h/2, '#ff9f43', 16);
        player.vy = -9; updateHUD();
      } else hurt(1);
    }
  }
  enemies = enemies.filter(e=>!e.dead);

  for(const b of bullets){
    b.x += b.vx; b.life--;
    if(solid(b.x,b.y)){ b.life=0; spawnParts(b.x,b.y,'#ffe259',5); }
    if(b.friendly){
      for(const e of enemies){
        if(aabb(b.x,b.y,8,4,e.x,e.y,e.w,e.h)){
          b.life=0; e.hp--; SFX.boom();
          spawnParts(b.x,b.y,'#ff9f43',8);
          if(e.hp<=0){ e.dead=true; score+=100; spawnParts(e.x+e.w/2,e.y+e.h/2,'#ff6b6b',18); }
          updateHUD(); break;
        }
      }
    } else if(aabb(b.x,b.y,8,4,p.x,p.y,p.w,p.h)){ b.life=0; hurt(1); }
  }
  bullets = bullets.filter(b=>b.life>0 && b.x>cam-100 && b.x<cam+W+100);

  for(const it of pickups){
    if(it.got) continue;
    if(aabb(p.x,p.y,p.w,p.h,it.x,it.y,24,24)){
      it.got=true; score+=200; SFX.coin(); updateHUD();
      spawnParts(it.x+12,it.y+12,'#ffe259',8);
    }
  }
  for(const q of parts){ q.x+=q.vx; q.y+=q.vy; q.vy+=.3; q.life--; }
  parts = parts.filter(q=>q.life>0);
  if(p.onGround && Math.abs(p.vx)>2 && ticks%4===0)
    parts.push({x:p.x+(p.vx>0?4:p.w-4), y:p.y+p.h, vx:-p.vx*.2, vy:-Math.random()*1.5,
      life:18, c:'rgba(180,170,150,.6)', s:3});
  if(ticks%10===0){ score += 1 + (p.vx>3?1:0); updateHUD(); }
  if(p.x >= goalX) nextStage();
}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

/* ============ 渲染 ============ */
const PAL = { sky1:'#7ec8e3', sky2:'#cdeffd', dirt:'#7a5230', dirt2:'#5d3d22', grass:'#4c9a2a' };
function draw(){
  ctx.save();
  if(shake>.5) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  const gr = ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,PAL.sky1); gr.addColorStop(1,PAL.sky2);
  ctx.fillStyle=gr; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#8fbf7f';
  for(let i=0;i<8;i++){
    const mx = ((i*320 - cam*0.25) % (W+400) + W+400) % (W+400) - 200;
    ctx.beginPath(); ctx.moveTo(mx-160,H-120); ctx.lineTo(mx,H-260); ctx.lineTo(mx+160,H-120); ctx.fill();
  }
  ctx.fillStyle='#a5d6a7';
  for(let i=0;i<8;i++){
    const mx = ((i*260 - cam*0.45) % (W+360) + W+360) % (W+360) - 180;
    ctx.beginPath(); ctx.moveTo(mx-140,H-60); ctx.lineTo(mx,H-170); ctx.lineTo(mx+140,H-60); ctx.fill();
  }

  ctx.translate(-cam, 0);

  const c0 = Math.max(0, cam/TILE|0), c1 = Math.min(tiles[0].length-1, (cam+W)/TILE+1);
  for(let cx=c0; cx<=c1; cx++){
    for(let y=0; y<tiles.length; y++){
      if(!tiles[y][cx]) continue;
      const px=cx*TILE, py=y*TILE;
      ctx.fillStyle = PAL.dirt; ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle = PAL.dirt2; ctx.strokeRect(px+.5,py+.5,TILE-1,TILE-1);
      const above = y>0 ? tiles[y-1][cx] : 0;
      if(!above){ ctx.fillStyle=PAL.grass; ctx.fillRect(px,py,TILE,7);
        ctx.fillStyle='#66bb50'; ctx.fillRect(px,py+7,TILE,3); }
      const left = cx>0 ? tiles[y][cx-1] : 0;
      const right = cx<tiles[0].length-1 ? tiles[y][cx+1] : 0;
      if(!left){ ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(px,py,4,TILE); }
      if(!right){ ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(px+TILE-4,py,4,TILE); }
    }
  }

  const fy = groundYAt(goalX);
  if(fy<1e8){
    ctx.fillStyle='#333'; ctx.fillRect(goalX+16, fy-140, 5, 140);
    ctx.fillStyle='#ff4757';
    for(let i=0;i<4;i++) for(let j=0;j<4;j++)
      if((i+j)%2) ctx.fillRect(goalX+21+j*14, fy-140+i*14, 14, 14);
  }

  for(const it of pickups){
    if(it.got) continue;
    const bob = Math.sin(ticks/15 + it.x)*4;
    ctx.fillStyle='#c0392b'; ctx.fillRect(it.x, it.y+bob, 24, 22);
    ctx.fillStyle='#e74c3c'; ctx.fillRect(it.x+3, it.y+3+bob, 18, 7);
    ctx.fillStyle='#ffe259'; ctx.font='bold 10px monospace';
    ctx.fillText('F', it.x+9, it.y+20+bob);
  }

  for(const e of enemies) drawTank(e.x, e.y, e.vx>0?1:-1, false, e.t, e.hp);
  if(!(player.inv>0 && (ticks>>2)&1))
    drawTank(player.x, player.y, player.face, true, player.tread, 0);

  for(const b of bullets){
    ctx.fillStyle = b.friendly ? '#fff176' : '#ff5252';
    ctx.fillRect(b.x, b.y, 8, 4);
    ctx.fillStyle = b.friendly ? 'rgba(255,241,118,.4)' : 'rgba(255,82,82,.4)';
    ctx.fillRect(b.x - Math.sign(b.vx)*6, b.y, 6, 4);
  }
  for(const q of parts){
    ctx.globalAlpha = Math.min(1, q.life/20);
    ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,q.s,q.s);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(flashT>0){ ctx.fillStyle=flashC; ctx.globalAlpha=flashT/60*.4; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(player.x > goalX - W*0.5 && state==='play'){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(W/2-190, 70, 380, 44);
    ctx.fillStyle='#ffe259'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText('STAGE CLEAR！前进！', W/2, 100); ctx.textAlign='left';
  }
}

function drawTank(x, y, f, isP, tread, hpv){
  ctx.save();
  ctx.translate(x + (f<0 ? (isP?P.w:44) : 0), y);
  ctx.scale(f, 1);
  const body = isP ? '#2e7d32' : '#8e44ad';
  const dark = isP ? '#1b5e20' : '#5e2750';
  const w = isP ? P.w : 44, h = isP ? P.h : 26;
  ctx.fillStyle='#263238'; ctx.fillRect(0, h-10, w, 10);
  ctx.fillStyle='#455a64';
  for(let i=0;i<w;i+=8){
    const off = (tread|0)%8;
    ctx.fillRect(((i+off)%w), h-9, 4, 8);
  }
  ctx.fillStyle=body; ctx.fillRect(2, h-20, w-4, 12);
  ctx.fillStyle=dark; ctx.fillRect(2, h-10, w-4, 2);
  ctx.fillStyle=body; ctx.fillRect(w/2-11, h-30, 22, 12);
  ctx.fillStyle=dark; ctx.fillRect(w/2+6, h-27, w/2-2, 5);
  ctx.fillRect(w/2+w/2+3, h-28, 6, 7);
  ctx.fillStyle = isP ? '#ffe259' : '#ff8a80';
  ctx.fillRect(w-7, h-17, 4, 4);
  if(!isP && hpv>1){ ctx.fillStyle='#ff5252'; ctx.fillRect(w/2-4, h-34, 8, 3); }
  ctx.restore();
}

/* ============ HUD / 状态 ============ */
function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('hp').textContent = '♥'.repeat(Math.max(0,hp)) + '♡'.repeat(Math.max(0,5-hp));
  document.getElementById('stage').textContent = 'STAGE ' + stage;
}
function gameOver(win){
  state='over';
  document.getElementById('finalScore').textContent = (win?'🏆 全通关！ ':'') + 'SCORE ' + score;
  document.getElementById('over').classList.remove('hidden');
  if(win) SFX.win(); else SFX.boom();
}

/* ============ 主循环 ============ */
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){ update(); }
  draw();
}
document.getElementById('startBtn').onclick = () => {
  ac(); resetGame(); state='play';
  document.getElementById('menu').classList.add('hidden');
};
document.getElementById('againBtn').onclick = () => {
  resetGame(); state='play';
  document.getElementById('over').classList.add('hidden');
};
resetGame(); state='menu'; draw();
loop();
</script>
</body>
</html>
