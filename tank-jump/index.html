<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克跳坑 Tank Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <h1>坦克跳坑</h1>
  <div class="hud">
    <span>分数: <b id="score">0</b></span>
    <span>最高: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="640" height="360"></canvas>
  <div id="overlay" class="overlay">
    <div class="panel">
      <h2 id="ovTitle">坦克跳坑</h2>
      <p id="ovText">← → 移动 · 空格 / ↑ 跳跃<br>别掉进坑里！</p>
      <button id="btnStart">开始游戏</button>
    </div>
  </div>
  <p class="tip">操作: ← → 移动，空格/↑ 跳跃（空中可二段跳）</p>
</div>
<script src="game.js"></script>
</body>
</html>
