<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克跳坑 · Tank Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header>
    <h1>🚜 坦克跳坑 <span>TANK&nbsp;JUMP</span></h1>
    <div id="hud">
      <div class="stat">距离 <b id="score">0</b> m</div>
      <div class="stat">最佳 <b id="best">0</b> m</div>
      <div class="stat">状态 <b id="state">READY</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="960" height="480"></canvas>

    <div id="overlay" class="show">
      <div class="panel">
        <h2 id="ovTitle">坦克跳坑</h2>
        <p id="ovDesc">操控坦克跨越深渊坑洞，越远越好！<br>
          ← → / A D 移动　　↑ / W / 空格 跳跃</p>
        <button id="btnStart">开始游戏</button>
      </div>
    </div>
  </div>

  <div id="touch">
    <button class="tbtn" data-k="left">◀</button>
    <button class="tbtn" data-k="right">▶</button>
    <button class="tbtn jump" data-k="jump">JUMP</button>
  </div>

  <footer>经典版 · 方向键移动，空格/上键跳跃，掉进坑里就结束</footer>
</div>
<script src="game.js"></script>
</body>
</html>
