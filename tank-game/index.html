<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>铁甲突围 · 经典坦克网页版(战场背景)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; color:#ddd; font-family:"Courier New",monospace; height:100%; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:6px; }
  canvas { background:#000; image-rendering:pixelated; border:2px solid #444; touch-action:none; max-width:96vw; max-height:82vh; }
  #hud { display:flex; gap:22px; font-size:14px; letter-spacing:1px; flex-wrap:wrap; justify-content:center; }
  #hud b { color:#ffd75e; }
  #msg { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.85); text-align:center; z-index:5; padding:20px; }
  #msg h1 { color:#ffd75e; font-size:32px; margin-bottom:12px; text-shadow:3px 3px #7a3b00; }
  #msg p { color:#9fd0ff; margin:5px 0; font-size:14px; }
  #msg button { margin-top:18px; padding:12px 34px; font-size:18px; font-family:inherit; background:#c33; color:#fff; border:2px solid #f77; cursor:pointer; }
  #msg button:hover { background:#e55; }
  #lore { position:fixed; inset:0; background:linear-gradient(rgba(6,9,20,.72),rgba(6,9,20,.86)), url("source.png") center/cover no-repeat, #0b1020; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9; padding:24px; text-align:center; }
  #lore h1 { color:#ffd75e; font-size:30px; margin-bottom:6px; text-shadow:3px 3px #7a3b00; letter-spacing:2px; }
  #lore .era { color:#c66; letter-spacing:6px; font-size:14px; margin-bottom:18px; }
  #loreArt { width:min(420px,86vw); height:150px; image-rendering:pixelated; border:2px solid #444; background:#101830; margin-bottom:18px; }
  #loreText { color:#cfe3ff; font-size:15px; line-height:1.7; max-width:560px; min-height:96px; white-space:pre-wrap; }
  #loreCaret { color:#ffd75e; }
  #loreBtn { margin-top:20px; padding:12px 34px; font-size:18px; font-family:inherit; background:#c33; color:#fff; border:2px solid #f77; cursor:pointer; }
  #loreBtn:hover { background:#e55; }
  #brief { position:fixed; inset:0; background:rgba(5,8,16,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:8; text-align:center; padding:20px; }
  #brief h2 { color:#ffd75e; font-size:26px; margin-bottom:4px; }
  #brief .zone { color:#9fd0ff; letter-spacing:4px; font-size:13px; margin-bottom:14px; }
  #brief .intel { color:#cfe3ff; font-size:15px; line-height:1.7; max-width:540px; white-space:pre-wrap; }
  #brief button { margin-top:20px; padding:12px 34px; font-size:17px; font-family:inherit; background:#2a5; color:#fff; border:2px solid #5f8; cursor:pointer; }
  .hidden { display:none !important; }
  #touch { display:none; gap:8px; align-items:center; justify-content:center; width:100%; padding-top:4px; }
  .tb { width:54px; height:54px; font-size:22px; background:#222; border:2px solid #666; color:#ffd75e; border-radius:8px; user-select:none; -webkit-user-select:none; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>❤️ 生命 <b id="lives">3</b></span>
    <span>🏆 分数 <b id="score">0</b></span>
    <span>🚩 关卡 <b id="stage">1</b></span>
    <span>👾 敌军 <b id="enemies">0</b></span>
    <span>🔥 火力 <b id="power">1</b></span>
    <span>🗺️ 战区 <b id="zone">—</b></span>
  </div>
  <canvas id="cv" width="520" height="520" aria-label="坦克大战游戏画布"></canvas>
  <div id="touch">
    <button class="tb" data-k="ArrowUp" aria-label="上">▲</button>
    <button class="tb" data-k="ArrowLeft" aria-label="左">◀</button>
    <button class="tb" data-k="ArrowDown" aria-label="下">▼</button>
    <button class="tb" data-k="ArrowRight" aria-label="右">▶</button>
    <button class="tb" data-k="Space" aria-label="跳跃">🤸</button>
  </div>
</div>

<div id="lore" class="hidden">
  <h1>铁甲突围</h1>
  <div class="era">1944 — 1945 · 欧洲战场</div>
  <canvas id="loreArt" width="420" height="150" aria-label="战场像素画"></canvas>
  <div id="loreText"><span id="loreCaret">▌</span></div>
  <button id="loreBtn" class="hidden">进入战区简报 →</button>
</div>
<div id="brief" class="hidden">
  <h2 id="briefTitle">战区简报</h2>
  <div class="zone" id="briefZone"></div>
  <div class="intel" id="briefIntel"></div>
  <button id="briefBtn">发动进攻！</button>
</div>
<div id="msg">
  <h1 id="msgTitle">铁甲突围</h1>
  <p id="msgLine1">WASD / 方向键 移动 ｜ 空格 跳坑 ｜ J 开火 ｜ P 暂停</p>
  <p id="msgLine2">击毁全部敌军，保护基地（老鹰）！</p>
  <p>道具：🔧 升级火力 ｜ ❤ 加一命 ｜ ☢ 全屏轰炸</p>
  <button id="btn">开始游戏</button>
</div>
<script>
"use strict";
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var TILE = 26, COLS = 20, ROWS = 20, W = COLS * TILE, H = ROWS * TILE;

  var LORE = [
    { zone:"诺曼底灌木篱墙", era:"1944 · 法国", theme:"grass",
      brief:"敌军装甲纵队藏匿于树篱之间。\n你的任务：穿越灌木篱墙封锁线，\n击毁拦路坦克，夺取前沿阵地。\n地形：草地 + 泥泞壕沟，可击毁砖墙。" },
    { zone:"阿登森林", era:"1944 · 比利时", theme:"forest",
      brief:"严寒中敌军负隅顽抗。\n任务：沿林间小道突进，肃清残敌。\n地形：林地 + 钢制工事，火力点密集。" },
    { zone:"莱茵河渡口", era:"1945 · 德国", theme:"mud",
      brief:"渡河前哨站已暴露你的行踪。\n任务：突破河岸壕沟网，护送推进。\n地形：泥地 + 交叉堑壕，敌军增援频繁。" },
    { zone:"柏林街垒", era:"1945 · 柏林", theme:"street",
      brief:"最后的巷战。断壁残垣间处处伏击。\n任务：摧毁街垒守军，终结战役。\n地形：街道 + 废墟，无险可守，速战速决。" },
    { zone:"太平洋环礁", era:"1944 · 太平洋", theme:"sand",
      brief:"珊瑚岛礁上的意外遭遇战。\n任务：在开阔沙地歼灭守岛装甲。\n地形：沙地 + 弹坑，几乎无掩体。" }
  ];
  var THEME = {
    grass:  { ground:"#20351c", grid:"#1a2c17", decor:"#2c4a24" },
    forest: { ground:"#182a1e", grid:"#132117", decor:"#0f3b28" },
    mud:    { ground:"#2e2418", grid:"#241c12", decor:"#4a3a20" },
    street: { ground:"#26262e", grid:"#1d1d24", decor:"#3a3a44" },
    sand:   { ground:"#3a3624", grid:"#2e2b1c", decor:"#56503a" }
  };

  function zoneOf() { return LORE[(stage - 1) % LORE.length]; }

  // 用户提供的图片作为游戏战斗背景
  var bgImg = new Image();
  bgImg.src = "source.png";
  function drawBattleBg() {
    if (bgImg.complete && bgImg.naturalWidth > 0) {
      ctx.save();
      ctx.globalAlpha = 0.45;
      // 按 cover 比例铺满 520x520 画布
      var iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
      var s = Math.max(W / iw, H / ih);
      var dw = iw * s, dh = ih * s;
      ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.restore();
    }
  }

  function drawLoreArt() {
    var a = document.getElementById("loreArt"); if (!a) return;
    var g = a.getContext("2d");
    g.fillStyle = "#101830"; g.fillRect(0, 0, 420, 150);
    g.fillStyle = "#1c2b52"; g.fillRect(0, 0, 420, 60);
    g.fillStyle = "#ffd75e"; g.fillRect(350, 18, 16, 16);
    g.fillStyle = "#0d1424"; for (var i = 0; i < 40; i++) g.fillRect((i * 53) % 420, (i * 29) % 55, 2, 2);
    g.fillStyle = "#14261a"; g.fillRect(0, 60, 420, 90);
    g.fillStyle = "#1e3a22";
    for (i = 0; i < 14; i++) { var tx = i * 32 + 8; g.beginPath(); g.moveTo(tx, 70); g.lineTo(tx + 12, 40); g.lineTo(tx + 24, 70); g.fill(); }
    g.fillStyle = "#2a4a2a"; for (i = 0; i < 60; i++) g.fillRect((i * 47) % 420, 70 + ((i * 31) % 80), 3, 3);
    g.fillStyle = "#3a3226"; g.fillRect(0, 120, 420, 30);
    g.fillStyle = "#0a0a0a"; g.fillRect(60, 96, 70, 26); g.fillRect(78, 84, 34, 14); g.fillRect(108, 88, 46, 6);
    g.fillStyle = "#d9a441"; g.fillRect(64, 100, 62, 18); g.fillRect(82, 88, 26, 10);
    g.fillStyle = "#111"; g.fillRect(66, 118, 14, 14); g.fillRect(112, 118, 14, 14);
    g.fillStyle = "#555"; g.fillRect(68, 121, 8, 8); g.fillRect(114, 121, 8, 8);
    g.fillStyle = "#c66"; g.fillRect(300, 96, 50, 20); g.fillRect(316, 88, 30, 10);
    g.fillStyle = "#000"; g.fillRect(302, 112, 10, 10); g.fillRect(338, 112, 10, 10);
    g.fillStyle = "#ffd75e"; g.font = "12px 'Courier New',monospace"; g.textAlign = "left";
    g.fillText("EST. 1944 — ARMORED BREAKOUT", 12, 142);
  }

  var loreFull = "1944年，诺曼底登陆后的欧洲战场。\n你是一名孤军深入的坦克手，奉命驾驶铁甲战车穿越壕沟密布的封锁线。\n\n灌木篱墙后埋伏着敌军装甲，堑壕与废墟间寸步难行。\n唯有击毁拦路之敌，才能一路突进，直捣敌阵核心。\n\n历史，将由履带碾过的地方书写。";
  function showLore() {
    var el = document.getElementById("lore"); if (!el) return;
    el.classList.remove("hidden"); drawLoreArt();
    var t = document.getElementById("loreText"), i = 0;
    var caret = '<span id="loreCaret">\u25CC</span>';
    (function type() {
      if (!document.getElementById("lore").classList.contains("hidden")) {
        t.innerHTML = loreFull.slice(0, i) + caret; i++;
        if (i <= loreFull.length) setTimeout(type, 28);
        else document.getElementById("loreBtn").classList.remove("hidden");
      }
    })();
  }
  function showBrief() {
    document.getElementById("lore").classList.add("hidden");
    var z = zoneOf();
    document.getElementById("briefZone").textContent = z.era + " · " + z.zone;
    document.getElementById("briefTitle").textContent = "战区简报 · 第 " + stage + " 关";
    document.getElementById("briefIntel").textContent = z.brief;
    document.getElementById("brief").classList.remove("hidden");
  }
  cv.width = W; cv.height = H;
  function $(id) { return document.getElementById(id); }
  var msgEl = $("msg"), btn = $("btn");
  var hud = { lives: $("lives"), score: $("score"), stage: $("stage"), enemies: $("enemies"), power: $("power") };

  var BASE_MAP = [
    "....................",
    "....................",
    ".#.#.#..##..#.#.#.#.",
    ".#.#.#..##..#.#.#.#.",
    ".#.#.#......#.#.#.#.",
    "...S...#..#...S.....",
    ".#####.#..#.#####...",
    "......#....#........",
    ".##.#.######.#.##...",
    ".##.#........#.##...",
    ".....#.SS.#.........",
    ".#.#.#....#.#.#.....",
    ".#.#...BB...#.#.....",
    ".#.#.#.BB.#.#.#.....",
    "......####..........",
    ".####......####.....",
    ".#..#..##..#..#.....",
    ".....E..P...E.......",
    "....................",
    "...................."];

  var grid, tank, bullets, enemyBullets, enemies, powerups, particles, pits;
  var keys = {}, score, lives, stage, enemiesLeft, spawnQueue, spawnTimer;
  var power, baseAlive, state, fireCd, clearTimer;
  var jump = { on: false, t: 0, dur: 14, cd: 0, hop: 34 };

  function buildGrid() {
    grid = []; pits = [];
    for (var r = 0; r < ROWS; r++) {
      var row = [];
      var line = BASE_MAP[r] || "";
      for (var c = 0; c < COLS; c++) {
        var ch = line[c] || ".";
        row.push(ch === "#" ? 1 : ch === "S" ? 2 : ch === "X" ? 3 : 0);
      }
      grid.push(row);
    }
    // 随机生成坑洞(值=3)——跳坑玩法核心
    var c2 = [];
    for (var x = 2; x < COLS - 2; x += 4) c2.push(x);
    for (var i = c2.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = c2[i]; c2[i] = c2[j]; c2[j] = t; }
    var n = Math.min(c2.length, 3 + stage);
    var pr = 16;
    for (i = 0; i < n; i++) {
      var pc = c2[i];
      grid[pr][pc] = 3;
      if (Math.random() < 0.4 && pc + 1 < COLS - 2) { grid[pr][pc + 1] = 3; }
      pits.push({ r: pr, c: pc });
    }
  }
  function cellOf(x, y) { return [Math.floor(y / TILE), Math.floor(x / TILE)]; }
  function solidAt(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    var cell = cellOf(x, y), r = cell[0], c = cell[1];
    if (grid[r][c] === 1 || grid[r][c] === 2) return true; // 坑洞(3)不算实体
    if (baseAlive && r >= 11 && r <= 13 && c >= 8 && c <= 9) return true;
    return false;
  }
  function rectFree(x, y, w, h) {
    return !solidAt(x, y) && !solidAt(x + w - 1, y) && !solidAt(x, y + h - 1) && !solidAt(x + w - 1, y + h - 1)
      && !solidAt(x + ((w - 1) >> 1), y) && !solidAt(x + ((w - 1) >> 1), y + h - 1);
  }

  function spawnPlayer() {
    tank = { x: 9 * TILE + 2, y: 17 * TILE + 2, w: 22, h: 22, dir: "up", speed: 1.7, inv: 90, anim: 0 };
    power = Math.max(power || 1, 1); fireCd = 0;
  }
  function spawnEnemy() {
    var cols = [1, 9, 17];
    var c = cols[Math.floor(Math.random() * 3)];
    var x = c * TILE + 2, y = 2;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (Math.abs(e.x - x) < 26 && e.y < 44) return false;
    }
    var fast = Math.random() < 0.35;
    enemies.push({ x: x, y: y, w: 22, h: 22, dir: "down",
      speed: fast ? 1.5 : 0.9 + stage * 0.08,
      hp: 1, anim: 0, shootCd: 60 + Math.random() * 60, aiCd: 0, born: 30, fast: fast });
    return true;
  }
  function resetStage() {
    buildGrid(); bullets = []; enemyBullets = []; enemies = []; powerups = []; particles = [];
    spawnQueue = 8 + stage * 2; spawnTimer = 30;
    baseAlive = true; power = 1; spawnPlayer();
    enemiesLeft = spawnQueue;
  }
  function startGame() {
    score = 0; lives = 3; stage = 1; resetStage();
    $("msgTitle").textContent = "铁甲突围";
    $("msgLine1").textContent = "WASD / 方向键 移动 ｜ 空格 跳坑 ｜ J 开火 ｜ P 暂停";
    $("msgLine2").textContent = "穿越封锁线，击毁全部敌军，保护基地（老鹰）！";
    btn.textContent = "开始游戏";
    msgEl.classList.add("hidden");
    state = "play"; updateHUD();
    showLore(); // 开场背景故事
  }
  function updateHUD() {
    hud.lives.textContent = lives; hud.score.textContent = score;
    hud.stage.textContent = stage; hud.enemies.textContent = enemiesLeft;
    hud.power.textContent = power;
    var zEl = document.getElementById("zone"); if (zEl) zEl.textContent = zoneOf().zone;
  }

  // ---- 输入 ----
  addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " ") { keys["Space"] = true; e.preventDefault(); }
    else if (k.length === 1) keys[k.toLowerCase()] = true;
    else keys[k] = true;
    if (k === "p" || k === "P") {
      if (state === "play") state = "pause";
      else if (state === "pause") state = "play";
    }
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(k) >= 0) e.preventDefault();
  });
  addEventListener("keyup", function (e) {
    var k = e.key;
    if (k === " ") keys["Space"] = false;
    else if (k.length === 1) keys[k.toLowerCase()] = false;
    else keys[k] = false;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tb"), function (b) {
    var k = b.dataset.k;
    function on(e) { e.preventDefault(); keys[k] = true; }
    function off(e) { e.preventDefault(); keys[k] = false; }
    b.addEventListener("touchstart", on, { passive: false });
    b.addEventListener("touchend", off, { passive: false });
    b.addEventListener("touchcancel", off, { passive: false });
  });
  btn.onclick = startGame;
  document.getElementById("loreBtn").onclick = showBrief;
  document.getElementById("briefBtn").onclick = function () {
    document.getElementById("brief").classList.add("hidden");
  };

  var DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  function updatePlayer() {
    if (!tank) return;
    if (tank.inv > 0) tank.inv--;
    if (jump.cd > 0) jump.cd--;
    // 跳跃键: 空格触发跳跃
    if (keys["Space"] && !jump.on && jump.cd === 0) {
      jump.on = true; jump.t = 0; jump.cd = 26;
    }
    if (jump.on) {
      jump.t++;
      if (jump.t >= jump.dur) jump.on = false;
    }
    var dx = 0, dy = 0, sp = tank.speed;
    var up = keys["w"] || keys["ArrowUp"], dn = keys["s"] || keys["ArrowDown"];
    var lf = keys["a"] || keys["ArrowLeft"], rt = keys["d"] || keys["ArrowRight"];
    if (up) { tank.dir = "up"; dy = -sp; }
    else if (dn) { tank.dir = "down"; dy = sp; }
    else if (lf) { tank.dir = "left"; dx = -sp; }
    else if (rt) { tank.dir = "right"; dx = sp; }
    if (dx || dy) {
      tank.anim += 0.2;
      if (dx) {
        if (rectFree(tank.x + dx, tank.y, tank.w, tank.h)) tank.x += dx;
        else tryFallOrJumpCross(dx, 0);
      } else {
        if (rectFree(tank.x, tank.y + dy, tank.w, tank.h)) tank.y += dy;
        else tryFallOrJumpCross(0, dy);
      }
    }
    // 检查坦克脚下是否是坑洞(非跳跃状态)
    if (!jump.on) {
      var cx = tank.x + tank.w / 2, cy = tank.y + tank.h / 2;
      var cell = cellOf(cx, cy);
      if (grid[cell[0]] && grid[cell[0]][cell[1]] === 3) {
        fallInPit();
      }
    }
    if (fireCd > 0) fireCd--;
    // J 单独开火(空格已用于跳跃)
    if ((keys["j"] || keys["J"]) && fireCd === 0) {
      var maxB = power >= 2 ? 2 : 1;
      var mine = 0;
      for (var i = 0; i < bullets.length; i++) if (bullets[i].owner === "p") mine++;
      if (mine < maxB) { fire(); fireCd = power >= 3 ? 12 : 18; }
    }
  }
  // 跳跃跨越/坠落判定: 移动被墙(含坑边缘)挡住时, 跳跃状态下可越过单格坑洞
  function tryFallOrJumpCross(dx, dy) {
    if (!jump.on) return;
    var nx = tank.x + dx * 2, ny = tank.y + dy * 2;
    if (rectFree(nx, ny, tank.w, tank.h)) { tank.x = nx; tank.y = ny; return; }
    // 跳跃中若前方是坑洞则允许跨越
    var ahead = cellOf(nx + tank.w / 2 + dx * 4, ny + tank.h / 2 + dy * 4);
    if (grid[ahead[0]] && grid[ahead[0]][ahead[1]] === 3) {
      tank.x = nx; tank.y = ny;
    }
  }
  function fallInPit() {
    if (!tank || tank.inv > 0) return;
    burst(tank.x + tank.w / 2, tank.y + tank.h / 2, "#333", 14);
    lives--;
    updateHUD();
    if (lives <= 0) { gameOver(); return; }
    spawnPlayer();
  }
  function fire() {
    var d = DIRV[tank.dir];
    bullets.push({ x: tank.x + tank.w / 2 - 3 + d[0] * 12, y: tank.y + tank.h / 2 - 3 + d[1] * 12,
      w: 6, h: 6, vx: d[0] * (power >= 4 ? 7 : 5), vy: d[1] * (power >= 4 ? 7 : 5),
      owner: "p", dmg: power >= 3 ? 2 : 1, life: 140 });
  }

  function updateEnemies() {
    var dirNames = ["up", "down", "left", "right"];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.born > 0) { e.born--; continue; }
      e.anim += 0.15;
      if (e.aiCd > 0) e.aiCd--;
      if (e.aiCd === 0) {
        if (Math.random() < 0.5 && baseAlive) {
          var bx = 9 * TILE, by = 12 * TILE;
          var ddx = bx - e.x, ddy = by - e.y;
          e.dir = Math.abs(ddx) > Math.abs(ddy) ? (ddx < 0 ? "left" : "right") : (ddy < 0 ? "up" : "down");
        } else e.dir = dirNames[Math.floor(Math.random() * 4)];
        e.aiCd = 40 + Math.random() * 70;
      }
      var d = DIRV[e.dir];
      if (!rectFree(e.x + d[0] * e.speed, e.y + d[1] * e.speed, e.w, e.h)) {
        if (Math.random() < 0.35) hitBrick(e.x + e.w / 2 + d[0] * 14, e.y + e.h / 2 + d[1] * 14);
        e.aiCd = 0;
      } else { e.x += d[0] * e.speed; e.y += d[1] * e.speed; }
      if (e.x < 0) e.x = 0;
      if (e.y < 0) e.y = 0;
      if (e.shootCd > 0) e.shootCd--;
      if (e.shootCd === 0) {
        e.shootCd = Math.max(45, 110 - stage * 6) + Math.random() * 40;
        enemyBullets.push({ x: e.x + e.w / 2 - 3 + d[0] * 12, y: e.y + e.h / 2 - 3 + d[1] * 12,
          w: 6, h: 6, vx: d[0] * (2.5 + stage * 0.25), vy: d[1] * (2.5 + stage * 0.25),
          owner: "e", life: 160 });
      }
      if (tank && tank.inv === 0 && overlap(tank, e)) killPlayer();
    }
  }
  function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function hitBrick(cx, cy) {
    var cell = cellOf(cx, cy), r = cell[0], c = cell[1];
    if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return false;
    if (grid[r][c] === 1) { grid[r][c] = 0; burst(c * TILE + 13, r * TILE + 13, "#b5651d", 6); return true; }
    if (grid[r][c] === 2) burst(cx, cy, "#aaa", 4);
    return false;
  }

  function updateBullets(list) {
    for (var i = list.length - 1; i >= 0; i--) {
      var b = list[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      var dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > W || b.y > H;
      if (!dead) {
        var cell = cellOf(b.x + 3, b.y + 3), r = cell[0], c = cell[1];
        if (r >= 0 && c >= 0 && r < ROWS && c < COLS && grid[r][c]) {
          if (grid[r][c] === 1) { grid[r][c] = 0; burst(c * TILE + 13, r * TILE + 13, "#b5651d", 6); }
          else burst(b.x, b.y, "#ccc", 4);
          if (b.owner === "p") score += 5;
          dead = true;
        } else if (baseAlive && b.x + 3 >= 8 * TILE && b.x + 3 < 10 * TILE && b.y + 3 >= 11 * TILE && b.y + 3 <= 13 * TILE) {
          if (b.owner === "e") destroyBase();
          dead = true;
        }
      }
      if (!dead) {
        if (b.owner === "p") {
          for (var j = enemies.length - 1; j >= 0; j--) {
            var e = enemies[j];
            if (e.born > 0) continue;
            if (overlap(b, e)) {
              e.hp -= b.dmg; dead = true;
              burst(b.x, b.y, "#ff5", 6);
              if (e.hp <= 0) {
                enemies.splice(j, 1); enemiesLeft--;
                score += e.fast ? 200 : 100;
                burst(e.x + 11, e.y + 11, "#fa0", 14);
                maybeDropPowerup(e.x, e.y);
                updateHUD();
                if (enemiesLeft <= 0 && spawnQueue <= 0) winStage();
              }
              break;
            }
          }
        } else if (tank && tank.inv === 0 && overlap(b, tank)) {
          dead = true; killPlayer();
        }
      }
      if (dead) list.splice(i, 1);
    }
  }
  function maybeDropPowerup(x, y) {
    if (Math.random() < 0.3 && powerups.length < 2) {
      var kinds = ["power", "life", "bomb"];
      powerups.push({ x: Math.round(x / TILE) * TILE, y: Math.round(y / TILE) * TILE,
        kind: kinds[Math.floor(Math.random() * 3)], t: 600 });
    }
  }
  function destroyBase() {
    baseAlive = false;
    burst(9 * TILE, 12 * TILE, "#f80", 26);
    gameOver("基地被摧毁！");
  }
  function killPlayer() {
    if (!tank) return;
    burst(tank.x + 11, tank.y + 11, "#5cf", 20);
    lives--;
    if (lives <= 0) { tank = null; gameOver("坦克全灭！"); }
    else spawnPlayer();
    updateHUD();
  }
  function updatePowerups() {
    for (var i = powerups.length - 1; i >= 0; i--) {
      var p = powerups[i]; p.t--;
      if (p.t <= 0) { powerups.splice(i, 1); continue; }
      if (tank && overlap(tank, p)) {
        if (p.kind === "power") power = Math.min(4, power + 1);
        if (p.kind === "life") lives++;
        if (p.kind === "bomb") {
          for (var k = 0; k < enemies.length; k++) { var e = enemies[k]; burst(e.x + 11, e.y + 11, "#fa0", 12); score += 100; }
          enemiesLeft = Math.max(0, enemiesLeft - enemies.length);
          enemies.length = 0;
          if (spawnQueue <= 0) winStage();
        }
        powerups.splice(i, 1); updateHUD();
      }
    }
  }
  function winStage() {
    if (state !== "play") return;
    score += 500; stage += 1; resetStage(); updateHUD();
    showBrief(); // 关卡间战区背景简报过场
    state = "play";
  }
  function gameOver(text) {
    state = "over";
    msgEl.classList.remove("hidden");
    $("msgTitle").textContent = "游戏结束";
    $("msgLine1").textContent = text;
    $("msgLine2").textContent = "最终分数 " + score + " ｜ 到达关卡 " + stage;
    btn.textContent = "再来一局";
  }
  function burst(x, y, color, n) {
    n = n || 8;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 20 + Math.random() * 15, color: color });
    }
  }
  function updateParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---- 绘制 ----
  function drawTank(t, color, isEnemy) {
    ctx.save();
    ctx.translate(t.x + t.w / 2, t.y + t.h / 2);
    var rot = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[t.dir];
    ctx.rotate(rot);
    if (t.inv > 0 && (t.inv >> 2) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#333";
    ctx.fillRect(-11, -11, 6, 22); ctx.fillRect(5, -11, 6, 22);
    ctx.fillStyle = color;
    ctx.fillRect(-5, -9, 10, 18);
    ctx.fillStyle = "#eee";
    ctx.fillRect(-2, -16, 4, 8);
    ctx.fillStyle = (Math.floor(t.anim) % 2) ? "#666" : "#888";
    ctx.fillRect(-11, -11, 6, 4); ctx.fillRect(-11, 7, 6, 4);
    ctx.fillRect(5, -11, 6, 4); ctx.fillRect(5, 7, 6, 4);
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(0, 1, 4, 0, Math.PI * 2); ctx.fill();
    if (isEnemy && t.fast) { ctx.fillStyle = "#8ff"; ctx.fillRect(-4, -11, 8, 3); }
    ctx.restore();
  }
  function drawBase() {
    var x = 8 * TILE, y = 11 * TILE;
    ctx.save();
    ctx.strokeStyle = baseAlive ? "#8a5" : "#555"; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, 2 * TILE, 2 * TILE);
    ctx.font = "30px serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.fillText(baseAlive ? "🦅" : "💥", x + TILE, y + TILE + 11);
    ctx.restore();
  }
  function drawPowerup(p) {
    var map = { power: "🔧", life: "❤️", bomb: "☢️" };
    if (p.t < 120 && (p.t >> 3) % 2 === 0) return;
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(p.x, p.y, TILE, TILE);
    ctx.strokeStyle = "#ffd75e"; ctx.strokeRect(p.x + .5, p.y + .5, TILE - 1, TILE - 1);
    ctx.font = "16px serif"; ctx.textAlign = "center";
    ctx.fillText(map[p.kind], p.x + TILE / 2, p.y + TILE - 6);
  }
  function draw() {
    var th = THEME[zoneOf().theme] || THEME.grass;
    ctx.fillStyle = th.ground; ctx.fillRect(0, 0, W, H);
    drawBattleBg(); // 用户图片背景
    ctx.fillStyle = th.ground; ctx.globalAlpha = 0.35; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    // 背景纹理: 草丛/泥点/碎砖散布
    var si = (stage * 7919) % 1000;
    for (var d = 0; d < 90; d++) {
      var dx = (d * 173 + si * 13) % W, dy = (d * 271 + si * 7) % H;
      ctx.fillStyle = th.decor; ctx.fillRect(dx, dy, 3, 3);
    }
    ctx.strokeStyle = th.grid; ctx.lineWidth = 1;
    var i;
    for (i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(W, i * TILE); ctx.stroke();
    }
    // 战区背景装饰: 每关固定的树影/弹坑/废墟剪影(不阻挡移动)
    ctx.globalAlpha = 0.55;
    for (d = 0; d < 8; d++) {
      var ex = (d * 137 + si * 29) % (W - 30), ey = (d * 211 + si * 11) % (H - 30);
      if (zoneOf().theme === "street") { ctx.fillStyle = "#3a3a44"; ctx.fillRect(ex, ey, 18, 14); ctx.fillStyle = "#26262e"; ctx.fillRect(ex + 3, ey + 3, 5, 5); ctx.fillRect(ex + 11, ey + 3, 5, 5); }
      else if (zoneOf().theme === "sand") { ctx.fillStyle = "#241f14"; ctx.beginPath(); ctx.ellipse(ex + 9, ey + 7, 9, 6, 0, 0, 6.3); ctx.fill(); }
      else { ctx.fillStyle = "#0d1f14"; ctx.beginPath(); ctx.arc(ex + 8, ey + 8, 8, 0, 6.3); ctx.fill(); ctx.fillStyle = "#0a150d"; ctx.fillRect(ex + 6, ey + 12, 4, 7); }
    }
    ctx.globalAlpha = 1;
    var r, c;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      var v = grid[r][c];
      if (v === 1) {
        ctx.fillStyle = "#9a5a20"; ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = "#b5651d";
        ctx.fillRect(c * TILE + 1, r * TILE + 2, 11, 9);
        ctx.fillRect(c * TILE + 14, r * TILE + 2, 11, 9);
        ctx.fillRect(c * TILE + 1, r * TILE + 15, 11, 9);
        ctx.fillRect(c * TILE + 14, r * TILE + 15, 11, 9);
        ctx.strokeStyle = "#5d3010"; ctx.strokeRect(c * TILE, r * TILE, TILE, TILE);
      } else if (v === 2) {
        ctx.fillStyle = "#bbb"; ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = "#777";
        ctx.fillRect(c * TILE + 2, r * TILE + 2, TILE - 4, 6);
        ctx.fillRect(c * TILE + 2, r * TILE + 16, TILE - 4, 6);
        ctx.strokeStyle = "#eee"; ctx.strokeRect(c * TILE + .5, r * TILE + .5, TILE - 1, TILE - 1);
      } else if (v === 3) {
        // 坑洞绘制
        ctx.fillStyle = "#0a0a0a"; ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = "#1a1208";
        ctx.beginPath(); ctx.ellipse(c * TILE + TILE / 2, r * TILE + TILE / 2, TILE / 2 - 2, TILE / 2 - 4, 0, 0, 6.3); ctx.fill();
        ctx.strokeStyle = "#4a3520"; ctx.lineWidth = 2;
        ctx.strokeRect(c * TILE + 1, r * TILE + 1, TILE - 2, TILE - 2);
        // 坑沿警示条纹
        ctx.fillStyle = "#c9a227";
        for (var s = 0; s < 4; s++) ctx.fillRect(c * TILE + s * 7, r * TILE, 4, 3);
        for (s = 0; s < 4; s++) ctx.fillRect(c * TILE + s * 7, r * TILE + TILE - 3, 4, 3);
      }
    }
    drawBase();
    for (i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.born > 0) { ctx.globalAlpha = 0.4; drawTank(e, "#c66", true); ctx.globalAlpha = 1; }
      else drawTank(e, e.fast ? "#e88" : "#c66", true);
    }
    if (tank) {
      // 跳跃视觉高度偏移
      if (jump.on) {
        var ph = jump.t / jump.dur;
        var lift = Math.sin(ph * Math.PI) * jump.hop;
        ctx.save();
        ctx.translate(0, -lift);
        drawTank(tank, "#d9a441", false);
        ctx.restore();
        // 影子
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.beginPath(); ctx.ellipse(tank.x + tank.w / 2, tank.y + tank.h, tank.w / 2, 4, 0, 0, 6.3); ctx.fill();
      } else {
        drawTank(tank, "#d9a441", false);
      }
    }
    ctx.fillStyle = "#fff";
    for (i = 0; i < bullets.length; i++) ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h);
    ctx.fillStyle = "#f88";
    for (i = 0; i < enemyBullets.length; i++) ctx.fillRect(enemyBullets[i].x, enemyBullets[i].y, enemyBullets[i].w, enemyBullets[i].h);
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.min(1, p.life / 10);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    if (state === "pause") {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffd75e"; ctx.font = "28px 'Courier New'"; ctx.textAlign = "center";
      ctx.fillText("暂停中 — 按 P 继续", W / 2, H / 2);
    }
    if (state === "stageclear") {
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffd75e"; ctx.font = "30px 'Courier New'"; ctx.textAlign = "center";
      ctx.fillText("第 " + stage + " 关 通过！", W / 2, H / 2 - 10);
      ctx.font = "16px 'Courier New'"; ctx.fillStyle = "#9fd0ff";
      ctx.fillText("准备进入下一关…", W / 2, H / 2 + 22);
    }
    if (state === "start") {
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H);
    }
  }

  function loop() {
    if (state === "play") {
      if (spawnQueue > 0) {
        spawnTimer--;
        if (spawnTimer <= 0) {
          if (spawnEnemy()) { spawnQueue--; spawnTimer = Math.max(45, 110 - stage * 8); }
          else spawnTimer = 20;
        }
      }
      updatePlayer();
      updateEnemies();
      updateBullets(bullets);
      updateBullets(enemyBullets);
      updatePowerups();
      updateParticles();
    } else if (state === "stageclear") {
      updateParticles();
      clearTimer--;
      if (clearTimer <= 0) { stage++; resetStage(); state = "play"; updateHUD(); }
    } else if (state === "over") {
      updateParticles();
    }
    draw();
    requestAnimationFrame(loop);
  }

  state = "start"; buildGrid(); bullets = []; enemyBullets = []; enemies = [];
  powerups = []; particles = [];
  enemiesLeft = 0; spawnQueue = 0; baseAlive = true; score = 0; lives = 3; stage = 1; power = 1;
  updateHUD();
  loop();
})();
</script>
</body>
</html>
