<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Blitz</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0a0e14; overflow:hidden;
    font-family:'Courier New', monospace; color:#c8f7c8; user-select:none; }
  #game { display:block; background:#0a0e14; cursor:crosshair; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(5,8,12,.88); z-index:10; }
  .overlay h1 { font-size:clamp(28px,6vw,64px); color:#7dff7d;
    text-shadow:0 0 18px #2f2, 0 0 40px #0f4; letter-spacing:6px; margin-bottom:14px; }
  .overlay p { font-size:clamp(13px,2vw,17px); color:#9fd8a0; line-height:1.9; margin-bottom:8px; }
  .btn { margin-top:22px; padding:14px 46px; font-size:20px; letter-spacing:4px;
    background:#0c2; color:#031; border:none; cursor:pointer; font-family:inherit;
    box-shadow:0 0 20px #0f7, inset 0 0 12px #0f7; transition:.15s; }
  .btn:hover { transform:scale(1.06); box-shadow:0 0 34px #0f7, inset 0 0 18px #0f7; }
  .hidden { display:none !important; }
  #hud { position:fixed; top:10px; left:12px; font-size:15px; z-index:5;
    text-shadow:0 0 6px #0f4; pointer-events:none; line-height:1.7; }
  #hud .hpbar { width:180px; height:14px; border:2px solid #4f8; background:#041; margin-top:2px; }
  #hud .hpfill { height:100%; background:linear-gradient(90deg,#0f6,#8f8); width:100%; transition:width .2s; }
  #hud2 { position:fixed; top:10px; right:14px; font-size:15px; text-align:right;
    text-shadow:0 0 6px #0f4; z-index:5; pointer-events:none; line-height:1.7; }
  #flash { position:fixed; inset:0; background:radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.55) 100%);
    opacity:0; pointer-events:none; z-index:6; transition:opacity .12s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="hud">
  ❤ <span id="hpText">100</span>/100
  <div class="hpbar"><div class="hpfill" id="hpFill"></div></div>
</div>
<div id="hud2">
  得分 <span id="scoreText">0</span><br>
  波次 <span id="waveText">1</span>
</div>

<div class="overlay" id="startScreen">
  <h1>坦克大战</h1>
  <p>TANK &nbsp;BLITZ</p>
  <p>WASD / 方向键 — 移动　　鼠标 — 瞄准　　点击 / 空格 — 射击</p>
  <p>P — 暂停　　R — 重新开始</p>
  <p>击毁敌方坦克得分，坚持越多波次越强！</p>
  <button class="btn" id="startBtn">开 始 游 戏</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h1>已暂停</h1>
  <p>按 P 继续</p>
</div>

<div class="overlay hidden" id="overScreen">
  <h1 style="color:#f66;text-shadow:0 0 18px #f22,0 0 40px #f04">游戏结束</h1>
  <p>最终得分：<span id="finalScore" style="color:#ff8">0</span></p>
  <p>存活波次：<span id="finalWave" style="color:#ff8">1</span></p>
  <button class="btn" id="retryBtn">再 来 一 局</button>
</div>

<script>
"use strict";
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
const startScreen=$('startScreen'), pauseScreen=$('pauseScreen'), overScreen=$('overScreen');
const hpFill=$('hpFill'), hpText=$('hpText'), scoreText=$('scoreText'),
      waveText=$('waveText'), flash=$('flash');

const S = {
  state:'menu', score:0, wave:1,
  player:null, enemies:[], bullets:[], parts:[], obstacles:[],
  spawnTimer:0, waveKills:0, shake:0
};

const keys = {};
let mouse = {x:W/2, y:H/2, down:false};
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(e.code==='KeyP') togglePause();
  if(e.code==='KeyR' && S.state==='over') restart();
  if(e.code==='Space'){ e.preventDefault(); if(S.state==='play') shoot(); }
});
addEventListener('keyup', e=>keys[e.code]=false);
cvs.addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
cvs.addEventListener('mousedown', ()=>{ mouse.down=true; if(S.state==='play') shoot(); });
addEventListener('mouseup', ()=>mouse.down=false);

$('startBtn').onclick = ()=>{ S.state='play'; startScreen.classList.add('hidden'); resetWorld(); };
$('retryBtn').onclick = restart;
function restart(){ overScreen.classList.add('hidden'); S.state='play'; resetWorld(); }
function togglePause(){
  if(S.state==='play'){ S.state='pause'; pauseScreen.classList.remove('hidden'); }
  else if(S.state==='pause'){ S.state='play'; pauseScreen.classList.add('hidden'); }
}

function Tank(x,y,enemy){
  return {x,y, angle: enemy?Math.PI:0, turret: enemy?Math.PI:0,
    hp: enemy?40:100, maxHp: enemy?40:100,
    speed: enemy?1.4:2.6, r:22, enemy, cool:0, flash:0,
    vx:0, vy:0, wander:Math.random()*6.28, wT:0};
}
function resetWorld(){
  S.score=0; S.wave=1; S.waveKills=0;
  S.enemies=[]; S.bullets=[]; S.parts=[]; S.spawnTimer=60;
  S.player = Tank(W/2, H/2, false);
  S.obstacles=[];
  for(let i=0;i<10;i++){
    S.obstacles.push({x:Math.random()*W, y:Math.random()*H,
      w:60+Math.random()*120, h:30+Math.random()*70});
  }
  updateHUD();
}

let shootCd = 0;
function shoot(){
  if(S.state!=='play' || shootCd>0 || !S.player) return;
  shootCd = 14;
  const p=S.player, a=p.turret;
  S.bullets.push({x:p.x+Math.cos(a)*30, y:p.y+Math.sin(a)*30,
    vx:Math.cos(a)*8, vy:Math.sin(a)*8, life:80, owner:'p', r:4});
  burst(p.x+Math.cos(a)*34, p.y+Math.sin(a)*34, '#ff6', 5);
}
function enemyShoot(e){
  const p=S.player;
  const a=Math.atan2(p.y-e.y, p.x-e.x);
  S.bullets.push({x:e.x+Math.cos(a)*30, y:e.y+Math.sin(a)*30,
    vx:Math.cos(a)*4.5, vy:Math.sin(a)*4.5, life:140, owner:'e', r:4});
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, sp=1+Math.random()*3;
    S.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:20+Math.random()*20, color});
  }
}

function circleRect(cx,cy,r,o){
  const nx=Math.max(o.x, Math.min(cx, o.x+o.w));
  const ny=Math.max(o.y, Math.min(cy, o.y+o.h));
  const dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy < r*r;
}
function moveTank(t, dx, dy){
  t.x += dx;
  for(const o of S.obstacles) if(circleRect(t.x,t.y,t.r,o)){ t.x -= dx; break; }
  t.y += dy;
  for(const o of S.obstacles) if(circleRect(t.x,t.y,t.r,o)){ t.y -= dy; break; }
  t.x = Math.max(t.r, Math.min(W-t.r, t.x));
  t.y = Math.max(t.r, Math.min(H-t.r, t.y));
}

function spawnEnemy(){
  const edge = Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){ x=Math.random()*W; y=30; }
  else if(edge===1){ x=W-30; y=Math.random()*H; }
  else if(edge===2){ x=Math.random()*W; y=H-30; }
  else { x=30; y=Math.random()*H; }
  const p=S.player;
  if(Math.hypot(x-p.x,y-p.y)<200){ x = W-x; y = H-y; }
  const e=Tank(x,y,true);
  e.hp = e.maxHp = 40 + S.wave*6;
  e.speed = 1.2 + Math.min(S.wave*0.1, 1.4);
  S.enemies.push(e);
}

function updateHUD(){
  const p=S.player; if(!p) return;
  hpText.textContent = Math.max(0,Math.ceil(p.hp));
  hpFill.style.width = Math.max(0, p.hp/p.maxHp*100)+'%';
  scoreText.textContent = S.score;
  waveText.textContent = S.wave;
}

function hurt(dmg){
  const p=S.player;
  p.hp -= dmg; p.flash=6; S.shake=8;
  flash.style.opacity='1';
  setTimeout(()=>flash.style.opacity='0', 110);
  if(p.hp<=0) gameOver();
}
function gameOver(){
  S.state='over';
  $('finalScore').textContent=S.score;
  $('finalWave').textContent=S.wave;
  overScreen.classList.remove('hidden');
}

function lineRect(x1,y1,x2,y2,r){
  for(let t=0.1;t<=0.9;t+=0.15){
    const px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    if(px>r.x && px<r.x+r.w && py>r.y && py<r.y+r.h) return true;
  }
  return false;
}

function update(){
  if(S.state!=='play') return;
  const p=S.player;
  if(shootCd>0) shootCd--;
  if(mouse.down) shoot();

  let dx=0, dy=0;
  if(keys['KeyW']||keys['ArrowUp']) dy-=1;
  if(keys['KeyS']||keys['ArrowDown']) dy+=1;
  if(keys['KeyA']||keys['ArrowLeft']) dx-=1;
  if(keys['KeyD']||keys['ArrowRight']) dx+=1;
  if(dx||dy){ const l=Math.hypot(dx,dy); moveTank(p, dx/l*p.speed, dy/l*p.speed); }
  p.turret = Math.atan2(mouse.y-p.y, mouse.x-p.x);
  p.angle = p.turret;
  if(p.flash>0) p.flash--;

  for(const e of S.enemies){
    const d = Math.hypot(p.x-e.x, p.y-e.y);
    const aim = Math.atan2(p.y-e.y, p.x-e.x);
    e.turret = aim;
    e.wT--;
    if(e.wT<=0){ e.wander = (Math.random()-0.5)*1.6; e.wT=40+Math.random()*60; }
    let mvx=Math.cos(aim), mvy=Math.sin(aim);
    if(d<160){ mvx=-mvx; mvy=-mvy; }
    else if(d<260){ mvx=Math.cos(aim+1.57); mvy=Math.sin(aim+1.57); }
    const ca=Math.cos(e.wander), sa=Math.sin(e.wander);
    const rx=mvx*ca-mvy*sa, ry=mvx*sa+mvy*ca;
    moveTank(e, rx*e.speed, ry*e.speed);
    e.angle = Math.atan2(ry, rx);
    if(e.cool>0) e.cool--;
    if(d<520 && e.cool<=0){
      let blocked=false;
      for(const o of S.obstacles){ if(lineRect(e.x,e.y,p.x,p.y,o)){ blocked=true; break; } }
      if(!blocked){ enemyShoot(e); e.cool = Math.max(20, 60 + Math.random()*60 - S.wave*3); }
    }
    if(e.flash>0) e.flash--;
  }

  for(let i=S.bullets.length-1;i>=0;i--){
    const b=S.bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    let dead = b.life<=0 || b.x<0||b.x>W||b.y<0||b.y>H;
    if(!dead){
      for(const o of S.obstacles) if(circleRect(b.x,b.y,b.r,o)){ dead=true; burst(b.x,b.y,'#aaa',4); break; }
    }
    if(!dead && b.owner==='p'){
      for(let j=S.enemies.length-1;j>=0;j--){
        const e=S.enemies[j];
        if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
          e.hp-=20; e.flash=6; dead=true; burst(b.x,b.y,'#fa4',6);
          if(e.hp<=0){
            burst(e.x,e.y,'#f80',22); burst(e.x,e.y,'#ff0',12);
            S.enemies.splice(j,1);
            S.score += 100; S.waveKills++;
            S.shake=5;
          }
          break;
        }
      }
    }
    if(!dead && b.owner==='e' && Math.hypot(b.x-p.x,b.y-p.y)<p.r+b.r){
      dead=true; burst(b.x,b.y,'#f66',6); hurt(10);
    }
    if(dead) S.bullets.splice(i,1);
  }

  for(let i=S.parts.length-1;i>=0;i--){
    const q=S.parts[i];
    q.x+=q.vx; q.y+=q.vy; q.vx*=0.96; q.vy*=0.96; q.life--;
    if(q.life<=0) S.parts.splice(i,1);
  }

  S.spawnTimer--;
  const maxEnemies = 3 + S.wave;
  if(S.spawnTimer<=0 && S.enemies.length < maxEnemies){
    spawnEnemy();
    S.spawnTimer = Math.max(40, 120 - S.wave*6);
  }
  if(S.waveKills >= 5 + S.wave*2){
    S.wave++; S.waveKills=0;
    S.spawnTimer=100;
  }

  if(S.shake>0) S.shake--;
  updateHUD();
}

function drawTank(t){
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.save();
  ctx.rotate(t.angle);
  const base = t.enemy ? '#c33' : '#3c3';
  ctx.fillStyle = t.flash>0 ? '#fff' : base;
  ctx.fillRect(-20,-14,40,28);
  ctx.fillStyle = t.enemy ? '#811' : '#181';
  ctx.fillRect(-20,-18,40,6);
  ctx.fillRect(-20,12,40,6);
  ctx.restore();
  ctx.rotate(t.turret);
  ctx.fillStyle = t.flash>0 ? '#fff' : (t.enemy?'#e55':'#6f6');
  ctx.beginPath(); ctx.arc(0,0,10,0,6.28); ctx.fill();
  ctx.fillRect(8,-4,24,8);
  ctx.restore();
  if(t.enemy){
    ctx.fillStyle='#300'; ctx.fillRect(t.x-20,t.y-30,40,5);
    ctx.fillStyle='#f33'; ctx.fillRect(t.x-20,t.y-30,40*Math.max(0,t.hp/t.maxHp),5);
  }
}

function drawObstacle(o){
  ctx.fillStyle='#243';
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle='#4a6'; ctx.lineWidth=2;
  ctx.strokeRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle='rgba(80,255,140,.25)';
  for(let x=o.x+8;x<o.x+o.w-4;x+=14){
    ctx.beginPath(); ctx.moveTo(x,o.y+4); ctx.lineTo(x,o.y+o.h-4); ctx.stroke();
  }
}

function drawGrid(){
  ctx.strokeStyle='rgba(40,120,70,.18)';
  ctx.lineWidth=1;
  const g=48;
  ctx.beginPath();
  for(let x=0;x<W;x+=g){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=0;y<H;y+=g){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
}

function render(){
  ctx.save();
  if(S.shake>0){
    ctx.translate((Math.random()-0.5)*S.shake, (Math.random()-0.5)*S.shake);
  }
  ctx.fillStyle='#0a0e14';
  ctx.fillRect(-10,-10,W+20,H+20);
  drawGrid();
  for(const o of S.obstacles) drawObstacle(o);
  for(const b of S.bullets){
    ctx.fillStyle = b.owner==='p' ? '#ff8' : '#f66';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill();
    ctx.shadowBlur = 0;
  }
  if(S.player && S.state!=='menu') drawTank(S.player);
  for(const e of S.enemies) drawTank(e);
  for(const q of S.parts){
    ctx.globalAlpha = Math.min(1, q.life/20);
    ctx.fillStyle=q.color;
    ctx.fillRect(q.x-2,q.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(S.state==='play'){
    ctx.strokeStyle='#0f8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,10,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x-16,mouse.y); ctx.lineTo(mouse.x-4,mouse.y);
    ctx.moveTo(mouse.x+4,mouse.y); ctx.lineTo(mouse.x+16,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-16); ctx.lineTo(mouse.x,mouse.y-4);
    ctx.moveTo(mouse.x,mouse.y+4); ctx.lineTo(mouse.x,mouse.y+16); ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
