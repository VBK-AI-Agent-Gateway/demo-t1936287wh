<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克跳坑 Tank Pit Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header>
    <h1>坦克跳坑</h1>
    <div id="hud">
      <span>距离: <b id="dist">0</b> m</span>
      <span>最高: <b id="best">0</b> m</span>
      <span id="lives">♥♥♥</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>

    <div id="overlay" class="show">
      <div class="panel">
        <h2 id="ovTitle">坦克跳坑</h2>
        <p id="ovDesc">越过所有深坑，能跑多远跑多远！<br>空格 / ↑ / 点击屏幕 = 跳跃</p>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <footer>
    <p>操作: 空格 / ↑ / 点击 / 触屏 = 跳跃，空中可再跳一次（二段跳）</p>
    <button id="jumpBtn" aria-label="跳跃">JUMP</button>
  </footer>
</div>
<script src="game.js"></script>
</body>
</html>
