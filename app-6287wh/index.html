<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: 'Segoe UI', sans-serif;
color: #eee;
user-select: none;
}
h1 { margin-bottom:10px; color:#4ecca3; text-shadow:0 0 10px rgba(78,204,163,.5); }
.info { display:flex; gap:30px; margin-bottom:12px; font-size:18px; }
.info span { color:#4ecca3; font-weight:bold; }
#board {
background: rgba(0,0,0,.4);
border: 3px solid #4ecca3;
border-radius: 8px;
box-shadow: 0 0 30px rgba(78,204,163,.3);
}
#overlay {
position:absolute;
inset:0;
background:rgba(0,0,0,.75);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
border-radius:8px;
gap:16px;
}
#overlay.hidden { display:none; }
#overlay h2 { font-size:32px; color:#e94560; }
#overlay p { font-size:18px; color:#ccc; }
button {
background:#4ecca3;
border:none;
padding:12px 32px;
font-size:18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
color:#1a1a2e;
transition:.2s;
}
button:hover { transform:scale(1.05); box-shadow:0 0 15px #4ecca3; }
.controls { margin-top:16px; display:grid; grid-template-columns:repeat(3,60px); gap:6px; }
.controls button { padding:14px 0; font-size:22px; }
.controls .empty { visibility:hidden; }
.tip { margin-top:10px; font-size:13px; color:#888; }
.wrap { position:relative; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="info">得分：<span id="score">0</span>　最高：<span id="best">0</span></div>
<div class="wrap">
<canvas id="board" width="400" height="400"></canvas>
<div id="overlay">
<h2 id="ovTitle">贪吃蛇</h2>
<p id="ovText">方向键 / WASD / 滑动 控制方向</p>
<button id="startBtn">开始游戏</button>
</div>
</div>
<div class="controls">
<button class="empty"></button><button data-d="up">⬆</button><button class="empty"></button>
<button data-d="left">⬅</button><button data-d="down">⬇</button><button data-d="right">➡</button>
</div>
<div class="tip">键盘方向键 / WASD / 屏幕滑动</div>

<script>
const cvs = document.getElementById('board');
const ctx = cvs.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const startBtn = document.getElementById('startBtn');

const GRID = 20;
const CELLS = cvs.width / GRID; // 20

let snake, dir, nextDir, food, score, best, timer, running, speed;

best = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = best;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = dir;
  score = 0;
  speed = 150;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) };
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function start() {
  init();
  running = true;
  overlay.classList.add('hidden');
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    bestEl.textContent = best;
  }
  ovTitle.textContent = '游戏结束';
  ovText.textContent = '得分：' + score + '　最高：' + best;
  startBtn.textContent = '再来一局';
  overlay.classList.remove('hidden');
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) return gameOver();
  // 撞自己
  if (snake.some(s => s.x===head.x && s.y===head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (speed > 60) {
      speed -= 3;
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0,0,cvs.width,cvs.height);
  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i=0;i<=CELLS;i++) {
    ctx.beginPath(); ctx.moveTo(i*GRID,0); ctx.lineTo(i*GRID,cvs.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*GRID); ctx.lineTo(cvs.width,i*GRID); ctx.stroke();
  }
  // 食物
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 蛇
  snake.forEach((s,i) => {
    const t = i/snake.length;
    ctx.fillStyle = i===0 ? '#4ecca3' : `rgba(78,204,163,${1-t*0.6})`;
    ctx.shadowColor = '#4ecca3'; ctx.shadowBlur = i===0?10:0;
    ctx.fillRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2);
  });
  ctx.shadowBlur = 0;
}

function setDir(d) {
  const map = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };
  const nd = map[d];
  if (!nd) return;
  // 禁止180度掉头
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup:'up', arrowdown:'down', arrowleft:'left', arrowright:'right',
                w:'up', s:'down', a:'left', d:'right' };
  if (map[k]) { e.preventDefault(); setDir(map[k]); }
  if ((k===' '||k==='enter') && !running) start();
});

document.querySelectorAll('.controls button[data-d]').forEach(b => {
  b.addEventListener('click', () => setDir(b.dataset.d));
});

// 触摸滑动
let tx=0, ty=0;
cvs.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive:true});
cvs.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?'right':'left');
  else setDir(dy>0?'down':'up');
}, {passive:true});

startBtn.addEventListener('click', start);

// 初始化画面
init();
draw();
</script>
</body>
</html>
