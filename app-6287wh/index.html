<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: "Microsoft YaHei", sans-serif; touch-action: none; user-select: none; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
canvas { background: #000; display: block; image-rendering: pixelated; }

/* 顶部信息 */
#hud { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(0,0,0,.7); color: #fff; display: flex; align-items: center; justify-content: space-around; font-size: 14px; z-index: 5; pointer-events: none; }
#hud b { color: #ffd700; }

/* 虚拟按键 */
#ctrl { position: absolute; left: 0; bottom: 0; width: 46%; height: 46%; z-index: 6; }
#btnFire { position: absolute; right: 18px; bottom: 40px; width: 96px; height: 96px; border-radius: 50%; background: rgba(255,60,60,.35); border: 3px solid rgba(255,80,80,.8); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 6; cursor: pointer; }
#btnFire:active { background: rgba(255,60,60,.7); }
.dbtn { position: absolute; width: 64px; height: 64px; border-radius: 12px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.dbtn.on { background: rgba(255,255,255,.45); }
#up { left: 78px; top: 6px; }
#down { left: 78px; bottom: 6px; }
#left { left: 8px; top: 50%; transform: translateY(-50%); }
#right { left: 148px; top: 50%; transform: translateY(-50%); }

/* 开始/结束面板 */
#panel { position: absolute; inset: 0; background: rgba(0,0,0,.88); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; }
#panel h1 { font-size: 42px; color: #ffd700; margin-bottom: 8px; letter-spacing: 4px; text-shadow: 0 0 16px #ff8c00; }
#panel p { color: #bbb; font-size: 14px; margin: 6px 0; line-height: 1.7; }
#panel button { margin-top: 22px; padding: 14px 54px; font-size: 20px; border: none; border-radius: 8px; background: linear-gradient(#ffd700,#ff8c00); color: #5a2b00; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(255,140,0,.5); transition: transform .1s; }
#panel button:hover { filter: brightness(1.08); }
#panel button:active { transform: scale(.96); }
#msg { color: #ff5555; font-size: 16px; min-height: 22px; margin-top: 10px; }
.hidden { display: none !important; }
@media (min-width: 900px) {
  #ctrl, #btnFire { display: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span>得分 <b id="score">0</b></span>
    <span>关卡 <b id="level">1</b></span>
    <span>生命 <b id="lives">3</b></span>
    <span>敌军 <b id="enemy">0</b></span>
  </div>

  <div id="ctrl">
    <div class="dbtn" id="up">▲</div>
    <div class="dbtn" id="down">▼</div>
    <div class="dbtn" id="left">◀</div>
    <div class="dbtn" id="right">▶</div>
  </div>
  <div id="btnFire">开火</div>

  <div id="panel">
    <h1 id="panelTitle">坦克大战</h1>
    <p id="sub">方向键 / 虚拟按键 移动<br>空格 / 点击 开火<br>消灭所有敌军坦克即可过关</p>
    <div id="msg"></div>
    <button id="btnStart">开始游戏</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- 基础配置 ---------- */
var TILE = 32;                 // 地图格子尺寸
var COLS = 17, ROWS = 15;      // 地图行列
var W = COLS * TILE, H = ROWS * TILE;

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

// 自适应缩放（保持清晰）
function resize(){
  var maxW = window.innerWidth, maxH = window.innerHeight - 36;
  var s = Math.min(maxW / W, maxH / H);
  cv.style.width  = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = W; cv.height = H;
}
window.addEventListener('resize', resize);
resize();

/* ---------- 地图 ---------- */
// 0 空地  1 砖墙  2 钢墙  3 河流  4 丛林  5 基地
var map = [];
function buildMap(lv){
  map = [];
  for(var r=0;r<ROWS;r++){ map[r]=[]; for(var c=0;c<COLS;c++) map[r][c]=0; }

  // 随机砖墙（保证稀疏可通行）
  var density = 0.16 + Math.min(lv*0.01, 0.08);
  for(r=1;r<ROWS-1;r++){
    for(c=1;c<COLS-1;c++){
      if(Math.random() < density) map[r][c] = 1;
    }
  }
  // 钢墙
  for(var i=0;i<6;i++){
    r = 1 + (Math.random()*(ROWS-2)|0);
    c = 1 + (Math.random()*(COLS-2)|0);
    map[r][c] = 2;
  }
  // 河流
  for(i=0;i<4;i++){
    r = 2 + (Math.random()*(ROWS-4)|0);
    c = 2 + (Math.random()*(COLS-4)|0);
    map[r][c] = 3; map[r][c+1] = 3;
  }
  // 丛林
  for(i=0;i<3;i++){
    r = 2 + (Math.random()*(ROWS-4)|0);
    c = 2 + (Math.random()*(COLS-4)|0);
    map[r][c] = 4; map[r][c+1] = 4; map[r+1][c] = 4;
  }
  // 清空出生点周边
  function clearArea(cr,cc){
    for(var rr=cr-1;rr<=cr+1;rr++)
      for(var cc2=cc-1;cc2<=cc+1;cc2++)
        if(rr>=0&&rr<ROWS&&cc2>=0&&cc2<COLS) map[rr][cc2]=0;
  }
  clearArea(ROWS-2, (COLS/2|0)-1);   // 玩家出生
  clearArea(0, 1);                    // 敌人1
  clearArea(0, COLS-2);               // 敌人2
  clearArea(0, (COLS/2|0));           // 敌人3

  // 基地
  map[ROWS-1][(COLS/2|0)-1] = 5;
  map[ROWS-1][(COLS/2|0)]   = 5;
  map[ROWS-2][(COLS/2|0)-1] = 5;
  map[ROWS-2][(COLS/2|0)]   = 5;
}

/* ---------- 游戏状态 ---------- */
var state = 'menu';   // menu / play / over / win
var score = 0, level = 1, lives = 3;
var player = null, enemies = [], bullets = [], effects = [];
var enemyQueue = 0, spawnTimer = 0, baseAlive = true;
var keys = {};

/* ---------- 坦克 ---------- */
function Tank(x,y,dir,type){
  this.x = x; this.y = y;
  this.dir = dir;              // 0上 1右 2下 3左
  this.type = type;            // player / enemy
  this.size = 28;
  this.speed = type==='player' ? 2.2 : 1.3;
  this.cooldown = 0;
  this.alive = true;
  this.hp = type==='player' ? 1 : 1;
  this.track = 0;
}
var DIRX = [0,1,0,-1], DIRY = [-1,0,1,0];

Tank.prototype.rect = function(){
  return { x:this.x - this.size/2, y:this.y - this.size/2, w:this.size, h:this.size };
};

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function solidAt(px,py){
  // 返回该点是否阻挡（砖、钢、基地、边界）
  if(px<0||py<0||px>=W||py>=H) return true;
  var c = (px/TILE)|0, r = (py/TILE)|0;
  var t = map[r][c];
  return (t===1||t===2||t===5);
}
function terrainAt(px,py){
  if(px<0||py<0||px>=W||py>=H) return 1;
  var c = (px/TILE)|0, r = (py/TILE)|0;
  return map[r][c];
}

function canMove(tank, nx, ny){
  var s = tank.size/2 - 2;
  var pts = [[nx-s,ny-s],[nx+s,ny-s],[nx-s,ny+s],[nx+s,ny+s]];
  for(var i=0;i<4;i++){
    var px = pts[i][0], py = pts[i][1];
    if(px<0||py<0||px>=W||py>=H) return false;
    var c=(px/TILE)|0, r=(py/TILE)|0;
    var t = map[r][c];
    if(t===1||t===2||t===5) return false;
    if(t===3) return false; // 河流
  }
  // 与其他坦克不重叠
  var myRect = {x:nx-s,y:ny-s,w:s*2,h:s*2};
  var all = [];
  if(player && player.alive) all.push(player);
  for(var e=0;e<enemies.length;e++) if(enemies[e].alive) all.push(enemies[e]);
  for(var k=0;k<all.length;k++){
    if(all[k]===tank) continue;
    var o = all[k].rect();
    if(rectsOverlap(myRect,o)) return false;
  }
  return true;
}

Tank.prototype.move = function(){
  var sp = this.speed;
  var nx = this.x + DIRX[this.dir]*sp;
  var ny = this.y + DIRY[this.dir]*sp;
  if(canMove(this,nx,ny)){
    this.x = nx; this.y = ny; this.track += sp;
  }
};

Tank.prototype.fire = function(){
  if(this.cooldown > 0) return;
  this.cooldown = this.type==='player' ? 16 : 40;
  var bx = this.x + DIRX[this.dir]*(this.size/2+4);
  var by = this.y + DIRY[this.dir]*(this.size/2+4);
  bullets.push({
    x:bx, y:by,
    dx:DIRX[this.dir]*5.5, dy:DIRY[this.dir]*5.5,
    from:this.type, alive:true, r:3
  });
  addEffect(this.x + DIRX[this.dir]*16, this.y + DIRY[this.dir]*16, 'flash');
};

/* ---------- 子弹 ---------- */
function updateBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.dx; b.y += b.dy;

    // 出界
    if(b.x<0||b.y<0||b.x>W||b.y>H){ bullets.splice(i,1); continue; }

    // 打中地形
    var c=(b.x/TILE)|0, r=(b.y/TILE)|0;
    var t = map[r][c];
    if(t===1){ // 砖墙被摧毁
      map[r][c]=0;
      addEffect(c*TILE+16, r*TILE+16, 'boom');
      bullets.splice(i,1); continue;
    }
    if(t===2 || t===5){ // 钢墙 / 基地
      if(t===5 && baseAlive){
        baseAlive = false;
        addEffect(c*TILE+16, r*TILE+16, 'boomBig');
        gameOver('基地被摧毁！');
      }else{
        addEffect(b.x, b.y, 'spark');
      }
      bullets.splice(i,1); continue;
    }
    if(t===3){ bullets.splice(i,1); continue; }

    if(b.from==='player'){
      for(var e=0;e<enemies.length;e++){
        var en = enemies[e];
        if(!en.alive) continue;
        if(rectsOverlap({x:b.x-3,y:b.y-3,w:6,h:6}, en.rect())){
          en.alive = false;
          score += 100;
          addEffect(en.x, en.y, 'boomBig');
          bullets.splice(i,1);
          break;
        }
      }
    }else{
      if(player && player.alive){
        if(rectsOverlap({x:b.x-3,y:b.y-3,w:6,h:6}, player.rect())){
          player.alive = false;
          addEffect(player.x, player.y, 'boomBig');
          bullets.splice(i,1);
          lives--;
          updateHUD();
          if(lives<=0){ gameOver('坦克全部被击毁！'); }
          else setTimeout(respawn, 1200);
        }
      }
    }
  }
  enemies = enemies.filter(function(e){ return e.alive; });
  updateHUD();
}

/* ---------- 特效 ---------- */
function addEffect(x,y,type){
  effects.push({x:x,y:y,t:0,type:type});
}
function updateEffects(){
  for(var i=effects.length-1;i>=0;i--){
    effects[i].t++;
    var max = effects[i].type==='boomBig'?26:14;
    if(effects[i].t>max) effects.splice(i,1);
  }
}

/* ---------- 敌人AI ---------- */
var aiTimer = 0;
function updateAI(){
  aiTimer++;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(!e.alive) continue;

    // 随机转向
    if(e.turnCd === undefined) e.turnCd = 0;
    e.turnCd--;
    if(e.turnCd <= 0){
      e.turnCd = 30 + (Math.random()*50|0);
      var r = Math.random();
      if(r < 0.45 && player && player.alive){
        // 朝玩家方向
        var dx = player.x - e.x, dy = player.y - e.y;
        if(Math.abs(dx) > Math.abs(dy)) e.dir = dx>0?1:3;
        else e.dir = dy>0?2:0;
      }else if(r < 0.7 && baseAlive){
        // 朝基地方向
        var bx = 8*TILE - e.x, by = (ROWS-1)*TILE - e.y;
        if(Math.abs(bx) > Math.abs(by)) e.dir = bx>0?1:3;
        else e.dir = by>0?2:0;
      }else{
        e.dir = (Math.random()*4)|0;
      }
    }

    var oldX = e.x, oldY = e.y;
    e.move();
    // 卡住则强制转向
    if(Math.abs(e.x-oldX)<0.01 && Math.abs(e.y-oldY)<0.01){
      e.dir = (Math.random()*4)|0;
      e.turnCd = 10;
    }

    // 射击
    if(Math.random() < 0.03) e.fire();
    // 若正对玩家/基地也射击
    if(player && player.alive){
      var aligned = false;
      if(e.dir===0||e.dir===2){
        if(Math.abs(player.x - e.x) < 20 && ((e.dir===0 && player.y<e.y)||(e.dir===2 && player.y>e.y))) aligned = true;
      }else{
        if(Math.abs(player.y - e.y) < 20 && ((e.dir===1 && player.x>e.x)||(e.dir===3 && player.x<e.x))) aligned = true;
      }
      if(aligned) e.fire();
    }
    if(baseAlive && e.y > H*0.6){
      var baseX = 8*TILE;
      var aimDir = -1;
      if(Math.abs(e.x - baseX) < 20) aimDir = 2;
      if(aimDir >= 0){
        if(e.dir !== aimDir){ e.dir = aimDir; }
        e.fire();
      }
    }
    if(e.cooldown > 0) e.cooldown--;
  }
}

/* ---------- 敌人补刷 ---------- */
function spawnEnemy(){
  if(enemyQueue <= 0) return;
  if(enemies.length >= 5) return;
  var spots = [1, (COLS/2|0), COLS-2];
  var sx = spots[(Math.random()*3)|0]*TILE + 16;
  // 出生点被占则跳过
  for(var i=0;i<enemies.length;i++){
    if(Math.abs(enemies[i].x - sx) < TILE*2 && enemies[i].y < TILE*3) return;
  }
  for(var r=0;r<3;r++){
    var c = (sx/TILE)|0;
    if(map[r] && (map[r][c]===1||map[r][c]===2||map[r][c]===3)) return;
  }
  var e = new Tank(sx, 16, 2, 'enemy');
  enemies.push(e);
  enemyQueue--;
  addEffect(sx, 16, 'flash');
  updateHUD();
}

/* ---------- 玩家重生 ---------- */
function respawn(){
  if(state!=='play') return;
  var px = ((COLS/2|0)-1)*TILE + 16;
  player = new Tank(px, (ROWS-2)*TILE + 16, 0, 'player');
  // 清空周围
  var c0 = (px/TILE)|0, r0 = ((ROWS-2));
  for(var r=r0-1;r<=r0;r++)
    for(var c=c0-1;c<=c0+1;c++)
      if(r>=0&&c>=0&&c<COLS&&map[r][c]!==5) map[r][c]=0;
}

/* ---------- HUD / 面板 ---------- */
function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = Math.max(0,lives);
  document.getElementById('enemy').textContent = enemyQueue + enemies.filter(function(e){return e.alive;}).length;
}

function gameOver(reason){
  if(state!=='play') return;
  state = 'over';
  document.getElementById('panelTitle').textContent = '游戏结束';
  document.getElementById('sub').innerHTML = '最终得分 ' + score + ' · 关卡 ' + level;
  document.getElementById('msg').textContent = reason;
  var btn = document.getElementById('btnStart');
  btn.textContent = '重新开始';
  btn.onclick = function(){ startGame(true); };
  document.getElementById('panel').classList.remove('hidden');
}

function winLevel(){
  if(state!=='play') return;
  state = 'win';
  document.getElementById('panelTitle').textContent = '过关！';
  document.getElementById('sub').innerHTML = '得分 ' + score + ' · 关卡 ' + level + '<br>敌军全灭，干得漂亮！';
  document.getElementById('msg').textContent = '';
  var btn = document.getElementById('btnStart');
  btn.textContent = '下一关';
  btn.onclick = function(){ level++; startGame(true); };
  document.getElementById('panel').classList.remove('hidden');
}

/* ---------- 游戏开始 ---------- */
function startGame(reset){
  if(reset){ score = 0; lives = 3; level = 1; }
  state = 'play';
  bullets = []; effects = []; enemies = [];
  baseAlive = true;
  enemyQueue = 6 + level*2;
  spawnTimer = 0;
  buildMap(level);
  respawn();
  updateHUD();
  document.getElementById('msg').textContent = '';
  document.getElementById('panel').classList.add('hidden');
}

/* ---------- 键盘输入 ---------- */
var KMAP = {arrowup:0, w:0, arrowdown:2, s:2, arrowleft:3, a:3, arrowright:1, d:1};
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(KMAP[k] !== undefined){
    e.preventDefault();
    keys.dir = KMAP[k];
    keys.held = true;
  }
  if(k===' ' || k==='j'){
    e.preventDefault();
    if(state==='play' && player && player.alive) player.fire();
    else if(state!=='play') document.getElementById('btnStart').click();
  }
  if(k==='enter' && state!=='play') document.getElementById('btnStart').click();
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if(KMAP[k] !== undefined && keys.dir === KMAP[k]) keys.held = false;
});

/* ---------- 触摸/鼠标虚拟按键 ---------- */
var vdir = -1;
function bindBtn(id, dir){
  var el = document.getElementById(id);
  function on(e){
    e.preventDefault();
    vdir = dir;
    el.classList.add('on');
  }
  function off(e){
    e.preventDefault();
    if(vdir===dir) vdir = -1;
    el.classList.remove('on');
  }
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('up',0); bindBtn('right',1); bindBtn('down',2); bindBtn('left',3);

var fireEl = document.getElementById('btnFire');
function fireOn(e){
  e.preventDefault();
  if(state==='play' && player && player.alive) player.fire();
}
fireEl.addEventListener('touchstart', fireOn, {passive:false});
fireEl.addEventListener('mousedown', fireOn);

/* ---------- 玩家更新 ---------- */
function updatePlayer(){
  if(!player || !player.alive) return;
  if(player.cooldown > 0) player.cooldown--;
  var dir = -1;
  if(keys.held) dir = keys.dir;
  if(vdir >= 0) dir = vdir;
  if(dir >= 0){
    player.dir = dir;
    player.move();
  }
}

/* ---------- 渲染 ---------- */
function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var v = map[r][c], x=c*TILE, y=r*TILE;
      // 地面
      ctx.fillStyle = ((r+c)%2===0) ? '#0d0d0d' : '#101010';
      ctx.fillRect(x,y,TILE,TILE);
      if(v===1){
        ctx.fillStyle='#a0522d'; ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='#5d2f16'; ctx.lineWidth=2;
        ctx.beginPath();
        for(var i=1;i<4;i++){ ctx.moveTo(x,y+i*8); ctx.lineTo(x+TILE,y+i*8); }
        ctx.moveTo(x+TILE/2,y); ctx.lineTo(x+TILE/2,y+8);
        ctx.moveTo(x+TILE/4,y+8); ctx.lineTo(x+TILE/4,y+16);
        ctx.moveTo(x+3*TILE/4,y+8); ctx.lineTo(x+3*TILE/4,y+16);
        ctx.moveTo(x+TILE/2,y+16); ctx.lineTo(x+TILE/2,y+24);
        ctx.moveTo(x+TILE/4,y+24); ctx.lineTo(x+TILE/4,y+32);
        ctx.moveTo(x+3*TILE/4,y+24); ctx.lineTo(x+3*TILE/4,y+32);
        ctx.stroke();
      }else if(v===2){
        ctx.fillStyle='#9e9e9e'; ctx.fillRect(x,y,TILE,TILE);
        ctx.fillStyle='#cfcfcf'; ctx.fillRect(x+4,y+4,TILE-8,TILE-8);
        ctx.fillStyle='#757575'; ctx.fillRect(x+9,y+9,TILE-18,TILE-18);
      }else if(v===3){
        ctx.fillStyle='#1565c0'; ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
        var t = Date.now()/300;
        for(var i=0;i<3;i++){
          ctx.beginPath();
          var yy = y+8+i*10;
          for(var xx=0;xx<=TILE;xx+=4){
            var wy = yy + Math.sin(xx/8 + t + i)*2;
            if(xx===0) ctx.moveTo(x+xx,wy); else ctx.lineTo(x+xx,wy);
          }
          ctx.stroke();
        }
      }else if(v===4){
        ctx.fillStyle='rgba(34,90,38,.9)'; ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='#1c4d1f'; ctx.lineWidth=1;
        for(var i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+i*9,y); ctx.lineTo(x+i*9,y+TILE); ctx.stroke(); }
      }else if(v===5){
        ctx.fillStyle = baseAlive ? '#3a3a20' : '#331515';
        ctx.fillRect(x,y,TILE,TILE);
        ctx.fillStyle = baseAlive ? '#ffd700' : '#777';
        ctx.beginPath();
        ctx.moveTo(x+16,y+4); ctx.lineTo(x+26,y+14); ctx.lineTo(x+22,y+14);
        ctx.lineTo(x+30,y+26); ctx.lineTo(x+20,y+22); ctx.lineTo(x+22,y+30);
        ctx.lineTo(x+16,y+24); ctx.lineTo(x+10,y+30); ctx.lineTo(x+12,y+22);
        ctx.lineTo(x+2,y+26); ctx.lineTo(x+10,y+14); ctx.lineTo(x+6,y+14);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}

function drawTank(t){
  if(!t.alive) return;
  ctx.save();
  ctx.translate(t.x, t.y);
  var rot = [0, Math.PI/2, Math.PI, -Math.PI/2][t.dir];
  ctx.rotate(rot);
  var isP = t.type==='player';
  var body = isP ? '#4caf50' : '#e53935';
  // 履带
  ctx.fillStyle = '#1c1c1c';
  ctx.fillRect(-14,-14,6,28); ctx.fillRect(8,-14,6,28);
  // 履带纹
  if(Math.floor(t.track/6)%2===0){
    ctx.fillStyle='#3a3a3a';
    ctx.fillRect(-14,-10,6,4); ctx.fillRect(8,2,6,4);
  }else{
    ctx.fillStyle='#3a3a3a';
    ctx.fillRect(-14,2,6,4); ctx.fillRect(8,-10,6,4);
  }
  // 车体
  ctx.fillStyle = body;
  ctx.fillRect(-11,-12,22,24);
  // 炮塔
  ctx.fillStyle = isP ? '#81c784' : '#ff7968';
  ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  // 炮管
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-2.5,-21,5,15);
  ctx.restore();
}

function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    ctx.fillStyle = b.from==='player' ? '#ffee58' : '#ff8a65';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawEffects(){
  for(var i=0;i<effects.length;i++){
    var fx = effects[i];
    if(fx.type==='flash'){
      ctx.fillStyle = 'rgba(255,230,140,' + (1 - fx.t/14) + ')';
      ctx.beginPath(); ctx.arc(fx.x, fx.y, 4 + fx.t, 0, Math.PI*2); ctx.fill();
    }else if(fx.type==='spark'){
      ctx.fillStyle = 'rgba(255,255,255,' + (1 - fx.t/14) + ')';
      ctx.beginPath(); ctx.arc(fx.x, fx.y, 3 + fx.t, 0, Math.PI*2); ctx.fill();
    }else if(fx.type==='boom'){
      var p = fx.t/14;
      ctx.fillStyle = 'rgba(255,150,50,' + (1-p) + ')';
      ctx.beginPath(); ctx.arc(fx.x, fx.y, 6 + p*14, 0, Math.PI*2); ctx.fill();
    }else if(fx.type==='boomBig'){
      var p = fx.t/26;
      var grd = ctx.createRadialGradient(fx.x,fx.y,2,fx.x,fx.y,10+p*30);
      grd.addColorStop(0, 'rgba(255,255,190,' + (1-p) + ')');
      grd.addColorStop(0.4, 'rgba(255,150,40,' + (0.95-p*0.95) + ')');
      grd.addColorStop(1, 'rgba(120,30,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, 10+p*30, 0, Math.PI*2); ctx.fill();
    }
  }
}

function draw(){
  drawMap();
  if(player && player.alive) drawTank(player);
  for(var i=0;i<enemies.length;i++) drawTank(enemies[i]);
  drawBullets();
  drawEffects();
}

/* ---------- 主循环 ---------- */
function loop(){
  if(state==='play'){
    spawnTimer++;
    if(spawnTimer >= 100){
      spawnTimer = 0;
      spawnEnemy();
    }
    updatePlayer();
    updateAI();
    updateBullets();
    updateEffects();
    // 胜利判定
    if(enemyQueue<=0 && enemies.length===0) winLevel();
  }else{
    updateEffects();
  }
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('btnStart').onclick = function(){ startGame(true); };
updateHUD();
loop();
})();
</script>
