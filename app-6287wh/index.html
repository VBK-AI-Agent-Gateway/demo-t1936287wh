<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}
h1 {
  font-size: 28px;
  margin-bottom: 16px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 4px;
}
.status {
  font-size: 18px;
  margin-bottom: 12px;
  height: 26px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status .dot {
  width: 16px; height: 16px; border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
}
.black-dot { background: radial-gradient(circle at 35% 35%, #555, #000); }
.white-dot { background: radial-gradient(circle at 35% 35%, #fff, #bbb); }
.board-wrap {
  position: relative;
  padding: 20px;
  background: linear-gradient(145deg, #d4a45a, #c08e42);
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
}
canvas { display: block; cursor: pointer; touch-action: manipulation; }
.controls {
  margin-top: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  padding: 10px 22px;
  font-size: 15px;
  border: none;
  border-radius: 24px;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  color: #fff;
  backdrop-filter: blur(4px);
  transition: all 0.2s;
  border: 1px solid rgba(255,255,255,0.18);
}
button:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
button:active { transform: translateY(0); }
button.primary { background: #e94560; border-color: #e94560; }
button.primary:hover { background: #ff5f7a; }
.score {
  margin-top: 12px;
  font-size: 14px;
  opacity: 0.85;
  display: flex;
  gap: 20px;
}
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  backdrop-filter: blur(3px);
  z-index: 10;
}
.overlay.show { display: flex; }
.overlay .msg {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}
.overlay .sub { font-size: 15px; opacity: 0.8; margin-bottom: 24px; }
.overlay button { padding: 12px 32px; font-size: 16px; }
@media (max-width: 500px) {
  h1 { font-size: 22px; }
  .status { font-size: 15px; }
  button { padding: 9px 16px; font-size: 14px; }
}
</style>
</head>
<body>

<h1>五 子 棋</h1>
<div class="status" id="status"><span class="dot black-dot"></span><span>黑棋落子</span></div>

<div class="board-wrap">
  <canvas id="board"></canvas>
  <div class="overlay" id="overlay">
    <div class="msg" id="winMsg"></div>
    <div class="sub" id="winSub"></div>
    <button class="primary" onclick="resetGame()">再来一局</button>
  </div>
</div>

<div class="controls">
  <button onclick="resetGame()">重新开始</button>
  <button onclick="undo()">悔棋</button>
  <button id="modeBtn" onclick="toggleMode()">双人对战</button>
</div>

<div class="score">
  <span>黑棋: <b id="scoreB">0</b> 胜</span>
  <span>白棋: <b id="scoreW">0</b> 胜</span>
  <span>和局: <b id="scoreD">0</b></span>
</div>

<script>
const SIZE = 15;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');

// 高分屏适配
const dpr = window.devicePixelRatio || 1;
let cell, padding, boardPx;

function layout() {
  const maxW = Math.min(window.innerWidth - 80, 480);
  cell = Math.floor(maxW / (SIZE + 1));
  padding = cell;
  boardPx = cell * (SIZE - 1) + padding * 2;
  canvas.style.width = boardPx + 'px';
  canvas.style.height = boardPx + 'px';
  canvas.width = boardPx * dpr;
  canvas.height = boardPx * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
layout();
window.addEventListener('resize', () => { layout(); draw(); });

let board, history, current, gameOver, mode; // mode: 'pvp' | 'pve'
let scores = { B: 0, W: 0, D: 0 };

function resetGame() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  history = [];
  current = 1; // 1=黑 2=白
  gameOver = false;
  overlay.classList.remove('show');
  updateStatus();
  draw();
}

function toggleMode() {
  mode = mode === 'pvp' ? 'pve' : 'pvp';
  document.getElementById('modeBtn').textContent = mode === 'pvp' ? '双人对战' : '人机对战';
  resetGame();
}

function updateStatus() {
  const isBlack = current === 1;
  statusEl.innerHTML = `<span class="dot ${isBlack ? 'black-dot' : 'white-dot'}"></span><span>${isBlack ? '黑棋' : '白棋'}落子</span>`;
}

// 绘制
function draw() {
  ctx.clearRect(0, 0, boardPx, boardPx);

  // 棋盘底色
  const g = ctx.createLinearGradient(0, 0, boardPx, boardPx);
  g.addColorStop(0, '#e8c07a');
  g.addColorStop(1, '#d4a45a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, boardPx, boardPx);

  // 网格线
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const p = padding + i * cell;
    ctx.beginPath();
    ctx.moveTo(padding, p);
    ctx.lineTo(padding + (SIZE - 1) * cell, p);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p, padding);
    ctx.lineTo(p, padding + (SIZE - 1) * cell);
    ctx.stroke();
  }

  // 星位
  const stars = [3, 7, 11];
  ctx.fillStyle = '#5a3a1a';
  for (const r of stars) for (const c of stars) {
    ctx.beginPath();
    ctx.arc(padding + c * cell, padding + r * cell, cell * 0.12, 0, Math.PI * 2);
    ctx.fill();
  }

  // 棋子
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) continue;
      drawPiece(r, c, board[r][c]);
    }
  }

  // 最后一手标记
  if (history.length) {
    const [r, c] = history[history.length - 1];
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(padding + c * cell, padding + r * cell, cell * 0.28, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawPiece(r, c, color) {
  const x = padding + c * cell;
  const y = padding + r * cell;
  const rad = cell * 0.42;

  // 阴影
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 3;

  const g = ctx.createRadialGradient(x - rad * 0.35, y - rad * 0.35, rad * 0.1, x, y, rad);
  if (color === 1) {
    g.addColorStop(0, '#666');
    g.addColorStop(0.5, '#222');
    g.addColorStop(1, '#000');
  } else {
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.6, '#f0f0f0');
    g.addColorStop(1, '#c8c8c8');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 落子
function place(r, c) {
  if (gameOver || board[r][c] !== 0) return;
  board[r][c] = current;
  history.push([r, c]);
  draw();

  if (checkWin(r, c, current)) {
    gameOver = true;
    const winner = current === 1 ? '黑棋' : '白棋';
    scores[current === 1 ? 'B' : 'W']++;
    updateScores();
    showOverlay(`${winner} 获胜！`, `第 ${history.length} 手`);
    return;
  }
  if (history.length === SIZE * SIZE) {
    gameOver = true;
    scores.D++;
    updateScores();
    showOverlay('平局', '棋盘已满');
    return;
  }

  current = current === 1 ? 2 : 1;
  updateStatus();

  if (mode === 'pve' && current === 2 && !gameOver) {
    setTimeout(aiMove, 300);
  }
}

function checkWin(r, c, color) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let sign = 1; sign >= -1; sign -= 2) {
      let nr = r + dr * sign, nc = c + dc * sign;
      while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
        count++;
        nr += dr * sign;
        nc += dc * sign;
      }
    }
    if (count >= 5) return true;
  }
  return false;
}

// AI：优先取胜/防守，否则评分选点
function aiMove() {
  if (gameOver) return;
  let best = null, bestScore = -Infinity;
  const me = 2, opp = 1;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== 0) continue;
      // 只考虑已有棋子相邻的空位（性能优化）
      if (!hasNeighbor(r, c)) {
        if (history.length > 0) continue;
      }
      const atk = evaluatePoint(r, c, me);
      const def = evaluatePoint(r, c, opp);
      const center = 7 - Math.abs(r - 7) + 7 - Math.abs(c - 7);
      const score = Math.max(atk, def * 0.9) + center * 0.5 + Math.random() * 2;
      if (score > bestScore) { bestScore = score; best = [r, c]; }
    }
  }
  if (best) place(best[0], best[1]);
}

function hasNeighbor(r, c) {
  for (let dr = -2; dr <= 2; dr++)
    for (let dc = -2; dc <= 2; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] !== 0) return true;
    }
  return false;
}

// 评估在 (r,c) 放置 color 的价值
function evaluatePoint(r, c, color) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  let total = 0;
  for (const [dr, dc] of dirs) {
    let count = 1, open = 0;
    for (let sign = 1; sign >= -1; sign -= 2) {
      let nr = r + dr * sign, nc = c + dc * sign;
      while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
        count++;
        nr += dr * sign;
        nc += dc * sign;
      }
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === 0) open++;
    }
    total += lineScore(count, open);
  }
  return total;
}

function lineScore(count, open) {
  if (count >= 5) return 100000;
  if (count === 4) return open === 2 ? 10000 : open === 1 ? 1000 : 0;
  if (count === 3) return open === 2 ? 1000 : open === 1 ? 100 : 0;
  if (count === 2) return open === 2 ? 100 : open === 1 ? 10 : 0;
  if (count === 1) return open === 2 ? 10 : open === 1 ? 1 : 0;
  return 0;
}

function showOverlay(msg, sub) {
  document.getElementById('winMsg').textContent = msg;
  document.getElementById('winSub').textContent = sub;
  overlay.classList.add('show');
}

function updateScores() {
  document.getElementById('scoreB').textContent = scores.B;
  document.getElementById('scoreW').textContent = scores.W;
  document.getElementById('scoreD').textContent = scores.D;
}

function undo() {
  if (!history.length || gameOver && mode === 'pve') { if (gameOver) return; }
  if (mode === 'pve') {
    // 人机模式：一次撤两步（AI+玩家），若只剩一步则撤一步
    const steps = history.length >= 2 ? 2 : 1;
    for (let i = 0; i < steps; i++) {
      const [r, c] = history.pop();
      board[r][c] = 0;
      current = current === 1 ? 2 : 1;
    }
  } else {
    const [r, c] = history.pop();
    board[r][c] = 0;
    current = current === 1 ? 2 : 1;
  }
  if (gameOver) { gameOver = false; overlay.classList.remove('show'); }
  updateStatus();
  draw();
}

// 点击落子（含触摸）
function handlePlay(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const c = Math.round((x - padding) / cell);
  const r = Math.round((y - padding) / cell);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
  // 判定是否靠近交叉点
  const dx = Math.abs(x - (padding + c * cell));
  const dy = Math.abs(y - (padding + r * cell));
  if (dx > cell * 0.45 || dy > cell * 0.45) return;
  if (mode === 'pve' && current === 2) return; // AI 思考中，忽略玩家落子
  place(r, c);
}

canvas.addEventListener('mousedown', handlePlay);
canvas.addEventListener('touchstart', handlePlay, { passive: false });

// 初始化
mode = 'pvp';
resetGame();
</script>
</body>
</html>
