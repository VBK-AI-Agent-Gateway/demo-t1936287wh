<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杏林堂 · 中医诊所管理系统</title>
<style>
:root{
  --brand:#1f6f5c; --brand-d:#14574a; --brand-l:#e6f2ee;
  --gold:#b98a2f; --bg:#f4f6f5; --card:#fff; --line:#e2e8e6;
  --txt:#22302c; --sub:#71807b; --red:#c0392b; --blue:#2a6f97;
  --shadow:0 1px 3px rgba(20,50,40,.08),0 4px 16px rgba(20,50,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;background:linear-gradient(180deg,#173f35,#1f6f5c 60%,#14574a);color:#dfece8;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo b{font-size:20px;letter-spacing:4px;color:#fff;display:block}
.logo span{font-size:11px;color:#9fc4ba;letter-spacing:2px}
nav{flex:1;overflow:auto;padding:10px 0}
nav .grp{font-size:11px;color:#7fa89d;padding:12px 18px 6px;letter-spacing:2px}
nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#cfe3dd;text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:.15s}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.on{background:rgba(255,255,255,.12);color:#ffd98a;border-left-color:#ffd98a}
nav a .ico{width:18px;text-align:center}
.side-foot{padding:14px 18px;font-size:12px;color:#9fc4ba;border-top:1px solid rgba(255,255,255,.12)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px;flex-shrink:0}
#topbar h1{font-size:17px;font-weight:600}
#topbar .date{margin-left:auto;color:var(--sub);font-size:13px}
#content{flex:1;overflow:auto;padding:20px 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
.card .t{font-size:12px;color:var(--sub);margin-bottom:6px}
.card .v{font-size:26px;font-weight:700;color:var(--brand)}
.card .v small{font-size:13px;font-weight:400;color:var(--sub);margin-left:4px}
.card.gold .v{color:var(--gold)} .card.blue .v{color:var(--blue)} .card.red .v{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel>.hd{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600}
.panel>.hd .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}
.panel>.bd{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7faf9;color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0}
tr:hover td{background:#f9fcfb}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right}
.muted{color:var(--sub)} .sm{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:none;border-radius:7px;padding:8px 15px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-l)}
.btn.gold{background:var(--gold)} .btn.gold:hover{background:#9a7224}
.btn.red{background:var(--red)} .btn.red:hover{background:#96291d}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid #ccd6d3;border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,92,.12)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.fld{margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px}
.tag.g{background:#e6f2ee;color:#1f6f5c}.tag.y{background:#fdf3dd;color:#9a7224}
.tag.b{background:#e3eff7;color:#2a6f97}.tag.r{background:#fdeae7;color:#c0392b}
.tag.gray{background:#eef1f0;color:#71807b}
.mask{position:fixed;inset:0;background:rgba(15,35,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{width:860px}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;display:flex;align-items:center}
.modal .mh .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:18px;line-height:1;padding:2px 6px;border-radius:5px}
.modal .mh .x:hover{background:#f0f3f2}
.modal .mb{padding:18px 20px;max-height:70vh;overflow:auto}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.rx-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rx-item input.dose{width:90px}
.rx-item .rm{cursor:pointer;color:var(--red);padding:4px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#22302c;color:#fff;padding:10px 22px;border-radius:8px;z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{width:70%;background:linear-gradient(180deg,#2f9b82,#1f6f5c);border-radius:4px 4px 0 0;display:block;min-height:3px}
.bars .b span{font-size:11px;color:var(--sub)}
.bars .b em{font-style:normal;font-size:11px;color:var(--brand);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.quick button{border:1px dashed var(--brand);background:#fff;color:var(--brand);border-radius:9px;padding:14px 8px;cursor:pointer;font-size:13.5px;transition:.15s}
.quick button:hover{background:var(--brand-l);border-style:solid}
.list-item{padding:10px 4px;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:center}
.list-item:last-child{border:none}
.empty{padding:34px;text-align:center;color:var(--sub)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;padding:9px 16px;cursor:pointer;font-size:14px;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13.5px}
.kv .k{color:var(--sub)}
@media print{#sidebar,#topbar,.noprint{display:none!important}#content{padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><b>杏林堂</b><span>TCM CLINIC MANAGER</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">数据本地存储 · 可导出备份</div>
  </aside>
  <div id="main">
    <div id="topbar"><h1 id="pageTitle">工作台</h1><div class="date" id="today"></div></div>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
