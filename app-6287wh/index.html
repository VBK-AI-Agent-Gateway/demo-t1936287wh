<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no-scale">
<title>五子棋 · Gomoku</title>
<style>
  :root{
    --board:#dcb065;
    --line:#7a5a2a;
    --bg:#2b2f36;
    --panel:#3a4048;
    --accent:#e8a33d;
    --text:#f2f4f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:linear-gradient(160deg,#23272e,#333944);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:16px;
  }
  .app{
    display:flex;gap:20px;flex-wrap:wrap;justify-content:center;
    align-items:flex-start;width:100%;max-width:960px;
  }
  .board-wrap{
    position:relative;
    background:var(--board);
    border-radius:12px;
    padding:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(140,90,20,.25);
  }
  canvas{display:block;touch-action:manipulation;cursor:pointer;border-radius:6px}
  .panel{
    background:var(--panel);
    border-radius:12px;
    padding:18px;
    width:250px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    display:flex;flex-direction:column;gap:14px;
  }
  h1{font-size:22px;margin:0;letter-spacing:2px}
  .sub{font-size:12px;opacity:.65;margin-top:-8px}
  .status{
    background:#2c3138;border-radius:10px;padding:12px;
    font-size:15px;text-align:center;line-height:1.6;
  }
  .turn-dot{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    vertical-align:-2px;margin-right:6px;border:2px solid rgba(255,255,255,.4);
  }
  .turn-dot.black{background:#111}
  .turn-dot.white{background:#f5f5f5}
  .scores{display:flex;gap:10px}
  .score{
    flex:1;background:#2c3138;border-radius:10px;padding:10px;text-align:center;
  }
  .score b{display:block;font-size:24px;color:var(--accent)}
  .score span{font-size:12px;opacity:.7}
  .opts{display:flex;flex-direction:column;gap:8px;font-size:14px}
  .opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
  select{
    background:#2c3138;color:var(--text);border:1px solid #4b525c;
    border-radius:6px;padding:6px 8px;font-size:14px;width:100%;
  }
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{
    flex:1;min-width:70px;
    background:var(--accent);color:#241a05;border:none;
    padding:11px 8px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button.ghost{background:#4a515b;color:var(--text)}
  .log{
    background:#2c3138;border-radius:8px;height:96px;overflow-y:auto;
    font-size:12px;padding:8px;line-height:1.7;opacity:.85;
  }
  .log div::before{content:"› ";color:var(--accent)}
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    display:none;align-items:center;justify-content:center;z-index:10;
  }
  .modal.show{display:flex}
  .modal .card{
    background:var(--panel);padding:28px 34px;border-radius:14px;text-align:center;
    animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{margin:0 0 6px;font-size:26px;color:var(--accent)}
  .modal p{margin:0 0 18px;opacity:.8}
  @media (max-width:720px){
    .panel{width:100%;max-width:420px}
    .app{flex-direction:column;align-items:center}
  }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap"><canvas id="board"></canvas></div>

  <div class="panel">
    <div>
      <h1>五子棋</h1>
      <div class="sub">GOMOKU · 15×15</div>
    </div>

    <div class="status" id="status">黑棋落子</div>

    <div class="scores">
      <div class="score"><b id="scoreB">0</b><span>黑棋胜</span></div>
      <div class="score"><b id="scoreW">0</b><span>白棋胜</span></div>
    </div>

    <div class="opts">
      <label>模式
        <select id="mode">
          <option value="pvp">双人对战</option>
          <option value="pve" selected>人机对战</option>
        </select>
      </label>
      <label>执子
        <select id="side">
          <option value="black" selected>执黑（先手）</option>
          <option value="white">执白（后手）</option>
        </select>
      </label>
      <label>难度
        <select id="level">
          <option value="1">简单</option>
          <option value="2" selected>中等</option>
          <option value="3">困难</option>
        </select>
      </label>
      <label><input type="checkbox" id="showCoord" checked> 显示坐标</label>
    </div>

    <div class="btns">
      <button id="btnUndo">悔棋</button>
      <button id="btnRestart" class="ghost">重开</button>
    </div>

    <div class="log" id="log"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2 id="modalTitle">黑棋胜利</h2>
    <p id="modalText">五子连珠！</p>
    <div class="btns" style="width:220px">
      <button id="btnAgain">再来一局</button>
      <button id="btnClose" class="ghost">关闭</button>
    </div>
  </div>
</div>

<script>
(()=>{
const N=15;
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
let cell,px,pad,dpr;

let G,turn,history,over,scores={b:0,w:0},busy=false;

const el=id=>document.getElementById(id);
const modeEl=el('mode'),sideEl=el('side'),levelEl=el('level'),coordEl=el('showCoord');

function newGame(){
  G=Array.from({length:N},()=>Array(N).fill(0));
  turn=1;history=[];over=false;busy=false;
  el('log').innerHTML='';
  el('modal').classList.remove('show');
  updateStatus();
  draw();
  if(modeEl.value==='pve'&&sideEl.value==='white') setTimeout(aiMove,300);
}
function updateStatus(){
  const s=el('status');
  if(over){s.innerHTML='游戏结束';return;}
  const c=turn===1?'black':'white';
  const name=turn===1?'黑棋':'白棋';
  if(modeEl.value==='pve'){
    const mine=(turn===1)===(sideEl.value==='black');
    s.innerHTML=`<span class="turn-dot ${c}"></span>${mine?'你':'电脑'}（${name}）落子${mine?'':'…'}`;
  }else{
    s.innerHTML=`<span class="turn-dot ${c}"></span>${name}落子`;
  }
}
function log(msg){
  const d=document.createElement('div');d.textContent=msg;
  el('log').appendChild(d);el('log').scrollTop=1e9;
}
const colName=i=>String.fromCharCode(65+i);
const rowName=j=>N-j;

function resize(){
  dpr=window.devicePixelRatio||1;
  const max=Math.min(window.innerWidth-40,window.innerHeight-120,560);
  pad=Math.round(max*0.055);
  cell=(max-pad*2)/(N-1);
  const size=cell*(N-1)+pad*2;
  cv.style.width=size+'px';cv.style.height=size+'px';
  cv.width=size*dpr;cv.height=size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  px=i=>pad+i*cell;
  draw();
}
function draw(){
  const size=cv.width/dpr;
  ctx.clearRect(0,0,size,size);
  // board bg
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#e6bd77');g.addColorStop(1,'#d3a357');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);

  // lines
  ctx.strokeStyle='#6d4f26';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(px(0),px(i));ctx.lineTo(px(N-1),px(i));ctx.stroke();
    ctx.beginPath();ctx.moveTo(px(i),px(0));ctx.lineTo(px(i),px(N-1));ctx.stroke();
  }
  // star points
  ctx.fillStyle='#6d4f26';
  [[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(([i,j])=>{
    ctx.beginPath();ctx.arc(px(i),px(j),cell*0.11,0,7);ctx.fill();
  });
  // coords
  if(coordEl.checked){
    ctx.fillStyle='rgba(80,55,20,.75)';
    ctx.font=`${Math.max(9,cell*0.42)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(let i=0;i<N;i++){
      ctx.fillText(colName(i),px(i),pad*0.45);
      ctx.fillText(rowName(j=i),pad*0.45,px(i));
    }
  }
  // stones
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    if(G[j][i]) drawStone(i,j,G[j][i]);
  }
  // last move mark
  if(history.length){
    const [li,lj]=history[history.length-1];
    ctx.strokeStyle=G[lj][li]===1?'#ff5a5a':'#ff5a5a';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px(li),px(lj),cell*0.16,0,7);ctx.stroke();
  }
}
function drawStone(i,j,v){
  const x=px(i),y=px(j),r=cell*0.43;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=r*0.5;ctx.shadowOffsetY=2;
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  if(v===1){g.addColorStop(0,'#5a5a5a');g.addColorStop(1,'#0a0a0a');}
  else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d8d8d8');}
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.restore();
}
function place(i,j,v){
  G[j][i]=v;history.push([i,j]);
  log(`${v===1?'黑':'白'} ${colName(i)}${rowName(j)}`);
  draw();
  if(checkWin(i,j,v)){
    over=true;
    if(v===1)scores.b++;else scores.w++;
    el('scoreB').textContent=scores.b;el('scoreW').textContent=scores.w;
    updateStatus();
    setTimeout(()=>showModal(v),350);
    return true;
  }
  if(history.length===N*N){over=true;updateStatus();setTimeout(()=>showModal(0),350);return true;}
  turn=3-v;updateStatus();
  return false;
}
function showModal(v){
  el('modalTitle').textContent=v===0?'平局':(v===1?'黑棋胜利':'白棋胜利');
  el('modalText').textContent=v===0?'棋盘已满，握手言和。':'五子连珠，精彩！';
  el('modal').classList.add('show');
}
function checkWin(i,j,v){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let c=1;
    for(let s=1;s<5;s++){
      const x=i+dx*s,y=j+dy*s;
      if(x<0||y<0||x>=N||y>=N||G[y][x]!==v)break;c++;
    }
    for(let s=1;s<5;s++){
      const x=i-dx*s,y=j-dy*s;
      if(x<0||y<0||x>=N||y>=N||G[y][x]!==v)break;c++;
    }
    if(c>=5)return true;
  }
  return false;
}

/* ---------- AI ---------- */
function neighbors(i,j,r=2){
  const out=[];
  for(let y=j-r;y<=j+r;y++)for(let x=i-r;x<=i+r;x++){
    if(x<0||y<0||x>=N||y>=N||(x===i&&y===j))continue;
    if(G[y][x]===0)out.push([x,y]);
  }
  return out;
}
function candidates(){
  if(history.length===0)return [[7,7]];
  const set=new Set();
  history.forEach(([i,j])=>neighbors(i,j,2).forEach(([x,y])=>set.add(x+','+y)));
  return [...set].map(s=>s.split(',').map(Number));
}
function lineScore(i,j,v){
  // evaluate point for player v (offense + defense)
  let total=0;
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let cnt=1,block=0,empty=0;
    // forward
    for(let s=1;s<=4;s++){
      const x=i+dx*s,y=j+dy*s;
      if(x<0||y<0||x>=N||y>=N){block++;break;}
      if(G[y][x]===v)cnt++;
      else if(G[y][x]===0){empty++;break;}
      else{block++;break;}
    }
    for(let s=1;s<=4;s++){
      const x=i-dx*s,y=j-dy*s;
      if(x<0||y<0||x>=N||y>=N){block++;break;}
      if(G[y][x]===v)cnt++;
      else if(G[y][x]===0){empty++;break;}
      else{block++;break;}
    }
    total+=shapeScore(cnt,block,empty);
  }
  return total;
}
function shapeScore(cnt,block,empty){
  if(cnt>=5)return 100000;
  if(cnt===4){ if(block===0)return 10000; if(block===1)return 1000; return 100;}
  if(cnt===3){ if(block===0)return 800; if(block===1)return 100; return 20;}
  if(cnt===2){ if(block===0)return 60; if(block===1)return 12; return 4;}
  if(cnt===1){ if(block===0)return 6; return 1;}
  return 0;
}
function evaluatePoint(i,j){
  if(G[j][i]!==0)return -1;
  const me=aiSide(),opp=3-me;
  return lineScore(i,j,me)*1.15 + lineScore(i,j,opp);
}
function aiSide(){
  // AI is opposite of human's chosen side
  return sideEl.value==='black'?2:1;
}
function aiMove(){
  if(over||busy)return;
  busy=true;
  setTimeout(()=>{
    const lv=+levelEl.value;
    const cand=candidates();
    let best=null,bestV=-Infinity;
    // sort by quick eval
    const scored=cand.map(([x,y])=>[x,y,evaluatePoint(x,y)]);
    scored.sort((a,b)=>b[2]-a[2]);
    const pool=lv===1?scored.slice(0,8):lv===2?scored.slice(0,12):scored.slice(0,16);

    for(const [x,y] of pool){
      let v;
      if(lv===1){
        v=evaluatePoint(x,y)+Math.random()*80;
      }else{
        // attack: can I win / make threat
        G[y][x]=aiSide();
        const atk=lineScore(x,y,aiSide());
        const win=checkWin(x,y,aiSide());
        G[y][x]=0;
        // defense: block opponent win / threat
        G[y][x]=3-aiSide();
        const def=lineScore(x,y,3-aiSide());
        const oppWin=checkWin(x,y,3-aiSide());
        G[y][x]=0;
        v=atk*1.15+def+(win?1e7:0)+(oppWin?5e6:0);
        if(lv===3)v+=evaluatePoint(x,y)*0.2;
      }
      if(v>bestV){bestV=v;best=[x,y];}
    }
    if(!best&&cand.length)best=cand[0];
    busy=false;
    if(best&&!over)place(best[0],best[1],turn);
  },160);
}

/* ---------- input ---------- */
function humanMove(i,j){
  if(over||busy)return;
  if(G[j][i]!==0)return;
  if(modeEl.value==='pve'&&turn!==aiSide()===false)return;
  const ended=place(i,j,turn);
  if(!ended&&modeEl.value==='pve')setTimeout(aiMove,220);
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const i=Math.round((x-pad)/cell),j=Math.round((y-pad)/cell);
  if(i<0||j<0||i>=N||j>=N)return;
  if(Math.abs(px(i)-x)>cell*0.48||Math.abs(px(j)-y)>cell*0.48)return;
  if(modeEl.value==='pve'&&turn!==aiSide()){
    // not human's turn
    if(busy)return;
  }
  if(G[j][i]!==0)return;
  humanMove(i,j);
});

/* ---------- controls ---------- */
el('btnUndo').addEventListener('click',()=>{
  if(!history.length||busy)return;
  const undoOnce=()=>{
    const [i,j]=history.pop();
    G[j][i]=0;turn=3-turn;
    log(`悔棋 ${colName(i)}${rowName(j)}`);
  };
  undoOnce();
  if(modeEl.value==='pve'&&history.length&&turn!==aiSide())undoOnce();
  over=false;
  el('modal').classList.remove('show');
  updateStatus();draw();
});
el('btnRestart').addEventListener('click',newGame);
el('btnAgain').addEventListener('click',newGame);
el('btnClose').addEventListener('click',()=>el('modal').classList.remove('show'));
modeEl.addEventListener('change',newGame);
sideEl.addEventListener('change',newGame);
coordEl.addEventListener('change',draw);
window.addEventListener('resize',resize);

resize();
newGame();
})();
</script>
</body>
</html>
