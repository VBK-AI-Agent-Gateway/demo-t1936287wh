<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图匠 · 本地图片编辑器</title>
<meta name="description" content="纯浏览器本地图片编辑器：裁剪、旋转、缩放、调色、滤镜、水印，导出 PNG/JPG/WebP，图片不上传服务器。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◧</span>
    <span class="name">图匠 <em>Image Studio</em></span>
  </div>
  <div class="top-actions">
    <button id="btnOpen" class="btn btn-ghost">打开图片</button>
    <button id="btnUndo" class="btn btn-ghost" disabled>撤销</button>
    <button id="btnReset" class="btn btn-ghost" disabled>重置</button>
    <button id="btnDownload" class="btn btn-primary" disabled>下载图片</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="上传图片">
      <div class="dz-inner">
        <div class="dz-icon">⇪</div>
        <p class="dz-title">拖拽图片到此处，或点击选择</p>
        <p class="dz-sub">支持 JPG / PNG / WebP / GIF / SVG · 全程本地处理，不上传服务器</p>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap" hidden>
      <canvas id="viewCanvas" aria-label="图片预览画布"></canvas>
      <div class="crop-overlay" id="cropOverlay" hidden>
        <div class="crop-box" id="cropBox">
          <span class="h tl" data-h="tl"></span><span class="h tr" data-h="tr"></span>
          <span class="h bl" data-h="bl"></span><span class="h br" data-h="br"></span>
          <span class="h t" data-h="t"></span><span class="h b" data-h="b"></span>
          <span class="h l" data-h="l"></span><span class="h r" data-h="r"></span>
          <div class="crop-info" id="cropInfo">0 × 0</div>
        </div>
      </div>
    </div>
    <div class="statusbar" id="statusbar" hidden>
      <span id="metaName">—</span>
      <span id="metaSize">—</span>
      <span id="metaDim">—</span>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="adjust" role="tab">调节</button>
      <button class="tab" data-tab="crop" role="tab">裁剪</button>
      <button class="tab" data-tab="geo" role="tab">尺寸</button>
      <button class="tab" data-tab="filter" role="tab">滤镜</button>
      <button class="tab" data-tab="text" role="tab">水印</button>
      <button class="tab" data-tab="export" role="tab">导出</button>
    </div>

    <div class="tab-body">
      <!-- 调节 -->
      <section class="tab-pane active" id="pane-adjust">
        <div class="slider-row">
          <label for="sBrightness">亮度 <output id="oBrightness">0</output></label>
          <input type="range" id="sBrightness" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sContrast">对比度 <output id="oContrast">0</output></label>
          <input type="range" id="sContrast" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sSaturation">饱和度 <output id="oSaturation">0</output></label>
          <input type="range" id="sSaturation" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sHue">色相 <output id="oHue">0</output></label>
          <input type="range" id="sHue" min="-180" max="180" value="0">
        </div>
        <div class="slider-row">
          <label for="sBlur">模糊 <output id="oBlur">0</output></label>
          <input type="range" id="sBlur" min="0" max="20" value="0" step="0.5">
        </div>
        <div class="slider-row">
          <label for="sSepia">复古(棕褐) <output id="oSepia">0</output></label>
          <input type="range" id="sSepia" min="0" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sGrayscale">灰度 <output id="oGrayscale">0</output></label>
          <input type="range" id="sGrayscale" min="0" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sInvert">反色 <output id="oInvert">0</output></label>
          <input type="range" id="sInvert" min="0" max="100" value="0">
        </div>
        <div class="btn-grid">
          <button class="btn btn-soft" data-quick="warm">暖调</button>
          <button class="btn btn-soft" data-quick="cool">冷调</button>
          <button class="btn btn-soft" data-quick="vivid">鲜艳</button>
          <button class="btn btn-soft" data-quick="bw">黑白</button>
        </div>
      </section>

      <!-- 裁剪 -->
      <section class="tab-pane" id="pane-crop">
        <div class="seg" role="group" aria-label="裁剪比例">
          <button class="seg-btn active" data-ratio="free">自由</button>
          <button class="seg-btn" data-ratio="1:1">1:1</button>
          <button class="seg-btn" data-ratio="4:3">4:3</button>
          <button class="seg-btn" data-ratio="3:2">3:2</button>
          <button class="seg-btn" data-ratio="16:9">16:9</button>
          <button class="seg-btn" data-ratio="9:16">9:16</button>
        </div>
        <p class="hint">在画布上拖动裁剪框，可从四角/四边调整大小。</p>
        <div class="btn-grid">
          <button class="btn btn-soft" id="btnRotateL">↺ 左转 90°</button>
          <button class="btn btn-soft" id="btnRotateR">↻ 右转 90°</button>
          <button class="btn btn-soft" id="btnFlipH">⇋ 水平翻转</button>
          <button class="btn btn-soft" id="btnFlipV">⇵ 垂直翻转</button>
        </div>
        <div class="btn-grid single">
          <button class="btn btn-primary" id="btnApplyCrop">应用裁剪</button>
        </div>
      </section>

      <!-- 尺寸 -->
      <section class="tab-pane" id="pane-geo">
        <div class="field-row">
          <label for="inW">宽度 (px)</label>
          <input type="number" id="inW" min="1" max="12000" value="0">
        </div>
        <div class="field-row">
          <label for="inH">高度 (px)</label>
          <input type="number" id="inH" min="1" max="12000" value="0">
        </div>
        <label class="check"><input type="checkbox" id="lockRatio" checked> 锁定原始比例</label>
        <div class="btn-grid">
          <button class="btn btn-soft" data-size="0.5">缩至 50%</button>
          <button class="btn btn-soft" data-size="0.25">缩至 25%</button>
          <button class="btn btn-soft" data-size="2">放大 200%</button>
        </div>
        <div class="btn-grid single">
          <button class="btn btn-primary" id="btnApplyResize">应用尺寸</button>
        </div>
      </section>

      <!-- 滤镜 -->
      <section class="tab-pane" id="pane-filter">
        <div class="filter-grid">
          <button class="filter-card" data-filter="none"><span class="prev p-none"></span>原图</button>
          <button class="filter-card" data-filter="mono"><span class="prev p-mono"></span>黑白</button>
          <button class="filter-card" data-filter="vintage"><span class="prev p-vintage"></span>老照片</button>
          <button class="filter-card" data-filter="cool"><span class="prev p-cool"></span>冷冽</button>
          <button class="filter-card" data-filter="warm"><span class="prev p-warm"></span>暖阳</button>
          <button class="filter-card" data-filter="fade"><span class="prev p-fade"></span>褪色</button>
          <button class="filter-card" data-filter="highcontrast"><span class="prev p-hc"></span>高反差</button>
          <button class="filter-card" data-filter="invert"><span class="prev p-invert"></span>底片</button>
        </div>
      </section>

      <!-- 水印 -->
      <section class="tab-pane" id="pane-text">
        <div class="field-row">
          <label for="wmText">水印文字</label>
          <input type="text" id="wmText" maxlength="60" placeholder="© 你的名字">
        </div>
        <div class="field-row three">
          <div><label for="wmSize">字号</label><input type="number" id="wmSize" min="8" max="400" value="48"></div>
          <div><label for="wmColor">颜色</label><input type="color" id="wmColor" value="#ffffff"></div>
          <div><label for="wmAlpha">透明度</label><input type="range" id="wmAlpha" min="10" max="100" value="80"></div>
        </div>
        <div class="seg" role="group" aria-label="水印位置">
          <button class="seg-btn" data-pos="tl">左上</button>
          <button class="seg-btn" data-pos="tc">顶部</button>
          <button class="seg-btn" data-pos="tr">右上</button>
          <button class="seg-btn" data-pos="ml">左中</button>
          <button class="seg-btn active" data-pos="cc">居中</button>
          <button class="seg-btn" data-pos="mr">右中</button>
          <button class="seg-btn" data-pos="bl">左下</button>
          <button class="seg-btn" data-pos="bc">底部</button>
          <button class="seg-btn" data-pos="br">右下</button>
        </div>
        <label class="check"><input type="checkbox" id="wmStroke"> 添加描边（复杂背景更清晰）</label>
        <div class="btn-grid single">
          <button class="btn btn-primary" id="btnApplyWm">应用水印</button>
        </div>
        <div class="btn-grid single">
          <button class="btn btn-ghost" id="btnClearWm">清除水印</button>
        </div>
      </section>

      <!-- 导出 -->
      <section class="tab-pane" id="pane-export">
        <div class="seg" role="group" aria-label="导出格式">
          <button class="seg-btn active" data-format="image/png">PNG</button>
          <button class="seg-btn" data-format="image/jpeg">JPG</button>
          <button class="seg-btn" data-format="image/webp">WebP</button>
        </div>
        <div class="field-row" id="qualityRow" hidden>
          <label for="inQuality">质量 <output id="oQuality">92</output>%</label>
          <input type="range" id="inQuality" min="10" max="100" value="92">
        </div>
        <div class="field-row">
          <label for="outName">文件名</label>
          <input type="text" id="outName" value="edited">
        </div>
        <p class="hint" id="exportSummary">导出尺寸：—</p>
        <div class="btn-grid single">
          <button class="btn btn-primary btn-lg" id="btnExport">下载到本地</button>
        </div>
        <p class="hint secure">🔒 图片仅在你的浏览器中处理，不会离开本机。</p>
      </section>
    </div>
  </aside>
</main>

<footer class="foot">图匠 · 纯前端图片编辑 · 无需登录 · 无水印限制</footer>
<script src="app.js"></script>
</body>
</html>
