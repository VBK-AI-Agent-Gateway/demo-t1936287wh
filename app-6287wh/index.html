<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body { background: #222; color: #eee; font-family: sans-serif; text-align: center; }
  canvas { background: #111; border: 2px solid #444; }
  .hud { margin: 10px; font-size: 18px; }
</style>
</head>
<body>
<div class="hud">得分: <span id="score">0</span> — 方向键 / WASD 控制，空格暂停 / 重开</div>
<canvas id="board" width="400" height="400"></canvas>
<script>
const cvs = document.getElementById('board');
const ctx = cvs.getContext('2d');
const CELL = 20;
const COLS = cvs.width / CELL;
const ROWS = cvs.height / CELL;

let snake, dir, nextDir, food, score, dead, paused;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  dead = false;
  paused = false;
  spawnFood();
  updateScore();
}

function spawnFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateScore() {
  document.getElementById('score').textContent = score;
}

function step() {
  if (dead || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    dead = true;
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // food
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  if (dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', cvs.width / 2, cvs.height / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('按空格重新开始', cvs.width / 2, cvs.height / 2 + 24);
  } else if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', cvs.width / 2, cvs.height / 2);
  }
}

const KEYS = {
  ArrowUp:    {x: 0, y: -1}, KeyW: {x: 0, y: -1},
  ArrowDown:  {x: 0, y: 1},  KeyS: {x: 0, y: 1},
  ArrowLeft:  {x: -1, y: 0}, KeyA: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0},  KeyD: {x: 1, y: 0},
};

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (dead) reset();
    else paused = !paused;
    draw();
    return;
  }
  const nd = KEYS[e.code];
  if (!nd) return;
  e.preventDefault();
  // 不能直接掉头
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
});

reset();
draw();
setInterval(() => { step(); draw(); }, 120);
</script>
</body>
</html>
