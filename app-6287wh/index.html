<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打地鼠游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #87CEEB 0%, #5CB85C 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  h1 {
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,.3);
    margin-bottom: 16px;
    font-size: 2rem;
  }
  .panel {
    background: rgba(255,255,255,.9);
    border-radius: 16px;
    padding: 12px 24px;
    display: flex;
    gap: 28px;
    margin-bottom: 18px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    font-weight: bold;
    color: #333;
    font-size: 1.05rem;
  }
  .panel span b { color: #e67e22; font-size: 1.2rem; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    gap: 18px;
    background: #8B5A2B;
    padding: 24px;
    border-radius: 24px;
    box-shadow: inset 0 0 30px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.3);
  }
  .hole {
    width: 120px;
    height: 120px;
    background: radial-gradient(ellipse at center, #2b1a0e 60%, #4a2f1a 100%);
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 8px 16px rgba(0,0,0,.7);
  }
  .mole {
    position: absolute;
    left: 50%;
    bottom: -100px;
    transform: translateX(-50%);
    width: 86px;
    height: 96px;
    transition: bottom .15s ease-out;
    pointer-events: none;
  }
  .hole.up .mole { bottom: 8px; }
  .mole .body {
    width: 86px; height: 86px;
    background: radial-gradient(circle at 35% 30%, #b0794a, #7a4a22);
    border-radius: 50% 50% 45% 45%;
    position: relative;
  }
  .mole .body::before, .mole .body::after {
    content: ""; position: absolute;
    width: 24px; height: 24px;
    background: #7a4a22; border-radius: 50%;
    top: -6px;
  }
  .mole .body::before { left: 6px; }
  .mole .body::after { right: 6px; }
  .mole .face {
    position: absolute; top: 26px; left: 0; right: 0;
    text-align: center; font-size: 34px; line-height: 1;
  }
  .mole .whack {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 48px;
    background: rgba(255,255,255,.35);
    border-radius: 50%;
  }
  .hole.hit .mole .whack { display: flex; }
  .hole.hit .mole .face { display: none; }
  .bomb .body { background: radial-gradient(circle at 35% 30%, #555, #111); }
  .bomb .face::after { content: "💣"; }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    background: #e67e22;
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #b9600f;
    transition: transform .1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9600f; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  select {
    padding: 10px;
    border-radius: 999px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: #fff;
    padding: 36px 48px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  .dialog h2 { color: #e67e22; margin-bottom: 14px; font-size: 1.7rem; }
  .dialog p { color: #555; margin-bottom: 20px; font-size: 1.1rem; }
  .tips { color: rgba(255,255,255,.9); margin-top: 14px; font-size: .9rem; }
</style>
</head>
<body>
  <h1>🐹 打地鼠 🌭</h1>
  <div class="panel">
    <span>得分：<b id="score">0</b></span>
    <span>时间：<b id="time">30</b>s</span>
    <span>连击：<b id="combo">0</b></span>
  </div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button id="startBtn">开始游戏</button>
    <select id="difficulty">
      <option value="easy">简单</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难</option>
    </select>
  </div>
  <p class="tips">规则：点地鼠 +10 分（连击加成），点到 💣 扣 20 分</p>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="dlgTitle">时间到！</h2>
      <p id="dlgText"></p>
      <button id="againBtn">再来一局</button>
    </div>
  </div>

<script>
(function () {
  const HOLES = 9;
  const ROUND_TIME = 30;
  const CONFIG = {
    easy:   { up: 1100, spawn: 700, maxUp: 1, bombRate: 0.10 },
    normal: { up: 850,  spawn: 520, maxUp: 2, bombRate: 0.15 },
    hard:   { up: 650,  spawn: 380, maxUp: 3, bombRate: 0.22 },
  };

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const comboEl = document.getElementById('combo');
  const startBtn = document.getElementById('startBtn');
  const difficultySel = document.getElementById('difficulty');
  const overlay = document.getElementById('overlay');
  const dlgTitle = document.getElementById('dlgTitle');
  const dlgText = document.getElementById('dlgText');
  const againBtn = document.getElementById('againBtn');

  const holes = [];
  for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML =
      '<div class="mole">' +
        '<div class="body"><div class="face">🐹</div><div class="whack">💥</div></div>' +
      '</div>';
    hole.addEventListener('mousedown', whack);
    board.appendChild(hole);
    holes.push({ el: hole, active: false, timer: null, isBomb: false });
  }

  let score = 0, combo = 0, timeLeft = ROUND_TIME;
  let running = false;
  let tickTimer = null, spawnTimer = null;

  function randomUp() {
    if (!running) return;
    const cfg = CONFIG[difficultySel.value];
    const idle = holes.filter(h => !h.active);
    const upCount = holes.filter(h => h.active && !h.isBomb).length;
    if (idle.length && upCount < cfg.maxUp) {
      const h = idle[Math.floor(Math.random() * idle.length)];
      h.active = true;
      h.isBomb = Math.random() < cfg.bombRate;
      h.el.classList.toggle('bomb', h.isBomb);
      h.el.classList.add('up');
      h.timer = setTimeout(() => hide(h), cfg.up + Math.random() * 400);
    }
    spawnTimer = setTimeout(randomUp, cfg.spawn * (0.6 + Math.random() * 0.9));
  }

  function hide(h) {
    h.el.classList.remove('up', 'hit', 'bomb');
    h.active = false;
    h.isBomb = false;
    clearTimeout(h.timer);
    h.timer = null;
  }

  function whack(e) {
    if (!running) return;
    const h = holes.find(x => x.el === e.currentTarget);
    if (!h || !h.active) return;

    if (h.isBomb) {
      score = Math.max(0, score - 20);
      combo = 0;
      h.el.classList.add('hit');
      beep(120, .18);
      setTimeout(() => hide(h), 350);
    } else {
      combo++;
      score += 10 + Math.min(combo - 1, 5) * 2;
      h.el.classList.add('hit');
      beep(660, .08);
      setTimeout(() => hide(h), 300);
    }
    render();
  }

  let audioCtx = null;
  function beep(freq, dur) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq;
      o.type = 'square';
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function render() {
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    comboEl.textContent = combo;
  }

  function start() {
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    holes.forEach(hide);
    score = 0; combo = 0; timeLeft = ROUND_TIME;
    running = true;
    overlay.classList.remove('show');
    startBtn.disabled = true;
    difficultySel.disabled = true;
    render();
    randomUp();
    tickTimer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) return end();
      render();
    }, 1000);
  }

  function end() {
    running = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    holes.forEach(hide);
    startBtn.disabled = false;
    difficultySel.disabled = false;
    dlgTitle.textContent = '⏰ 时间到！';
    dlgText.textContent = '本局得分：' + score + ' 分';
    overlay.classList.add('show');
  }

  startBtn.addEventListener('click', start);
  againBtn.addEventListener('click', start);
  render();
})();
</script>
</body>
</html>
