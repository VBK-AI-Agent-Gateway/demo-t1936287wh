<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 - 手机适配版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameContainer {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    gap: 8px;
  }
  #hud {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: clamp(14px, 3.5vw, 20px);
    padding: 4px 8px;
  }
  #hud span { font-weight: bold; }
  #score { color: #4ecca3; }
  #canvasWrap {
    position: relative;
    flex: 0 1 auto;
    max-width: 100%;
    max-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    background: #16213e;
    border: 3px solid #4ecca3;
    border-radius: 8px;
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
  }
  #controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 4px;
  }
  .ctrlRow { display: flex; gap: 6px; }
  .btn {
    width: clamp(52px, 16vw, 72px);
    height: clamp(52px, 16vw, 72px);
    border: none;
    border-radius: 12px;
    background: #4ecca3;
    color: #1a1a2e;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.05s;
  }
  .btn:active { transform: scale(0.92); background: #3db891; }
  .btn.placeholder { visibility: hidden; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(26,26,46,0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    color: #fff;
    border-radius: 8px;
    text-align: center;
    padding: 16px;
  }
  #overlay h1 { font-size: clamp(24px, 7vw, 40px); color: #4ecca3; }
  #overlay p { font-size: clamp(14px, 4vw, 18px); line-height: 1.6; }
  #startBtn {
    padding: 14px 36px;
    font-size: clamp(16px, 5vw, 22px);
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: #4ecca3;
    color: #1a1a2e;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">
    <span>得分: <span id="score">0</span></span>
    <span>最高: <span id="best">0</span></span>
  </div>
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h1>贪吃蛇</h1>
      <p>滑动屏幕或按方向键控制<br>吃到食物得分，别撞墙或撞自己！</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="controls">
    <div class="ctrlRow"><button class="btn placeholder">·</button><button class="btn" data-dir="up">▲</button><button class="btn placeholder">·</button></div>
    <div class="ctrlRow"><button class="btn" data-dir="left">◀</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const GRID = 20;
let cell, cols = 24, rows = 24;
let snake, dir, nextDir, food, score, best = 0, gameLoop, speed, running = false;

best = parseInt(localStorage.getItem('snake_best') || '0');
bestEl.textContent = best;

function resize() {
  const wrap = document.getElementById('canvasWrap');
  const maxW = Math.min(window.innerWidth - 16, 600);
  const maxH = window.innerHeight * 0.68;
  cell = Math.floor(Math.min(maxW / cols, maxH / rows));
  if (cell < 8) cell = 8;
  canvas.width = cols * cell;
  canvas.height = rows * cell;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
}
window.addEventListener('resize', resize);
resize();

function init() {
  snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speed = 140;
  scoreEl.textContent = '0';
  placeFood();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (speed > 60) { speed -= 2; clearInterval(gameLoop); gameLoop = setInterval(tick, speed); }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc((food.x+0.5)*cell, (food.y+0.5)*cell, cell*0.4, 0, Math.PI*2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#3db891';
    ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
  });
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;
  nextDir = {x, y};
}

function start() {
  init();
  overlay.style.display = 'none';
  running = true;
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
  draw();
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    bestEl.textContent = best;
  }
  overlay.querySelector('h1').textContent = '游戏结束';
  overlay.querySelector('p').innerHTML = `得分: ${score}<br>最高分: ${best}`;
  startBtn.textContent = '再来一局';
  overlay.style.display = 'flex';
}

startBtn.addEventListener('click', start);

document.querySelectorAll('.btn[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    if (d === 'up') setDir(0, -1);
    else if (d === 'down') setDir(0, 1);
    else if (d === 'left') setDir(-1, 0);
    else if (d === 'right') setDir(1, 0);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setDir(0, -1);
  else if (e.key === 'ArrowDown') setDir(0, 1);
  else if (e.key === 'ArrowLeft') setDir(-1, 0);
  else if (e.key === 'ArrowRight') setDir(1, 0);
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, {passive: true});

draw();
</script>
</body>
</html>
