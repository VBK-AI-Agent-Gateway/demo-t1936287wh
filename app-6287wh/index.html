<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#111; color:#eee; font-family:-apple-system,Segoe UI,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; gap:14px; touch-action:none;
  }
  h1 { font-size:20px; letter-spacing:4px; color:#7CFC00; }
  #hud { display:flex; gap:24px; font-size:16px; }
  #hud b { color:#7CFC00; }
  canvas { background:#1b1b1b; border:2px solid #333; border-radius:6px; }
  #ctrl { display:flex; gap:10px; }
  button {
    background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:8px;
    padding:10px 18px; font-size:15px; cursor:pointer;
  }
  button:active { background:#3a3a3a; }
  #pad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  #pad button { padding:0; font-size:22px; }
  .up{grid-area:1/2} .left{grid-area:2/1} .right{grid-area:2/3} .down{grid-area:3/2}
  #over {
    position:fixed; inset:0; background:rgba(0,0,0,.8); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #over.show { display:flex; }
  #over h2 { font-size:28px; color:#ff5555; }
</style>
</head>
<body>
<h1>贪 吃 蛇</h1>
<div id="hud"><span>得分 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="cv" width="360" height="360"></canvas>
<div id="ctrl">
  <button id="btnStart">开始</button>
  <button id="btnPause">暂停</button>
</div>
<div id="pad">
  <button class="up" data-d="up">↑</button>
  <button class="left" data-d="left">←</button>
  <button class="right" data-d="right">→</button>
  <button class="down" data-d="down">↓</button>
</div>
<div id="over"><h2>游戏结束</h2><p>得分 <span id="finalScore">0</span></p><button id="btnRetry">再来一局</button></div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const N = 20, CELL = cv.width / N;
let snake, dir, nextDir, food, score, best = 0, timer = null, running = false;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; placeFood(); updateHUD();
}
function placeFood() {
  do {
    food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}
function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}
function step() {
  dir = nextDir;
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (head.x<0||head.x>=N||head.y<0||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10; placeFood(); updateHUD();
  } else snake.pop();
  draw();
}
function draw() {
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#ff5555';
  ctx.fillRect(food.x*CELL+3, food.y*CELL+3, CELL-6, CELL-6);
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#aaff77' : '#7CFC00';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
}
function start() {
  if (running) return;
  reset(); draw(); running = true;
  document.getElementById('over').classList.remove('show');
  timer = setInterval(step, 140);
}
function pause() {
  if (!running) return;
  clearInterval(timer); timer = null; running = false;
}
function gameOver() {
  clearInterval(timer); timer = null; running = false;
  best = Math.max(best, score); updateHUD();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('over').classList.add('show');
}
function setDir(d) {
  const map = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
  const nd = map[d];
  if (!nd) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}
document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (k==='ArrowUp'||k==='w') setDir('up');
  else if (k==='ArrowDown'||k==='s') setDir('down');
  else if (k==='ArrowLeft'||k==='a') setDir('left');
  else if (k==='ArrowRight'||k==='d') setDir('right');
  else if (k===' ') { running ? pause() : start(); }
});
document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('click', () => setDir(b.dataset.d));
  b.addEventListener('touchstart', e => { e.preventDefault(); setDir(b.dataset.d); }, {passive:false});
});
document.getElementById('btnStart').onclick = start;
document.getElementById('btnPause').onclick = pause;
document.getElementById('btnRetry').onclick = start;

reset(); draw();
</script>
</body>
</html>
