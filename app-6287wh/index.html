<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no-scalable">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 12px;
  }
  .hud {
    width: min(92vw, 520px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    letter-spacing: .5px;
  }
  .hud .score { color: #4ade80; font-weight: 700; font-size: 18px; }
  .hud .best  { color: #94a3b8; }
  .hud .title { color: #38bdf8; font-weight: 700; }
  canvas {
    background: #111c33;
    border: 2px solid #1e3a5f;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    max-width: 92vw;
    max-height: 70vh;
  }
  .tips { font-size: 13px; color: #64748b; text-align: center; line-height: 1.7; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,23,.82);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 10;
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 34px; color: #38bdf8; letter-spacing: 4px; }
  .overlay h2 { font-size: 26px; color: #f87171; }
  .overlay p { color: #94a3b8; font-size: 15px; }
  .overlay .final { color: #4ade80; font-size: 20px; font-weight: 700; }
  button {
    background: #22c55e; color: #052e16;
    border: none; padding: 12px 34px;
    font-size: 17px; font-weight: 700;
    border-radius: 999px; cursor: pointer;
    transition: transform .1s, background .2s;
    letter-spacing: 2px;
  }
  button:hover { background: #16a34a; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 8px;
    margin-top: 4px;
  }
  .dpad button {
    background: #1e293b; color: #38bdf8;
    font-size: 22px; padding: 0; border-radius: 12px;
    width: 58px; height: 58px; letter-spacing: 0;
  }
  .dpad button:active { background: #334155; }
  .d-up    { grid-column: 2; grid-row: 1; }
  .d-left  { grid-column: 1; grid-row: 2; }
  .d-down  { grid-column: 2; grid-row: 2; }
  .d-right { grid-column: 3; grid-row: 2; }
  @media (min-width: 768px) { .dpad { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="title">🐍 贪吃蛇</span>
    <span class="score">得分 <span id="score">0</span></span>
    <span class="best">最高 <span id="best">0</span></span>
  </div>

  <canvas id="board" width="480" height="480"></canvas>

  <div class="tips">
    方向键 / WASD 移动 · 空格暂停 · 吃到食物加分<br>撞墙或撞到自己即结束
  </div>

  <div class="dpad">
    <button class="d-up"    data-d="up">▲</button>
    <button class="d-left"  data-d="left">◀</button>
    <button class="d-down"  data-d="down">▼</button>
    <button class="d-right" data-d="right">▶</button>
  </div>
</div>

<div class="overlay" id="startScreen">
  <h1>贪吃蛇</h1>
  <p>经典街机玩法 · 支持键盘与触屏</p>
  <button id="startBtn">开始游戏</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h1>已暂停</h1>
  <p>按空格或点击按钮继续</p>
  <button id="resumeBtn">继续</button>
</div>

<div class="overlay hidden" id="overScreen">
  <h2>游戏结束</h2>
  <div class="final">得分 <span id="finalScore">0</span></div>
  <p id="newBest" style="display:none;color:#facc15;">🎉 打破纪录！</p>
  <button id="restartBtn">再来一局</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const COLS = 24, ROWS = 24;
  const CELL = canvas.width / COLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');

  const startScreen = document.getElementById('startScreen');
  const pauseScreen = document.getElementById('pauseScreen');
  const overScreen = document.getElementById('overScreen');

  let snake, dir, nextDir, food, score, best, alive, paused, timer, speed;

  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x:8,y:12},{x:7,y:12},{x:6,y:12}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 140;
    alive = true;
    paused = false;
    scoreEl.textContent = 0;
    placeFood();
    draw();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random()*COLS),
        y: Math.floor(Math.random()*ROWS)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function tick() {
    if (!alive || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 撞自己（不含尾巴，因为尾巴会移动）
    if (snake.some((s,i) => i < snake.length-1 && s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60) { speed -= 3; restartTimer(); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#111c33';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
    }

    // 食物
    const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(fx, fy, CELL*0.36, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(fx - CELL*0.1, fy - CELL*0.1, CELL*0.1, 0, Math.PI*2); ctx.fill();

    // 蛇
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#4ade80' : `hsl(142, 70%, ${55 - t*22}%)`;
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2, 5);
    });

    // 蛇眼睛
    const h = snake[0];
    ctx.fillStyle = '#052e16';
    const ex = h.x*CELL + CELL/2 + dir.x*CELL*0.18;
    const ey = h.y*CELL + CELL/2 + dir.y*CELL*0.18;
    const off = CELL*0.16;
    ctx.beginPath();
    ctx.arc(ex + (dir.y !== 0 ? off : 0), ey + (dir.x !== 0 ? off : 0), 2.2, 0, Math.PI*2);
    ctx.arc(ex - (dir.y !== 0 ? off : 0), ey - (dir.x !== 0 ? off : 0), 2.2, 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    finalScoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
      newBestEl.style.display = 'block';
    } else {
      newBestEl.style.display = 'none';
    }
    overScreen.classList.remove('hidden');
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function start() {
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    reset();
    restartTimer();
  }

  function togglePause() {
    if (!alive) return;
    paused = !paused;
    pauseScreen.classList.toggle('hidden', !paused);
  }

  function setDir(d) {
    const map = {
      up:    {x:0,y:-1},
      down:  {x:0,y:1},
      left:  {x:-1,y:0},
      right: {x:1,y:0}
    };
    const nd = map[d];
    if (!nd) return;
    // 禁止直接掉头
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  }

  // 键盘
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const keys = {
      arrowup:'up', w:'up',
      arrowdown:'down', s:'down',
      arrowleft:'left', a:'left',
      arrowright:'right', d:'right'
    };
    if (keys[k]) { e.preventDefault(); setDir(keys[k]); }
    else if (k === ' ' || k === 'spacebar') { e.preventDefault(); togglePause(); }
    else if (k === 'enter' && !alive) start();
  });

  // 触屏滑动
  let tsX = 0, tsY = 0;
  canvas.addEventListener('touchstart', e => {
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
  }, {passive:true});

  // 虚拟按键
  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('click', () => setDir(b.dataset.d));
    b.addEventListener('touchstart', e => { e.preventDefault(); setDir(b.dataset.d); }, {passive:false});
  });

  document.getElementById('startBtn').onclick = start;
  document.getElementById('restartBtn').onclick = start;
  document.getElementById('resumeBtn').onclick = togglePause;

  // 初始绘制
  reset();
  clearInterval(timer);
})();
</script>
</body>
</html>
