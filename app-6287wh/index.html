<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no=no>
<title>卡通五子棋 🎨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;
    background: linear-gradient(160deg,#89f7fe 0%,#66a6ff 45%,#a18cd1 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; user-select:none;
  }
  /* 飘落的装饰 */
  .bubble { position:fixed; border-radius:50%; background:rgba(255,255,255,.35); animation:float linear infinite; pointer-events:none; }
  @keyframes float { from{transform:translateY(110vh) scale(.6);opacity:0} 10%{opacity:.8} to{transform:translateY(-20vh) scale(1.1);opacity:0} }

  .card {
    width:min(96vw, 720px);
    background:rgba(255,255,255,.92);
    border:6px solid #fff;
    border-radius:32px;
    box-shadow:0 20px 45px rgba(30,40,90,.35);
    padding:16px 16px 20px;
    position:relative; z-index:2;
  }

  h1 {
    text-align:center; font-size:26px; letter-spacing:2px;
    background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .sub { text-align:center; font-size:13px; color:#7a7fa8; margin-bottom:10px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .player {
    flex:1; min-width:130px;
    background:#fff; border:4px solid #eee; border-radius:22px;
    padding:8px 12px; display:flex; align-items:center; gap:10px;
    transition:.25s;
  }
  .player.active { border-color:#ffd93d; box-shadow:0 0 0 4px rgba(255,217,61,.35); transform:translateY(-3px); }
  .stone-icon { width:34px; height:34px; border-radius:50%; flex:none; }
  .black-i { background:radial-gradient(circle at 32% 30%,#6b6b6b,#111); box-shadow:inset -3px -3px 6px #000, 2px 3px 5px rgba(0,0,0,.4); }
  .white-i { background:radial-gradient(circle at 32% 30%,#fff,#d9d9d9); box-shadow:inset -3px -3px 6px #bbb, 2px 3px 5px rgba(0,0,0,.25); }
  .p-name { font-size:15px; font-weight:bold; color:#333; }
  .p-info { font-size:12px; color:#888; }
  .score { font-size:22px; font-weight:bold; }

  .turn-badge {
    text-align:center; margin:12px 0 8px;
    font-size:17px; font-weight:bold; color:#5a5f9e;
    background:#f3f6ff; border-radius:999px; padding:7px 14px; display:inline-block; width:100%;
  }
  .turn-badge .dot { display:inline-block; width:16px; height:16px; border-radius:50%; vertical-align:-3px; margin-right:6px; }

  .board-wrap { position:relative; width:100%; aspect-ratio:1/1; margin:0 auto; }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; border-radius:18px; touch-action:manipulation; }

  .btns { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:15px; font-weight:bold; color:#fff;
    border:none; border-radius:999px; padding:10px 20px; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18); transition:.12s;
  }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .b-restart { background:linear-gradient(180deg,#ff9f43,#ee5253); }
  .b-undo    { background:linear-gradient(180deg,#54a0ff,#2e86de); }
  .b-mode    { background:linear-gradient(180deg,#5f27cd,#341f97); }
  .b-sound   { background:linear-gradient(180deg,#1dd1a1,#10ac84); }

  /* 弹窗 */
  .overlay {
    position:fixed; inset:0; background:rgba(20,20,50,.55);
    display:none; align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(3px);
  }
  .overlay.show { display:flex; animation:fadeIn .25s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background:#fff; border-radius:28px; padding:26px 30px; text-align:center;
    width:min(90vw,340px); box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
  .modal .emoji { font-size:56px; }
  .modal h2 { font-size:24px; margin:8px 0 4px; color:#333; }
  .modal p { font-size:14px; color:#888; margin-bottom:16px; }
  .modal .btns button { font-size:14px; padding:9px 16px; }

  /* 胜利彩带 */
  .confetti { position:fixed; width:10px; height:16px; top:-20px; z-index:60; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.9; } }
</style>
</head>
<body>

<div class="card">
  <h1>🎨 卡通五子棋</h1>
  <div class="sub">连成五子即可获胜 · 支持双人 / 人机对战</div>

  <div class="top">
    <div class="player active" id="p1">
      <div class="stone-icon black-i"></div>
      <div>
        <div class="p-name" id="p1name">黑棋 👦</div>
        <div class="p-info">先手</div>
      </div>
      <div class="score" id="s1" style="margin-left:auto">0</div>
    </div>
    <div class="player" id="p2">
      <div class="stone-icon white-i"></div>
      <div>
        <div class="p-name" id="p2name">白棋 🤖</div>
        <div class="p-info" id="p2info">电脑</div>
      </div>
      <div class="score" id="s2" style="margin-left:auto">0</div>
    </div>
  </div>

  <div class="turn-badge" id="turn"><span class="dot" style="background:#111"></span>轮到 黑棋 落子</div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <div class="btns">
    <button class="b-restart" onclick="restart()">🔄 重新开始</button>
    <button class="b-undo" onclick="undo()">↩️ 悔棋</button>
    <button class="b-mode" onclick="toggleMode()" id="modeBtn">🤖 人机对战</button>
    <button class="b-sound" onclick="toggleSound()" id="soundBtn">🔊 音效开</button>
  </div>
</div>

<!-- 胜利弹窗 -->
<div class="overlay" id="over">
  <div class="modal">
    <div class="emoji" id="winEmoji">🎉</div>
    <h2 id="winTitle">黑棋获胜！</h2>
    <p id="winDesc">太厉害了，再来一局？</p>
    <div class="btns">
      <button class="b-restart" onclick="restart();hideOver()">🔁 再来一局</button>
      <button class="b-mode" onclick="hideOver()">👌 好的</button>
    </div>
  </div>
</div>

<script>
/* ---------- 音效 (WebAudio 合成) ---------- */
let soundOn = true, actx = null;
function beep(freq, dur=0.09, type='sine', vol=0.25){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function sPlace(){ beep(520,0.08,'triangle',0.3); setTimeout(()=>beep(700,0.06,'sine',0.2),40); }
function sWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.2),i*130)); }

/* ---------- 棋盘数据 ---------- */
const N = 15;
let grid, history, current, mode='pvp', scores=[0,0], over=false, winLine=null;
let hover = null;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let cell, pad, size;

function initVars(){
  const rect = canvas.getBoundingClientRect();
  size = Math.floor(Math.min(rect.width, rect.height));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size*dpr; canvas.height = size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pad = size*0.055;
  cell = (size - pad*2) / (N-1);
}
function reset(){
  grid = Array.from({length:N},()=>Array(N).fill(0));
  history = []; current = 1; over=false; winLine=null; hover=null;
  updateUI(); draw();
}
function restart(){ reset(); }

/* ---------- 绘制 ---------- */
function draw(){
  ctx.clearRect(0,0,size,size);
  // 木板
  const g = ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#ffd89b'); g.addColorStop(1,'#f7b733');
  ctx.fillStyle = g;
  roundRect(0,0,size,size,18); ctx.fill();
  // 木纹
  ctx.strokeStyle='rgba(180,120,40,.15)'; ctx.lineWidth=2;
  for(let i=0;i<7;i++){
    ctx.beginPath();
    const y = size*(i+1)/8;
    ctx.moveTo(0,y); ctx.bezierCurveTo(size*.3,y-8,size*.7,y+8,size,y);
    ctx.stroke();
  }
  // 网格
  ctx.strokeStyle='#8a5a1b'; ctx.lineWidth=1.4; ctx.globalAlpha=.75;
  for(let i=0;i<N;i++){
    ctx.beginPath(); ctx.moveTo(pad, pad+i*cell); ctx.lineTo(size-pad, pad+i*cell); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad+i*cell, pad); ctx.lineTo(pad+i*cell, size-pad); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 星位
  ctx.fillStyle='#8a5a1b';
  [[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(pad+x*cell, pad+y*cell, 4, 0, 7); ctx.fill();
  });
  // 悬停提示
  if(hover && !over && grid[hover.y][hover.x]===0){
    ctx.globalAlpha=.35;
    drawStone(hover.x,hover.y,current,1);
    ctx.globalAlpha=1;
  }
  // 棋子
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if(grid[y][x]) drawStone(x,y,grid[y][x],1);
  // 胜利连线
  if(winLine){
    ctx.strokeStyle='#ff3838'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.globalAlpha=.85;
    ctx.beginPath();
    ctx.moveTo(pad+winLine[0].x*cell, pad+winLine[0].y*cell);
    ctx.lineTo(pad+winLine[4].x*cell, pad+winLine[4].y*cell);
    ctx.stroke(); ctx.globalAlpha=1;
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawStone(x,y,p,alpha){
  const cx = pad + x*cell, cy = pad + y*cell, r = cell*0.44;
  ctx.save(); ctx.globalAlpha=alpha;
  // 阴影
  ctx.beginPath(); ctx.arc(cx+2, cy+3, r, 0, 7);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  // 本体
  const g = ctx.createRadialGradient(cx-r*.35, cy-r*.4, r*.15, cx, cy, r);
  if(p===1){ g.addColorStop(0,'#7a7a7a'); g.addColorStop(.5,'#2b2b2b'); g.addColorStop(1,'#000'); }
  else { g.addColorStop(0,'#ffffff'); g.addColorStop(.6,'#f2f2f2'); g.addColorStop(1,'#c9c9c9'); }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle = p===1?'#000':'#aaa'; ctx.lineWidth=1; ctx.stroke();
  // 高光
  ctx.beginPath(); ctx.arc(cx-r*.3, cy-r*.35, r*.28, 0, 7);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  // 卡通眼睛 😜
  const ex = r*.32, ey = -r*.05, er = r*.16;
  ctx.fillStyle = p===1?'#fff':'#333';
  ctx.beginPath(); ctx.arc(cx-ex, cy+ey, er,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+ex, cy+ey, er,0,7); ctx.fill();
  ctx.fillStyle = p===1?'#111':'#333';
  ctx.beginPath(); ctx.arc(cx-ex, cy+ey, er*.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+ex, cy+ey, er*.5,0,7); ctx.fill();
  // 微笑
  ctx.beginPath(); ctx.arc(cx, cy+r*.15, r*.3, 0.15*Math.PI, 0.85*Math.PI);
  ctx.strokeStyle = p===1?'rgba(255,255,255,.7)':'rgba(60,60,60,.7)';
  ctx.lineWidth=1.6; ctx.stroke();
  ctx.restore();
}

/* ---------- 交互 ---------- */
function pos(e){
  const rect = canvas.getBoundingClientRect();
  const px = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
  const py = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
  const x = Math.round((px - pad)/cell), y = Math.round((py
