<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no-scale">
<title>卡通五子棋 🎨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background: linear-gradient(160deg,#aee7ff 0%,#fdf3b8 55%,#ffd6e7 100%);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:14px; overflow-x:hidden;
  }
  .title {
    font-size: clamp(26px,6vw,44px);
    font-weight:900; letter-spacing:4px;
    background: linear-gradient(90deg,#ff6b9d,#ffa940,#51cf66,#339af0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 4px 0 rgba(255,255,255,.6);
    margin-bottom:6px;
  }
  .subtitle { color:#7a6f9c; font-size:13px; margin-bottom:12px; font-weight:600; }
  .panel {
    background:rgba(255,255,255,.75);
    backdrop-filter: blur(6px);
    border:3px solid #fff;
    border-radius:24px;
    box-shadow: 0 10px 30px rgba(120,100,180,.25);
    padding:14px 18px;
    display:flex; align-items:center; gap:14px;
    flex-wrap:wrap; justify-content:center;
    max-width:640px; width:100%;
    margin-bottom:14px;
  }
  .turn {
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:17px; color:#4a4458;
  }
  .turn .stone {
    width:26px; height:26px; border-radius:50%;
    box-shadow: inset -3px -4px 6px rgba(0,0,0,.35), 0 3px 5px rgba(0,0,0,.3);
    animation: bob 1.4s ease-in-out infinite;
  }
  .stone.black { background: radial-gradient(circle at 32% 28%,#6b6b7a,#14141c 60%); }
  .stone.white { background: radial-gradient(circle at 32% 28%,#ffffff,#d9d9e6 60%); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .score { display:flex; gap:10px; font-weight:800; font-size:14px; }
  .score span {
    background:#fff; border-radius:14px; padding:5px 12px;
    box-shadow:0 3px 0 rgba(0,0,0,.08);
  }
  .score .b { color:#3b3b52; }
  .score .w { color:#c07a1a; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button {
    font-family:inherit; font-weight:800; font-size:14px;
    border:none; border-radius:16px; padding:9px 16px;
    cursor:pointer; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
    transition:transform .1s;
  }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .b-new   { background:linear-gradient(180deg,#ff8fab,#ff5d8f); }
  .b-undo  { background:linear-gradient(180deg,#74c0fc,#339af0); }
  .b-mode  { background:linear-gradient(180deg,#b197fc,#7950f2); }
  .b-hint  { background:linear-gradient(180deg,#ffe066,#fab005); color:#6b4c00; }
  .board-wrap {
    position:relative;
    padding:14px;
    background: linear-gradient(145deg,#ffd8a8,#ffb26b);
    border-radius:22px;
    border:5px solid #fff;
    box-shadow: 0 14px 30px rgba(150,100,60,.35), inset 0 0 20px rgba(255,255,255,.4);
  }
  canvas { display:block; border-radius:10px; touch-action:manipulation; }
  .hint-bar {
    margin-top:14px; min-height:34px;
    background:rgba(255,255,255,.7);
    border-radius:18px; padding:7px 18px;
    font-weight:700; color:#5b5470; font-size:14px;
    box-shadow:0 4px 12px rgba(120,100,180,.15);
    text-align:center;
  }
  .overlay {
    position:fixed; inset:0; background:rgba(40,30,60,.55);
    display:none; align-items:center; justify-content:center; z-index:50;
    backdrop-filter:blur(3px);
  }
  .overlay.show { display:flex; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background:linear-gradient(180deg,#fff,#fff6fb);
    border-radius:28px; padding:34px 40px; text-align:center;
    border:5px solid #ffd43b;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:pop .4s cubic-bezier(.2,1.6,.5,1);
    max-width:88vw;
  }
  @keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
  .modal .emoji { font-size:64px; animation:spin 2s linear infinite; display:inline-block; }
  @keyframes spin { from{transform:rotate(-12deg)} 50%{transform:rotate(12deg)} to{transform:rotate(-12deg)} }
  .modal h2 { font-size:30px; margin:8px 0 6px; color:#4a4458; }
  .modal p { color:#8a82a8; font-weight:700; margin-bottom:20px; }
  .confetti { position:fixed; top:-20px; font-size:22px; z-index:60; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.9; } }
  @media (max-width:520px){
    .panel{ gap:8px; padding:10px; }
    .turn{font-size:15px}
  }
</style>
</head>
<body>

<div class="title">卡通五子棋</div>
<div class="subtitle">✨ 萌趣木纹棋盘 · 五子连珠即胜利 ✨</div>

<div class="panel">
  <div class="turn"><div class="stone black" id="turnStone"></div><span id="turnText">黑棋落子</span></div>
  <div class="score">
    <span class="b">⚫ <b id="scoreB">0</b></span>
    <span class="w">⚪ <b id="scoreW">0</b></span>
  </div>
  <div class="btns">
    <button class="b-mode" id="btnMode">模式：双人</button>
    <button class="b-hint" id="btnHint">💡 提示</button>
    <button class="b-undo" id="btnUndo">↩ 悔棋</button>
    <button class="b-new"  id="btnNew">🔄 新局</button>
  </div>
</div>

<div class="board-wrap">
  <canvas id="board"></canvas>
</div>

<div class="hint-bar" id="hintBar">👋 欢迎！点击棋盘交叉点落子，先连成五子者获胜～</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji" id="winEmoji">🎉</div>
    <h2 id="winTitle">黑棋获胜！</h2>
    <p id="winDesc">太棒啦，五子连珠！</p>
    <button class="b-new" id="btnAgain">再来一局 🎮</button>
  </div>
</div>

<script>
(() => {
  const N = 15;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  let cell, pad, size, dpr;
  let grid = [];            // 0 空 1 黑 2 白
  let history = [];
  let current = 1;          // 1 黑 2 白
  let over = false;
  let mode = 'pvp';         // pvp | pve
  let winLine = null;
  let hoverPos = null;
  let hintPos = null;
  let scores = {1:0, 2:0};

  const hintBar = document.getElementById('hintBar');
  const turnText = document.getElementById('turnText');
  const turnStone = document.getElementById('turnStone');
  const overlay = document.getElementById('overlay');

  function initGrid(){
    grid = Array.from({length:N}, () => Array(N).fill(0));
    history = []; winLine = null; over = false; hintPos = null;
  }

  function resize(){
    dpr = window.devicePixelRatio || 1;
    const maxW = Math.min(window.innerWidth - 60, 560);
    size = Math.max(280, maxW);
    pad = Math.round(size * 0.055);
    cell = (size - pad*2) / (N - 1);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  const cx = i => pad + i*cell;
  const cy = j => pad + j*cell;

  /* ---------------- 绘制 ---------------- */
  function draw(){
    ctx.clearRect(0,0,size,size);

    // 木纹底
    const g = ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#ffe9c9'); g.addColorStop(.5,'#ffd9a0'); g.addColorStop(1,'#ffc987');
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    ctx.globalAlpha = .12;
    for(let i=0;i<12;i++){
      ctx.beginPath();
      ctx.strokeStyle = '#b5651d';
      ctx.lineWidth = 2 + (i%3);
      const y = (size/12)*i + 8;
      ctx.moveTo(0,y);
      ctx.bezierCurveTo(size*.3, y+8, size*.6, y-8, size, y+5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 网格
    ctx.strokeStyle = '#8a5a2b';
    ctx.lineWidth = 1.4;
    for(let i=0;i<N;i++){
      ctx.beginPath(); ctx.moveTo(cx(0),cy(i)); ctx.lineTo(cx(N-1),cy(i)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx(i),cy(0)); ctx.lineTo(cx(i),cy(N-1)); ctx.stroke();
    }
    // 星位
    ctx.fillStyle = '#8a5a2b';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([i,j])=>{
      ctx.beginPath(); ctx.arc(cx(i),cy(j), cell*0.13, 0, Math.PI*2); ctx.fill();
    });

    // 落子提示（悬停）
    if(hoverPos && !over && grid[hoverPos.i][hoverPos.j]===0){
      ctx.globalAlpha = .35;
      drawStone(hoverPos.i, hoverPos.j, current, false);
      ctx.globalAlpha = 1;
    }
    // AI 提示点
    if(hintPos){
      ctx.strokeStyle = '#ff5d8f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx(hintPos.i), cy(hintPos.j), cell*0.55, 0, Math.PI*2); ctx.stroke();
    }

    // 棋子
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      if(grid[i][j]) drawStone(i,j,grid[i][j], true);
    }

    // 胜利连线
    if(winLine){
      const [a,b] = [winLine[0], winLine[winLine.length-1]];
      ctx.strokeStyle = 'rgba(255,65,108,.9)';
      ctx.lineWidth = cell*0.32; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx(a.i),cy(a.j)); ctx.lineTo(cx(b.i),cy(b.j)); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = cell*0.1;
      ctx.beginPath(); ctx.moveTo(cx(a.i),cy(a.j)); ctx.lineTo(cx(b.i),cy(b.j)); ctx.stroke();
    }
  }

  function drawStone(i,j,p,shadow){
    const x = cx(i), y = cy(j), r = cell*0.42;
    ctx.save();
    if(shadow){ ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=r*.6; ctx.shadowOffsetY=r*.28; }
    const g = ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
    if(p===1){ g.addColorStop(0,'#7a7a90'); g.addColorStop(.45,'#2c2c3c'); g.addColorStop(1,'#0b0b12'); }
    else     { g.addColorStop(0,'#ffffff'); g.addColorStop(.6,'#f0f0f6'); g.addColorStop(1,'#c9c9d6'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(x-r*.32,y-r*.38,r*.22,r*.14,-.5,0,Math.PI*2); ctx.fill();
  }

  /* ---------------- 交互 ---------------- */
  function posFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    const i = Math.round((x-pad)/cell), j = Math.round((y-pad)/cell);
    if(i<0||j<0||i>=N||j>=N) return null;
    if(Math.abs(x-cx(i))>cell*0.5 || Math.abs(y-cy(j))>cell*0.5) return null;
    return {i,j};
  }

  canvas.addEventListener('mousemove', e=>{
    const p = posFromEvent(e);
    if((p&&p.i)!==(hoverPos&&hoverPos.i) || (p&&p.j)!==(hoverPos&&hoverPos.j)){
      hoverPos = p; draw();
    }
  });
  canvas.addEventListener('mouseleave', ()=>{ hoverPos=null; draw(); });
  canvas.addEventListener('click', e=>{ const p=posFromEvent(e); if(p) place(p.i,p.j); });
  canvas.addEventListener('touchstart', e=>{
    const p = posFromEvent(e);
    if(p){ e.preventDefault(); place(p.i,p.j); }
  }, {passive:false});

  function place(i,j,byAI=false){
    if(over || grid[i][j]) return;
    if(!byAI && mode==='pve' && current===2) return;
    grid[i][j] = current;
    history.push({i,j,p:current});
    hintPos = null;

    const line = checkWin(i,j,current);
    if(line){
      winLine = line; over = true;
      scores[current]++;
      updateScore();
      draw();
      setTimeout(()=>showWin(current), 450);
      return;
    }
    if(history.length === N*N){
      over = true; draw();
      hintBar.textContent = '🤝 棋盘下满，平局！';
      return;
    }
</script>
</body>
</html>
