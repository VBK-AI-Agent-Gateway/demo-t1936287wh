<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>经典坦克跳坑大战</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#1a1a12; overflow:hidden;
    font-family:"Courier New", monospace; color:#d8d8a0; -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#2b2b1e; image-rendering:pixelated; box-shadow:0 0 40px #000; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,10,5,.85); text-align:center; z-index:10; }
  .hidden { display:none !important; }
  h1 { font-size:44px; color:#f4d03f; text-shadow:3px 3px 0 #7a5c00; letter-spacing:4px; margin-bottom:14px; }
  h2 { font-size:30px; color:#e74c3c; margin-bottom:12px; }
  p { font-size:16px; line-height:1.9; color:#cfd8a5; }
  .key { display:inline-block; background:#333; border:1px solid #777; border-radius:4px;
    padding:1px 8px; color:#fff; margin:0 2px; }
  button { margin-top:22px; font-family:inherit; font-size:22px; padding:12px 44px; cursor:pointer;
    background:#f4d03f; color:#222; border:none; border-radius:6px; box-shadow:0 5px 0 #9c7a00; letter-spacing:4px; }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 #9c7a00; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; justify-content:space-between;
    font-size:18px; text-shadow:1px 1px 0 #000; z-index:5; pointer-events:none; }
  #hud div { background:rgba(0,0,0,.35); padding:4px 10px; border-radius:4px; }
  #mobile { position:absolute; bottom:12px; left:0; right:0; display:none; justify-content:space-between;
    padding:0 14px; z-index:6; }
  #mobile .pad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,54px); gap:6px; }
  #mobile .btn { background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); border-radius:10px;
    color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; }
  #mobile .fire { width:78px; height:78px; border-radius:50%; background:rgba(231,76,60,.45);
    border-color:#e74c3c; font-size:16px; align-self:center; }
  @media (max-width:900px){ h1{font-size:30px;} h2{font-size:24px;} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud" class="hidden">
    <div id="hudScore">得分 0</div>
    <div id="hudLevel">关卡 1</div>
    <div id="hudLife">生命 ❤❤❤</div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>坦克跳坑大战</h1>
    <p>驾驶坦克穿越布满坑洼与河道的战场<br>
      <span class="key">←</span><span class="key">→</span> / <span class="key">A</span><span class="key">D</span> 移动 &nbsp;
      <span class="key">↑</span> / <span class="key">W</span> 跳跃 &nbsp;
      <span class="key">空格</span> 开炮<br>
      击毁敌军 +100 分 · 过坑成功 +50 分 · 补给箱 +200 分<br>
      坑里掉下去会损失一条生命，3 条命用完结束！</p>
    <button id="btnStart">开始游戏</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h2>游戏结束</h2>
    <p id="overText"></p>
    <button id="btnRetry">再来一局</button>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <h2 style="color:#f4d03f">暂停中</h2>
    <p>按 P 或点击下方按钮继续</p>
    <button id="btnResume">继续</button>
  </div>

  <div id="mobile" class="hidden">
    <div class="pad">
      <span></span><div class="btn" data-k="up">▲</div><span></span>
      <div class="btn" data-k="left">◀</div><div class="btn" data-k="down">▼</div><div class="btn" data-k="right">▶</div>
    </div>
    <div class="btn fire" data-k="fire">开炮</div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var GROUND_Y = H - 90;
var GRAV = 0.65, JUMP_V = -13.5;

var el = function(id){ return document.getElementById(id); };
var startScreen = el('startScreen'), overScreen = el('overScreen'), pauseScreen = el('pauseScreen');
var hud = el('hud'), hudScore = el('hudScore'), hudLevel = el('hudLevel'), hudLife = el('hudLife');
var overText = el('overText'), mobileBar = el('mobile');

var state = 'menu';
var keys = {};
var player, bullets, enemies, pits, supplies, camX, score, lives, level;
var nextPitX, shakeT, particles, banners;
var best = 0;
try { best = parseInt(localStorage.getItem('tankPitBest')||'0',10)||0; } catch(e){}

function isTouch(){ return ('ontouchstart' in window) || navigator.maxTouchPoints>0; }

function makeLevel(){
  pits = []; enemies = []; supplies = []; bullets = []; particles = []; banners = [];
  camX = 0; score = 0; lives = 3; level = 1;
  nextPitX = 600; shakeT = 0;
  player = { x:80, y:GROUND_Y, vx:0, vy:0, w:52, h:34, onGround:true, face:1,
             hp:3, inv:0, cool:0, trackT:0, dead:false };
  genTerrain(6000);
}

function pitWidthFor(level){
  var maxGap = 110 + level*14;
  if (maxGap > 210) maxGap = 210;
  return 80 + Math.random()*(maxGap-80);
}

function genTerrain(untilX){
  while (nextPitX < camX + untilX){
    var w = pitWidthFor(level);
    var kind = Math.random() < 0.45 ? 'water' : 'pit';
    pits.push({ x:nextPitX, w:w, kind:kind });
    if (Math.random() < 0.3){
      supplies.push({ x: nextPitX + w + 40 + Math.random()*120,
                      y: GROUND_Y - 70 - Math.random()*40, got:false, bob:Math.random()*6 });
    }
    if (Math.random() < 0.6){
      enemies.push({ x: nextPitX + w + 160 + Math.random()*260, y:GROUND_Y,
                     w:50, h:32, dir:-1, hp:1, cool:1.2+Math.random()*2, alive:true, trackT:0 });
    }
    nextPitX += w + 260 + Math.random()*240 + level*10;
  }
}

var KMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
             ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
             Space:'fire', KeyJ:'fire' };
addEventListener('keydown', function(e){
  if (KMAP[e.code]) { keys[KMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state==='play') pause(); else if (state==='pause') resume();
  }
  if (e.code === 'Enter'){
    if (state==='menu' || state==='over') startGame();
  }
});
addEventListener('keyup', function(e){ if (KMAP[e.code]) keys[KMAP[e.code]] = false; });

Array.prototype.forEach.call(document.querySelectorAll('#mobile .btn'), function(b){
  var k = b.getAttribute('data-k');
  var on = function(ev){ ev.preventDefault(); keys[k]=true; };
  var off = function(ev){ ev.preventDefault(); keys[k]=false; };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', off);
});

function startGame(){
  makeLevel();
  state = 'play';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  if (isTouch()) mobileBar.classList.remove('hidden');
  updateHUD();
}
function pause(){ if(state!=='play')return; state='pause'; pauseScreen.classList.remove('hidden'); }
function resume(){ if(state!=='pause')return; state='play'; pauseScreen.classList.add('hidden'); }
function gameOver(){
  state = 'over';
  if (score > best){ best = score; try{ localStorage.setItem('tankPitBest', String(best)); }catch(e){} }
  overText.innerHTML = '最终得分：<b style="color:#f4d03f;font-size:26px">'+score+'</b><br>历史最高：'+best+'<br>到达关卡 '+level;
  overScreen.classList.remove('hidden');
  hud.classList.add('hidden');
  mobileBar.classList.add('hidden');
}
function updateHUD(){
  hudScore.textContent = '得分 ' + score;
  hudLevel.textContent = '关卡 ' + level;
  hudLife.textContent = '生命 ' + '❤'.repeat(Math.max(0,lives));
}
el('btnStart').onclick = startGame;
el('btnRetry').onclick = startGame;
el('btnResume').onclick = resume;

function addParticles(x,y,color,n){
  for (var i=0;i<n;i++){
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.7)*6,
                     life:.6+Math.random()*.5, color:color });
  }
}
function banner(text){ banners.push({ text:text, life:1.2, y:H/2-40 }); }

function update(dt){
  if (state !== 'play') return;
  var p = player;

  level = 1 + Math.floor(score / 800);

  var accel = p.onGround ? 0.9 : 0.35;
  var maxV = 5 + Math.min(level,5)*0.15;
  if (keys.left){ p.vx -= accel; p.face = -1; }
  if (keys.right){ p.vx += accel; p.face = 1; }
  if (!keys.left && !keys.right) p.vx *= p.onGround ? 0.82 : 0.985;
  if (p.vx > maxV) p.vx = maxV;
  if (p.vx < -maxV) p.vx = -maxV;

  if (keys.up && p.onGround){ p.vy = JUMP_V; p.onGround = false; addParticles(p.x, p.y, '#b8b8a0', 6); }

  p.cool -= dt;
  if (keys.fire && p.cool <= 0){
    p.cool = 0.35;
    bullets.push({ x: p.x + p.face*34, y: p.y - 24, vx: p.face*11, from:'p', life:2 });
    addParticles(p.x + p.face*40, p.y - 24, '#ffd34d', 5);
    shakeT = 0.08;
  }

  p.vy += GRAV;
  p.x += p.vx;
  p.y += p.vy;

  var onSolid = function(px){
    for (var i=0;i<pits.length;i++){
      if (px > pits[i].x && px < pits[i].x + pits[i].w) return false;
    }
    return true;
  };
  if (p.y >= GROUND_Y && onSolid(p.x)){
    if (!p.onGround && p.vy > 6) addParticles(p.x, GROUND_Y, '#9a9a7a', 8);
    p.y = GROUND_Y; p.vy = 0; p.onGround = true;
  } else if (p.y < GROUND_Y || !onSolid(p.x)){
    p.onGround = false;
  }

  if (p.y > H + 40){
    lives--; shakeT = 0.3;
    if (lives <= 0){ updateHUD(); gameOver(); return; }
    banner('掉进坑里！ -1 命');
    var safeX = camX + 400;
    for (var i=0;i<pits.length;i++){
      if (pits[i].x > safeX && pits[i].x - 100 > p.x){ safeX = pits[i].x - 100; break; }
    }
    p.x = safeX; p.y = GROUND_Y - 120; p.vx = 0; p.vy = 0; p.inv = 2;
    updateHUD();
  }
  if (p.x < camX + 20){ p.x = camX + 20; p.vx = 0; }
  if (p.inv > 0) p.inv -= dt;

  for (var i=0;i<pits.length;i++){
    var pit = pits[i];
    if (!pit.done && p.x > pit.x + pit.w && p.y < H+40){
      pit.done = true; score += 50; banner('过坑 +50');
    }
  }

  var target = p.x - W*0.35;
  if (target > camX) camX += (target - camX) * 0.12;
  if (camX < 0) camX = 0;

  genTerrain(5000);
  pits = pits.filter(function(q){ return q.x + q.w > camX - 600; });
  enemies = enemies.filter(function(q){ return q.alive && q.x > camX - 400; });
  supplies = supplies.filter(function(q){ return !q.got && q.x > camX - 400; });

  for (var i=0;i<supplies.length;i++){
    var s = supplies[i];
    if (Math.abs(p.x - s.x) < 40 && Math.abs((p.y - 20) - s.y) < 44){
      s.got = true; score += 200; banner('补给 +200');
      addParticles(s.x, s.y, '#5ad85a', 14);
      updateHUD();
    }
  }

  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if (!e.alive) continue;
    if (e.x < camX - 100 || e.x > camX + W + 300) continue;
    e.trackT += dt;
    var dx = p.x - e.x;
    e.dir = dx >= 0 ? 1 : -1;
    e.x += e.dir * 1.1;
    var over = false;
    for (var j=0;j<pits.length;j++){
      if (e.x > pits[j].x - 6 && e.x < pits[j].x + pits[j].w + 6){ over = true; break; }
    }
    if (over){ e.x -= e.dir * 2.4; }
    e.cool -= dt;
    if (e.cool <= 0 && Math.abs(dx) < 520){
      e.cool = 1.6 + Math.random()*1.6;
      bullets.push({ x:e.x + e.dir*30, y:e.y - 22, vx:e.dir*7.5, from:'e', life:2.4 });
    }
    if (Math.abs(dx) < 44 && p.inv <= 0 && p.y > GROUND_Y - 60){
      p.inv = 1.5; lives--; shakeT = 0.3;
      addParticles(p.x, p.y - 20, '#e74c3c', 12);
      updateHUD();
      if (lives <= 0){ gameOver(); return; }
      banner('被撞！ -1 命');
    }
  }

  for (var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.vx; b.life -= dt;
    var dead = b.life <= 0 || b.x < camX - 60 || b.x > camX + W + 60;
    if (!dead && b.from === 'p'){
      for (var j=0;j<enemies.length;j++){
        var e2 = enemies[j];
        if (e2.alive && Math.abs(b.x - e2.x) < 28 && b.y > e2.y - 46){
          e2.alive = false; dead = true; score += 100;
          addParticles(e2.x, e2.y - 18, '#ff8c42', 16);
          shakeT = 0.12; banner('击毁 +100'); updateHUD(); break;
        }
      }
    }
    if (dead) bullets.splice(i,1);
  }

  for (var i=particles.length-1;i>=0;i--){
    var q = particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += 0.25; q.life -= dt;
    if (q.life <= 0) particles.splice(i,1);
  }
  for (var i=banners.length-1;i>=0;i--){
    banners[i].life -= dt;
    if (banners[i].life <= 0) banners.splice(i,1);
  }
  if (shakeT > 0) shakeT -= dt;

  updateHUD();
}

function drawTank(x, y, face, color, trackT){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(face, 1);
  ctx.fillStyle = '#222';
  ctx.fillRect(-26, -14, 52, 14);
  ctx.fillStyle = '#555';
  for (var i=0;i<6;i++){
    var ox = ((trackT*40) % 9);
    ctx.fillRect(-26 + i*9 + ox, -12, 5, 10);
  }
  ctx.fillStyle = color;
  ctx.fillRect(-24, -26, 48, 14);
  ctx.fillStyle = '#1f1f1f';
  ctx.fillRect(-12, -34, 24, 10);
  ctx.fillStyle = '#111';
  ctx.fillRect(8, -32, 30, 6);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(-24, -26, 48, 3);
  ctx.restore();
}

function drawBG(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3a4a5a'); g.addColorStop(1,'#777a55');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#4a5540';
  for (var i=0;i<6;i++){
    var mx = ((i*380 - camX*0.3) % (W+400)) - 200;
    ctx.beginPath();
    ctx.moveTo(mx-200, GROUND_Y);
    ctx.lineTo(mx, GROUND_Y-140);
    ctx.lineTo(mx+200, GROUND_Y);
    ctx.fill();
  }
}

function drawGround(){
  var segs = [];
  var start = camX - 40, end = camX + W + 40;
  var x = start;
  var pitsSorted = pits.slice().sort(function(a,b){return a.x-b.x;});
  for (var i=0;i<pitsSorted.length;i++){
    var pit = pitsSorted[i];
    if (pit.x + pit.w <= start || pit.x >= end) continue;
    if (pit.x > x){ segs.push([x, pit.x]); }
    x = Math.max(x, pit.x + pit.w);
  }
  if (x < end) segs.push([x, end]);

  for (var i=0;i<segs.length;i++){
    var s0 = segs[i][0]-camX, s1 = segs[i][1]-camX;
    ctx.fillStyle = '#6b5f3e';
    ctx.fillRect(s0, GROUND_Y, s1-s0, H-GROUND_Y);
    ctx.fillStyle = '#7fa04a';
    ctx.fillRect(s0, GROUND_Y, s1-s0, 8);
    ctx.fillStyle = '#5f7f38';
    for (var gx=Math.floor(s0/24)*24; gx<s1; gx+=24){
      ctx.fillRect(gx+6, GROUND_Y+2, 4, 4);
    }
  }
  for (var i=0;i<pits.length;i++){
    var pit = pits[i];
    if (pit.x + pit.w < camX-40 || pit.x > camX+W+40) continue;
    var px = pit.x - camX;
    ctx.fillStyle = '#141414';
    ctx.fillRect(px, GROUND_Y, pit.w, H-GROUND_Y);
    if (pit.kind === 'water'){
      ctx.fillStyle = 'rgba(40,110,200,.85)';
      ctx.fillRect(px, GROUND_Y+34, pit.w, H-GROUND_Y-34);
      ctx.fillStyle = 'rgba(120,180,255,.6)';
      ctx.fillRect(px, GROUND_Y+34, pit.w, 4);
    }
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(px, GROUND_Y, 4, H-GROUND_Y);
    ctx.fillRect(px+pit.w-4, GROUND_Y, 4, H-GROUND_Y);
  }
}

function drawSupplies(){
  for (var i=0;i<supplies.length;i++){
    var s = supplies[i];
    if (s.x < camX-40 || s.x > camX+W+40) continue;
    var bx = s.x - camX, by = s.y + Math.sin(performance.now()/300 + s.bob)*5;
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(bx-16, by-14, 32, 26);
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(bx-16, by-14, 32, 8);
    ctx.fillStyle = '#f4d03f';
    ctx.fillRect(bx-3, by-14, 6, 26);
    ctx.fillRect(bx-16, by-4, 32, 6);
  }
}

function render(){
  ctx.save();
  if (shakeT > 0){
    ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);
  }
  drawBG();

  if (state === 'menu'){
    ctx.fillStyle = '#6b5f3e'; ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx.fillStyle = '#7fa04a'; ctx.fillRect(0, GROUND_Y, W, 8);
    drawTank(W/2, GROUND_Y, 1, '#4a7a3a', performance.now()/1000);
    ctx.restore();
    return;
  }

  drawGround();
  drawSupplies();

  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if (!e.alive || e.x < camX-60 || e.x > camX+W+60) continue;
    drawTank(e.x - camX, e.y, e.dir, '#a03a2a', e.trackT);
  }

  if (!(player.inv > 0 && Math.floor(performance.now()/80)%2 === 0)){
    player.trackT += 0.016 * (Math.abs(player.vx)/5 + 0.4);
    drawTank(player.x - camX, player.y, player.face, '#4a7a3a', player.trackT);
  }

  for (var i=0;i<bullets.length;i++){
    var b = bullets[i];
    ctx.fillStyle = b.from==='p' ? '#ffe066' : '#ff6b6b';
    ctx.beginPath();
    ctx.arc(b.x - camX, b.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  for (var i=0;i<particles.length;i++){
    var q = particles[i];
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - camX - 3, q.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  for (var i=0;i<banners.length;i++){
    var bn = banners[i];
    ctx.globalAlpha = Math.min(1, bn.life);
    ctx.fillStyle = '#f4d03f';
    ctx.font = 'bold 30px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(bn.text, W/2, bn.y + (1.2-bn.life)*30);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  ctx.restore();
}

var last = 0;
function loop(t){
  var dt = Math.min(0.05, (t - last)/1000 || 0.016);
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
makeLevel();
requestAnimationFrame(loop);

function resize(){
  var aw = window.innerWidth, ah = window.innerHeight;
  var scale = Math.min(aw / W, ah / H);
  cv.style.width = (W*scale) + 'px';
  cv.style.height = (H*scale) + 'px';
}
addEventListener('resize', resize);
resize();
})();
</script>
</body>
</html>
