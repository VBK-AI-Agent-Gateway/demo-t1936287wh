<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克跳坑 Tank Hop - 经典版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#1a1c2c; overflow:hidden; font-family:"Courier New",monospace; color:#f4f4f4; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#8ec06c; image-rendering:pixelated; max-width:100%; max-height:100%; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,12,24,.88); text-align:center; z-index:10; padding:20px; }
  .hidden { display:none !important; }
  h1 { font-size:clamp(28px,6vw,64px); color:#ffd866; letter-spacing:4px; text-shadow:4px 4px 0 #b86e3b; margin-bottom:8px; }
  .sub { color:#9ccfd8; font-size:clamp(12px,2vw,18px); margin-bottom:24px; }
  .btn { background:#ffd866; color:#1a1c2c; border:none; padding:14px 44px; font-size:22px; font-weight:bold;
    font-family:inherit; cursor:pointer; border-radius:4px; box-shadow:0 6px 0 #b8933a; margin-top:10px; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #b8933a; }
  .hint { margin-top:26px; color:#a8a8b3; font-size:13px; line-height:1.8; }
  .best { color:#a6e3a1; font-size:16px; margin-top:14px; }
  #go-score { font-size:clamp(24px,5vw,44px); color:#f38ba8; margin:6px 0; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:8px 14px; font-size:clamp(13px,2.4vw,20px); font-weight:bold; text-shadow:2px 2px 0 #000;
    pointer-events:none; z-index:5; color:#fff; }
  #hud .lives { color:#f38ba8; }
  #hud .dist { color:#ffd866; }
  #ctrls { position:absolute; bottom:12px; left:0; right:0; display:none; justify-content:space-between;
    padding:0 16px; z-index:6; user-select:none; }
  .pad { display:flex; gap:10px; }
  .tb { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#fff; touch-action:none; }
  .tb:active { background:rgba(255,216,102,.5); }
  @media (pointer:coarse) { #ctrls { display:flex; } }
  #pauseBtn { position:absolute; top:6px; right:8px; z-index:7; background:rgba(0,0,0,.4);
    border:1px solid #fff; color:#fff; font-family:inherit; font-size:14px; padding:4px 10px; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>

  <div id="hud">
    <span class="dist">距离 <span id="uiDist">0</span> m</span>
    <span>得分 <span id="uiScore">0</span></span>
    <span class="lives">♥ <span id="uiLives">3</span></span>
  </div>
  <button id="pauseBtn">暂停</button>

  <div id="ctrls">
    <div class="pad">
      <div class="tb" data-k="left">◀</div>
      <div class="tb" data-k="right">▶</div>
    </div>
    <div class="pad">
      <div class="tb" data-k="jump">⤒</div>
      <div class="tb" data-k="fire">●</div>
    </div>
  </div>

  <div class="overlay" id="menu">
    <h1>坦克跳坑</h1>
    <div class="sub">TANK HOP · 经典版 · 跨越深坑，击毁敌军</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hint">
      ← → / A D 移动 &nbsp;·&nbsp; ↑ / W / 空格 跳跃 &nbsp;·&nbsp; J / K 射击<br>
      P 暂停 &nbsp;·&nbsp; 掉进坑里或生命值归零则结束
    </div>
    <div class="best" id="bestScore">最高分 0</div>
  </div>

  <div class="overlay hidden" id="over">
    <h1>游戏结束</h1>
    <div class="sub">你行驶了多远？</div>
    <div id="go-score">0 分</div>
    <div class="best" id="go-best">最高分 0</div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>

  <div class="overlay hidden" id="pauseOv">
    <h1>已暂停</h1>
    <button class="btn" id="resumeBtn">继续</button>
  </div>
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GY = H - 90;
const GRAV = 0.72, VW = 4.5;

const ui = {
  dist: document.getElementById('uiDist'),
  score: document.getElementById('uiScore'),
  lives: document.getElementById('uiLives'),
  menu: document.getElementById('menu'),
  over: document.getElementById('over'),
  pauseOv: document.getElementById('pauseOv'),
  goScore: document.getElementById('go-score'),
  best: document.getElementById('bestScore'),
  goBest: document.getElementById('go-best'),
};

let state = 'menu';
let camX = 0, score = 0, dist = 0, kills = 0;
let best = +(localStorage.getItem('tankhop_best')||0);
ui.best.textContent = '最高分 ' + best;

let holes = [], grounds = [], enemies = [], bullets = [], eBullets = [], parts = [], items = [];
let nextX = 0;

function resetWorld(){
  holes=[]; grounds=[]; enemies=[]; bullets=[]; eBullets=[]; parts=[]; items=[];
  camX = 0; score = 0; dist = 0; kills = 0;
  nextX = 0; genTo(W*3);
}
function genTo(limit){
  while(nextX < limit){
    if(Math.random() < 0.45 && nextX > 600){
      const w = 90 + Math.random()*140;
      holes.push({x:nextX, w:w});
      nextX += w + 180 + Math.random()*220;
    } else {
      const seg = 160 + Math.random()*300;
      grounds.push({x:nextX, w:seg});
      if(Math.random() < 0.55 && nextX > 900){
        enemies.push({x:nextX+seg*0.5, y:GY-34, w:52, h:34, dir:-1, hp:1, alive:true,
                       cd:80+Math.random()*80});
      }
      if(Math.random() < 0.3){
        items.push({x:nextX+seg*0.5, y:GY-90, got:false, t:Math.random()*6});
      }
      nextX += seg + 40;
    }
  }
}

function onGround(x){
  for(const h of holes) if(x > h.x && x < h.x + h.w) return false;
  return x > 0;
}

const P = { x:120, y:GY-40, w:56, h:40, vx:0, vy:0, onG:true, face:1,
            lives:3, inv:0, fireCd:0, track:0 };

function resetPlayer(){
  P.x=120; P.y=GY-40; P.vx=0; P.vy=0; P.onG=true; P.face=1;
  P.lives=3; P.inv=0; P.fireCd=0; P.track=0;
}

const keys = {left:false, right:false, jump:false, fire:false};
let jumpLatch = false, fireLatch = false;

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  if(k==='arrowleft'||k==='a') keys.left=true;
  if(k==='arrowright'||k==='d') keys.right=true;
  if(k==='arrowup'||k==='w'||k===' ') keys.jump=true;
  if(k==='j'||k==='k'||k==='enter') keys.fire=true;
  if(k==='p'||k==='escape') togglePause();
  if(k==='r' && state==='over') startGame();
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.left=false;
  if(k==='arrowright'||k==='d') keys.right=false;
  if(k==='arrowup'||k==='w'||k===' ') keys.jump=false;
  if(k==='j'||k==='k'||k==='enter') keys.fire=false;
});

document.querySelectorAll('.tb').forEach(b=>{
  const k = b.dataset.k;
  const on = e=>{ e.preventDefault(); if(k==='jump') keys.jump=true; if(k==='fire') keys.fire=true; };
  const off = e=>{ e.preventDefault(); if(k==='jump') keys.jump=false; if(k==='fire') keys.fire=false; };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
});

function fire(){
  if(P.fireCd>0) return;
  P.fireCd = 16;
  bullets.push({x:P.x + (P.face>0? P.w : -14), y:P.y+12, vx:P.face*9, w:14, h:6});
  parts.push({x:P.x+(P.face>0?P.w+6:6), y:P.y+14, vx:P.face*2, vy:-0.5, life:8, c:'#ffd866', s:8});
}

function damage(){
  if(P.inv>0) return;
  P.lives--; P.inv = 90;
  ui.lives.textContent = Math.max(0,P.lives);
  for(let i=0;i<14;i++) parts.push({x:P.x+P.w/2, y:P.y+P.h/2,
    vx:(Math.random()-.5)*8, vy:(Math.random()-.5)*8-2, life:30+Math.random()*20, c:'#f38ba8', s:5});
  if(P.lives<=0) gameOver();
}

function gameOver(){
  state='over';
  if(score>best){ best=score; localStorage.setItem('tankhop_best', best); }
  ui.goScore.textContent = score + ' 分 · ' + Math.floor(dist) + ' 米';
  ui.goBest.textContent = '最高分 ' + best;
  ui.over.classList.remove('hidden');
}

function update(){
  if(keys.left){ P.vx = -4; P.face=-1; }
  else if(keys.right){ P.vx = 4; P.face=1; }
  else P.vx *= 0.6;
  if(Math.abs(P.vx)<0.1) P.vx=0;

  if(keys.jump && P.onG && !jumpLatch){ P.vy = -14.5; P.onG=false; jumpLatch=true; }
  if(!keys.jump) jumpLatch=false;

  if(keys.fire && !fireLatch){ fire(); fireLatch=true; }
  if(!keys.fire) fireLatch=false;
  if(P.fireCd>0) P.fireCd--;

  P.vy += GRAV;
  if(P.vy>18) P.vy=18;

  P.x += P.vx;
  if(P.x < camX+4) P.x = camX+4;

  P.y += P.vy;
  if(P.vy>=0 && onGround(P.x+P.w/2) && P.y+P.h >= GY){
    P.y = GY-P.h; P.vy=0; P.onG=true;
  } else { P.onG = false; }

  if(P.y > H+80){ gameOver(); return; }

  P.track += Math.abs(P.vx);

  const target = P.x - W*0.38;
  if(target > camX){ camX += Math.min(VW, Math.max(0, target-camX)); if(camX<0)camX=0; }

  dist = Math.max(dist, camX/16);
  score = Math.floor(dist) + kills*10;
  ui.dist.textContent = Math.floor(dist);
  ui.score.textContent = score;

  if(P.inv>0) P.inv--;

  genTo(camX + W*2.5);

  bullets = bullets.filter(b=>{
    b.x += b.vx;
    if(b.x < camX-60 || b.x > camX+W+200) return false;
    for(const e of enemies){
      if(e.alive && b.x+14>e.x && b.x<e.x+e.w && b.y+e.h>e.y && b.y<e.y+e.h){
        e.alive=false; kills++;
        for(let i=0;i<12;i++) parts.push({x:e.x+e.w/2, y:e.y+e.h/2,
          vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7-2, life:26, c:'#fab387', s:6});
        return false;
      }
    }
    return true;
  });

  enemies = enemies.filter(e=> e.x > camX-300);
  for(const e of enemies){
    if(!e.alive) continue;
    if(e.x > P.x) e.dir = -1; else e.dir = 1;
    const ahead = e.x + (e.dir>0? e.w+6 : -6);
    if(onGround(ahead)) e.x += e.dir * 1.1;
    e.cd--;
    if(e.cd<=0 && Math.abs(e.x-P.x)<460){
      e.cd = 110 + Math.random()*70;
      eBullets.push({x:e.x+(e.dir>0?e.w: -12), y:e.y+12, vx:e.dir*5.5, w:12, h:6});
    }
    if(P.x+P.w>e.x && P.x<e.x+e.w && P.y+P.h>e.y && P.y<e.y+e.h) damage();
  }

  eBullets = eBullets.filter(b=>{
    b.x += b.vx;
    if(b.x < camX-60 || b.x > camX+W+60) return false;
    if(P.inv<=0 && b.x+P.w>P.x && b.x<P.x+P.w && b.y+P.h>P.y && b.y<P.y+P.h){ damage(); return false; }
    if(!onGround(b.x)) return false;
    return true;
  });

  for(const it of items){
    it.t += 0.1;
    if(!it.got && Math.abs(P.x+P.w/2-it.x)<40 && Math.abs(P.y+P.h/2-it.y)<46){
      it.got = true; score += 50;
      for(let i=0;i<8;i++) parts.push({x:it.x, y:it.y,
        vx:(Math.random()-.5)*5, vy:(Math.random()-.5)*5, life:24, c:'#a6e3a1', s:5});
    }
  }
  items = items.filter(i=> i.x > camX-100 && !i.got);

  parts = parts.filter(p=>{ p.life--; p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; return p.life>0; });

  if(P.onG && Math.abs(P.vx)>1 && Math.random()<0.5){
    parts.push({x:P.x+(P.face>0?4:P.w-4), y:P.y+P.h-4,
      vx:-P.vx*0.3, vy:-Math.random(), life:14, c:'#cdd6d3', s:4});
  }
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function drawTank(x, y, w, h, face, color){
  ctx.fillStyle = '#3a3f52';
  ctx.fillRect(x, y+h-12, w, 12);
  ctx.fillStyle = '#22253a';
  for(let i=0;i<w;i+=10) ctx.fillRect(x+2+i, y+h-10, 6, 8);
  ctx.fillStyle = color;
  ctx.fillRect(x+2, y+8, w-4, h-14);
  ctx.fillStyle = shade(color, -20);
  ctx.beginPath(); ctx.arc(x+w/2, y+8, 13, Math.PI, 0); ctx.fill();
  ctx.fillRect(x+w/2-13, y+6, 26, 6);
  ctx.fillStyle = '#22253a';
  if(face>0) ctx.fillRect(x+w/2, y+4, 22, 6);
  else ctx.fillRect(x+w/2-22, y+4, 22, 6);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x+6, y+12, w-14, 4);
}
function star(cx, cy, spikes, r1, r2){
  let rot = Math.PI/2*3, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-r1);
  for(let i=0;i<spikes;i++){
    ctx.lineTo(cx+Math.cos(rot)*r1, cy+Math.sin(rot)*r1); rot+=step;
    ctx.lineTo(cx+Math.cos(rot)*r2, cy+Math.sin(rot)*r2); rot+=step;
  }
  ctx.closePath();
}

function draw(){
  const sky = ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#6bb5d8'); sky.addColorStop(1,'#bfe3ef');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,GY);

  ctx.fillStyle = '#5f8f7a';
  for(let i=-1;i<7;i++){
    const bx = i*260 - (camX*0.3)%260;
    ctx.beginPath();
    ctx.moveTo(bx, GY); ctx.lineTo(bx+130, GY-150); ctx.lineTo(bx+260, GY);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for(let i=0;i<6;i++){
    const cx = (i*340 + 100 - camX*0.5) % (W+400) - 200;
    const cy = 50 + (i%3)*45;
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, 7); ctx.arc(cx+26, cy-8, 20, 0, 7); ctx.arc(cx+52, cy, 22, 0, 7);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(-camX, 0);

  ctx.fillStyle = '#7a5230';
  ctx.fillRect(camX-40, GY, W+80, H-GY);
  for(const g of grounds){
    if(g.x+g.w<camX-50 || g.x>camX+W+50) continue;
    ctx.fillStyle = '#5a8f3c';
    ctx.fillRect(g.x, GY, g.w, 10);
    ctx.fillStyle = '#6bb54a';
    ctx.fillRect(g.x, GY, g.w, 4);
  }
  for(const h of holes){
    if(h.x+h.w<camX-50 || h.x>camX+W+50) continue;
    ctx.fillStyle = '#14141f';
    ctx.fillRect(h.x, GY, h.w, H-GY);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(h.x, GY, 5, H-GY);
    ctx.fillRect(h.x+h.w-5, GY, 5, H-GY);
  }

  for(const it of items){
    const yy = it.y + Math.sin(it.t)*6;
    ctx.fillStyle = '#ffd866';
    ctx.beginPath();
    star(it.x, yy, 5, 12, 6);
    ctx.fill();
  }

  for(const e of enemies){
    if(!e.alive) continue;
    if(e.x+e.w<camX-50 || e.x>camX+W+50) continue;
    drawTank(e.x, e.y, e.w, e.h, e.dir, '#d03b3b');
  }

  if(!(P.inv>0 && Math.floor(P.inv/5)%2)){
    drawTank(P.x, P.y, P.w, P.h, P.face, '#4caf50');
  }

  ctx.fillStyle = '#ffd866';
  for(const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#f38ba8';
  for(const b of eBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

  for(const p of parts){
    ctx.globalAlpha = Math.min(1, p.life/20);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 6;
  ctx.strokeRect(3,3,W-6,H-6);
}

let last = 0;
function loop(t){
  requestAnimationFrame(loop);
  if(t - last < 1000/60) return;
  last = t;
  if(state==='play'){ update(); }
  draw();
}
requestAnimationFrame(loop);

function startGame(){
  resetWorld(); resetPlayer();
  ui.lives.textContent = '3';
  ui.menu.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.pauseOv.classList.add('hidden');
  state = 'play';
}
function togglePause(){
  if(state==='play'){ state='pause'; ui.pauseOv.classList.remove('hidden'); }
  else if(state==='pause'){ state='play'; ui.pauseOv.classList.add('hidden'); }
}
document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('resumeBtn').onclick = togglePause;
document.getElementById('pauseBtn').onclick = togglePause;

resetWorld(); resetPlayer();
})();
</script>
</body>
</html>
